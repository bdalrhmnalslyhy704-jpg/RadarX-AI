name: RadarX Phase 1 Tests

on:
  push:
    branches:
      - main
      - 'phase1-*'
  pull_request:
    branches:
      - main

jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 1 tests
        run: node --test phase1/tests/*.test.mjs
