name: Build 224 Cognitive Neural Surgical Verification

on:
  push:
    branches:
      - research/daily-early-riser-mlp-budget-20261113
    paths:
      - 'phase2/core/cognitive-brain.mjs'
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/core/hybrid-tcn-attention-benchmark.mjs'
      - 'phase2/tests/hybrid-tcn-attention-benchmark.test.mjs'
      - 'phase2/tests/cognitive-brain.test.mjs'
      - 'phase2/tests/temporal-neural-brain.test.mjs'
      - 'phase2/tools/daily-early-riser-historical-census.mjs'
      - 'phase2/core/daily-early-riser-census.mjs'
      - 'phase2/tests/daily-early-riser-census.test.mjs'
      - '.github/workflows/daily-early-riser-census.yml'
      - 'research/TRIGGER_FULL_DAILY_EARLY_RISER_CENSUS.txt'
      - '.github/workflows/cognitive-neural-surgical-check.yml'

permissions:
  contents: read

concurrency:
  group: build224-cognitive-neural-surgical-check
  cancel-in-progress: false

jobs:
  syntax-and-unit:
    name: Assert MLP feature contracts, 32-row overfit, hybrid gate and TCN gradients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check neural model and tests
        run: |
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/temporal-neural-brain.mjs
          node --check phase2/core/hybrid-tcn-attention-benchmark.mjs
          node --check phase2/tests/hybrid-tcn-attention-benchmark.test.mjs
          node --check phase2/tests/cognitive-brain.test.mjs
          node --check phase2/tests/temporal-neural-brain.test.mjs
      - name: Run MLP one-batch overfit, neural integration and hybrid regression tests
        run: node --test --test-timeout=180000 phase2/tests/cognitive-brain.test.mjs
      - name: Run checksum census label and horizon audit regressions
        run: node --test --test-timeout=180000 phase2/tests/daily-early-riser-census.test.mjs
      - name: Run TCN finite-difference gradient and workspace equivalence audits
        run: node --test --test-timeout=180000 phase2/tests/temporal-neural-brain.test.mjs
      - name: Run Hybrid TCN Attention timing, feature, gradient and NaN guards
        run: node --test --test-timeout=180000 phase2/tests/hybrid-tcn-attention-benchmark.test.mjs
