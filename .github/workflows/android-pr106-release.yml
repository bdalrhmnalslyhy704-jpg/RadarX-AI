name: RadarX Android PR106 Release

on:
  push:
    branches:
      - release/android-pr106-c8d12d6-20261006

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merged PR106 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1 || true)"
          echo "SDKMANAGER=$SDKMANAGER"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find /usr/local/lib/android /opt/android-sdk /opt/hostedtoolcache -maxdepth 6 -type f -name sdkmanager -print 2>/dev/null | head -n 50 || true
            exit 1
          fi
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$(dirname "$SDKMANAGER"):$SDK_ROOT/platform-tools:$PATH"
          if [[ ! -f "$SDK_ROOT/platforms/android-35/android.jar" || ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify release signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

      - name: Materialize signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/radarx-release.keystore"
          test -s "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Build signed universal APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/radarx-release.keystore
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*$/\\1/p" | head -n 1)"
          test "$PACKAGE" = "com.radarx.app"
          mkdir -p dist
          cp "$APK" dist/RadarX-PR106.apk
          sha256sum dist/RadarX-PR106.apk

      - name: Remove signing keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-PR106-APK
          path: dist/RadarX-PR106.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-pr106.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist/RadarX-PR106.apk"             --repo "${GITHUB_REPOSITORY}"             --title "RadarX Android — PR106 / Seven Radars"             --notes "Signed APK built from merged PR #106 commit c8d12d6f217aeedd628c22350965d4efd321080a. Includes seven-radar control hardening and Radar 7 Professor changes. Paper Trading only; real_order_execution=false; confidence_score=UNKNOWN."
