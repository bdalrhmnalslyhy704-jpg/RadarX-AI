name: RadarX Android APK 6.0
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/radarx-android.yml"
      - "index.html"
      - "RadarX_Ultimate_5.11.js"
      - "radarx-runtime-6.0.js"
      - "RadarX_ProEngine_5.11.js"
      - "radarx-pulse-fusion.js"
      - "radarx-live-chart.js"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release APK (unsigned archive)
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APKs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.0-Android-Installable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish release archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.0-Android-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
