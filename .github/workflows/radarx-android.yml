name: RadarX Android Native 6.4

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/radarx-android.yml"

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build native debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build native release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null

      - name: Inspect native package
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "classes(2)?\.dex|AndroidManifest.xml"
          echo "RadarX Native 6.4 package assembled successfully."

      - name: Prepare installable APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RadarX-6.4-Native.apk
          sha256sum dist/RadarX-6.4-Native.apk

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.4-Native-Android-APK
          path: dist/RadarX-6.4-Native.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.4-Native-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v6.4.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/RadarX-6.4-Native.apk             --repo "${GITHUB_REPOSITORY}"             --title "RadarX 6.4 Native"             --notes "RadarX Native 6.4: native live 1m candle history and incremental updates on the existing managed market WebSocket. Built from commit ${GITHUB_SHA}."             --latest
