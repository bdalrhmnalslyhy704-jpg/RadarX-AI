name: Falcon Eye Quiet Selection Validation

on:
  push:
    branches:
      - build224-falcon-eye-v2-hawkeye-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Falcon Eye selector and market-pulse regression tests
        run: node --test phase2/tests/falcon-eye-radar.test.mjs phase2/tests/falcon-market-pulse.test.mjs
      - name: Full Phase 1 and Phase 2 test suite
        run: npm test
      - name: Required module syntax checks
        run: |
          node --check phase2/core/falcon-eye-radar.mjs
          node --check phase2/core/falcon-market-pulse.mjs
