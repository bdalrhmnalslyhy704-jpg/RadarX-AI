name: RadarX Integrity Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every JavaScript source
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "::group::node --check $f"
            node --check "$f"
            echo "::endgroup::"
          done < <(find . -maxdepth 1 -type f -name 'RadarX_*_5.11.js' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files found"
            exit 1
          fi

      - name: Check every RadarX One-File script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const files = fs.readdirSync('.')
            .filter(name => /^RadarX_ONEFILE_5.11.html$/i.test(name))
            .sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));

          if (!files.length) {
            throw new Error('No RadarX_ONEFILE_*.html files found');
          }

          const scriptRe = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
          const regressionRe = /\bversion\s*:\s*['"][^'"]+['"]\s*\r?\n\s*cycleMs\s*:/;

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(scriptRe)].map(m => m[1]);

            if (scripts.length < 2) {
              throw new Error(`${file}: expected at least 2 script blocks, found ${scripts.length}`);
            }

            for (let i = 0; i < scripts.length; i++) {
              try {
                new vm.Script(scripts[i], {filename: `${file}#script${i + 1}`});
              } catch (err) {
                throw new Error(`${file}#script${i + 1}: ${err.message}`);
              }
            }

            if (regressionRe.test(html)) {
              throw new Error(`${file}: detected missing comma before cycleMs (version -> cycleMs regression)`);
            }

            console.log(`OK: ${file} (${scripts.length} scripts)`);
          }
          NODE

      - name: Verify deployed entry points stay on one version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('index.html', 'utf8');
          const refs = [...index.matchAll(/RadarX_(?:Ultimate|ProEngine)_(\d+(?:\.\d+)*)/g)].map(m => m[1]);
          const unique = [...new Set(refs)];
          if (!unique.length) throw new Error('index.html does not reference a RadarX versioned entry point');
          if (unique.length !== 1) throw new Error(`index.html references multiple RadarX versions: ${unique.join(', ')}`);
          console.log(`index.html version: ${unique[0]}`);
          NODE
