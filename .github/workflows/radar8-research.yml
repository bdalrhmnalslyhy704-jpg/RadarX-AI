name: Radar8 Research on Build224
on:
  push:
    branches:
      - radar8-build224-enhanced-20261006
    paths-ignore:
      - 'radar8-research.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run historical mover fingerprint research
        run: node phase2/tools/radar8-research.mjs
      - name: Commit research report back to branch
        run: |
          set -euo pipefail
          if git diff --quiet -- radar8-research.json; then
            echo "No research report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar8-research.json
          git commit -m "chore: record Radar 8 missed-mover research"
          git push

      - name: Upload research JSON
        uses: actions/upload-artifact@v4
        with:
          name: radar8-research
          path: radar8-research.json
          retention-days: 3
