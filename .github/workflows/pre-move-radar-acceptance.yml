name: Pre-Move Radar Acceptance

on:
  push:
    branches:
      - build224-multi-analyst-20261007
  pull_request:
    branches:
      - build224-multi-analyst-20261007
    paths:
      - '.github/workflows/pre-move-radar-acceptance.yml'
      - 'phase2/http/api.mjs'
      - 'phase2/config.mjs'
      - 'phase2/core/multi-analyst-engine.mjs'
      - 'phase2/market/binance-rest.mjs'
      - 'phase2/server.mjs'
      - 'phase2/push/index.mjs'
      - 'phase2/tests/push.test.mjs'
      - 'phase2/tests/rest.test.mjs'
      - 'phase2/tests/pre-move-watch-notification.test.mjs'
      - 'android/app/src/main/java/com/radarx/app/RadarXFirebaseMessagingService.java'
      - 'android/fcm-watch-notification-regression.mjs'
  workflow_dispatch:

concurrency:
  group: pre-move-radar-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  regression:
    name: Pre-Move unit, API, UI, and history regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Build 224 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check syntax of modified backend and Pre-Move modules
        run: |
          set -euo pipefail
          node --check phase2/http/api.mjs
          node --check phase2/market/universe-scanner.mjs
          node --check phase2/tests/api.test.mjs
          node --check phase2/tests/market-radar.test.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-pre-move.mjs
          node --check android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Run focused scanner and API regression tests
        run: node --test phase2/tests/market-radar.test.mjs phase2/tests/api.test.mjs

      - name: Run Android Pre-Move UI and FCM watch-notification policy regressions
        run: |
          node android/app/src/main/assets/tests/market-radar-integration.test.mjs
          node android/fcm-watch-notification-regression.mjs

      - name: Verify historical replay and outcome accounting tests
        run: node --test phase2/tests/historical-replay-matrix.test.mjs phase2/tests/monthly-historical-replay-lab.test.mjs phase2/tests/radar-signal-outcomes.test.mjs

      - name: Run complete Phase 2 regression suite
        run: node phase2/tests/run-tests.mjs phase2

      - name: Publish regression result as a commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'pre-move-radar-tests',
              description: passed ? 'Pre-Move tests and Phase 2 regression passed' : 'Pre-Move tests or Phase 2 regression failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  live_backend:
    # Live DHDTech is a production check, not a PR preview. It runs after a
    # push to Build 224 (or manual dispatch), when the service can pick up code.
    if: github.event_name != 'pull_request'
    name: Live DHDTech Pre-Move market-data acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
    steps:
      - name: Allow production deployment rollout
        run: sleep 60

      - name: Check DHDTech deployment contract
        timeout-minutes: 6
        run: |
          set -euo pipefail
          CODE=""
          # A push can briefly remove the old container before the new DHDTech
          # container is healthy. Retry only transport/gateway errors; never
          # treat a 502 as a successful health check or accept a non-200 result.
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -o "$RUNNER_TEMP/deployment-info.json" -w "%{http_code}" "$BASE/api/deployment-info" || true)"
            if [ "$CODE" = "200" ]; then
              break
            fi
            case "$CODE" in
              502|503|504|000)
                echo "::warning::DHDTech deployment-info transient HTTP $CODE on attempt $attempt/8."
                if [ "$attempt" -lt 8 ]; then sleep 15; fi
                ;;
              *)
                echo "::error::DHDTech deployment-info returned non-retryable HTTP $CODE"
                cat "$RUNNER_TEMP/deployment-info.json" 2>/dev/null || true
                exit 1
                ;;
            esac
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::DHDTech deployment-info stayed unavailable after 8 bounded attempts (last HTTP $CODE)."
            cat "$RUNNER_TEMP/deployment-info.json" 2>/dev/null || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/deployment-info.json','utf8'));
          if (b.build_version !== 'Build 224') throw new Error('BUILD_VERSION_NOT_224');
          if (b.paper_trading !== true || b.real_order_execution !== false) throw new Error('READ_ONLY_POLICY_INVALID');
          const push=b.push||{};
          console.log('DHDTECH_PUSH_PROVIDER_STATUS '+JSON.stringify({
            provider:String(push.provider||'unknown'),enabled:push.enabled===true,
            physical_device_receipt:'NOT_VERIFIED_BY_SERVER_HEALTH'
          }));
          NODE

      - name: Audit screenshot gainers against closed Spot candles before and at the move
        timeout-minutes: 3
        run: |
          set -euo pipefail
          URL="$BASE/api/early-mover-case-study?threshold_pct=5&window_hours=24&lead_minutes=60&as_of=2026-10-27T11:07:00.000Z"
          TMP="$RUNNER_TEMP/early-mover-case-study.tmp.json"
          OUT="$RUNNER_TEMP/early-mover-case-study.json"
          CODE="000"
          READY=false
          for attempt in $(seq 1 5); do
            rm -f "$TMP"
            CURL_EXIT=0
            CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 35 -o "$TMP" -w "%{http_code}" "$URL")" || CURL_EXIT=$?
            if [ "$CURL_EXIT" -eq 0 ] && [ "$CODE" = "200" ]; then
              if node --input-type=module - "$TMP" <<'NODE'
          import fs from 'node:fs';
          try {
            const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            if(body?.report!=='RADARX_EARLY_MOVER_CASE_STUDY_V1'||!Array.isArray(body.results)||body.results.length!==6) process.exit(1);
          } catch { process.exit(1); }
          NODE
              then
                mv "$TMP" "$OUT"
                READY=true
                break
              fi
              echo "::warning::Early-mover case-study response was not complete JSON on attempt $attempt/5."
            else
              case "$CODE" in
                000|404|429|502|503|504)
                  echo "::warning::Early-mover historical endpoint not ready (curl=$CURL_EXIT HTTP=$CODE) on attempt $attempt/5."
                  ;;
                *)
                  echo "::error::Early-mover case-study API returned unexpected HTTP $CODE."
                  cat "$TMP" 2>/dev/null | head -c 3000 || true
                  exit 1
                  ;;
              esac
            fi
            rm -f "$TMP"
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          if [ "$READY" != "true" ]; then
            echo "::error::DHDTech did not expose a complete early-mover case study after rollout retries."
            cat "$TMP" 2>/dev/null | head -c 3000 || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/early-mover-case-study.json','utf8'));
          if(b.source!=='BINANCE_SPOT_PUBLIC_REST'||b.policy?.paper_trading!==true||b.policy?.real_order_execution!==false)
            throw new Error('EARLY_MOVER_CASE_STUDY_POLICY_OR_SOURCE_INVALID');
          const keys=[
            'return_15m_pct','return_1h_pct','return_24h_pct',
            'quote_volume_ratio_15m_vs_prior_2h','trade_count_ratio_15m_vs_prior_2h',
            'taker_buy_share_15m','compression_ratio_20_vs_previous_20',
            'range_1h_pct','distance_below_prior_1h_high_pct',
            'close_location_pct','three_higher_lows','relative_strength_vs_btc_1h_pct'
          ];
          const replaySummary=replay=>{
            if(!replay||typeof replay!=='object')return null;
            return {
              status:replay.status,as_of:replay.as_of,no_future_data_used:replay.no_future_data_used,
              latest_closed_candle_at:replay.latest_closed_candle_at,history:replay.history,
              core:replay.core?{
                stage:replay.core.stage,score:replay.core.score,
                evidence_complete:replay.core.evidence_complete,
                flow_transition_confirmed:replay.core.flow_transition_confirmed,
                price_window_valid:replay.core.price_window_valid,
                structure_confirmed:replay.core.structure_confirmed,
                already_moved:replay.core.already_moved,
                session_return_pct:replay.core.session_return_pct,
                one_hour_return_pct:replay.core.one_hour_return_pct,
                volume_acceleration:replay.core.volume_acceleration,
                trade_acceleration:replay.core.trade_acceleration,
                taker_buy_ratio:replay.core.taker_buy_ratio,
                taker_buy_acceleration:replay.core.taker_buy_acceleration,
                mean_close_location:replay.core.mean_close_location,
                missing_evidence:replay.core.missing_evidence
              }:null,
              core_setup_gate_passed:replay.core_setup_gate_passed,
              full_alert_reconstruction:replay.full_alert_reconstruction||replay.full_alert_reconstruction===false?replay.full_alert_reconstruction:replay.full_alert_reconstruction??null,
              limitation:replay.limitation||null,reason:replay.reason||null
            };
          };
          const rows=b.results.map(r=>{
            if(r.no_future_data_used!==true)throw new Error('EARLY_MOVER_FUTURE_DATA_GUARD_FAILED:'+r.symbol);
            if(['MARKET_DATA_FETCH_FAILED','INSUFFICIENT_CLOSED_CANDLES'].includes(r.status))
              throw new Error('EARLY_MOVER_HISTORY_UNAVAILABLE:'+r.symbol+':'+r.status+':'+String(r.reason||r.error||''));
            const features=f=>f?Object.fromEntries(keys.map(k=>[k,f[k]??null])):null;
            const replayRows=[
              r.pre_move?.production_pre_move_replay,
              r.at_crossing?.production_pre_move_replay,
              ...(Array.isArray(r.lead_snapshots_before_crossing)?r.lead_snapshots_before_crossing.map(x=>x.production_pre_move_replay):[]),
              ...(Array.isArray(r.intraday_runup?.lead_snapshots_before_runup)?r.intraday_runup.lead_snapshots_before_runup.map(x=>x.production_pre_move_replay):[])
            ].filter(Boolean);
            for(const replay of replayRows){
              if(replay.no_future_data_used!==true)throw new Error('PRODUCTION_DETECTOR_REPLAY_USED_FUTURE_DATA:'+r.symbol);
              if(replay.as_of&&replay.latest_closed_candle_at&&Date.parse(replay.latest_closed_candle_at)>Date.parse(replay.as_of))
                throw new Error('PRODUCTION_DETECTOR_REPLAY_CANDLE_AFTER_AS_OF:'+r.symbol);
            }
            return {
              symbol:r.symbol,status:r.status,closed_candles:r.closed_candles,
              first_crossing_at:r.crossing?.observed_at??null,
              price_before_move:r.pre_move?.price??null,
              minutes_before_crossing:r.pre_move?.minutes_before_crossing??null,
              price_at_crossing:r.crossing?.price??null,
              price_24h_reference:r.crossing?.price_24h_before_crossing??null,
              trailing_24h_return_at_crossing_pct:r.crossing?.trailing_24h_return_pct??null,
              change_from_watch_snapshot_to_crossing_pct:r.crossing?.move_from_pre_move_snapshot_pct??r.pre_move?.price_change_from_pre_move_to_crossing_pct??null,
              features_before:features(r.pre_move?.features),
              factors_before:r.pre_move?.early_evidence?.checks??null,
              features_at_crossing:features(r.at_crossing?.features),
              factors_at_crossing:r.at_crossing?.early_evidence?.checks??null,
              production_detector_replay_before:replaySummary(r.pre_move?.production_pre_move_replay),
              production_detector_replay_at_crossing:replaySummary(r.at_crossing?.production_pre_move_replay),
              intraday_runup_status:r.intraday_runup?.status??null,
              intraday_runup_definition:r.intraday_runup?.definition??null,
              runup_reference_candle_at:r.intraday_runup?.baseline?.observed_at??null,
              runup_reference_candle_close:r.intraday_runup?.baseline?.candle_close??null,
              runup_reference_low:r.intraday_runup?.baseline?.reference_low??null,
              runup_at:r.intraday_runup?.runup?.observed_at??null,
              runup_price:r.intraday_runup?.runup?.price??null,
              runup_from_reference_low_pct:r.intraday_runup?.runup?.return_from_reference_low_pct??null,
              runup_from_reference_close_pct:r.intraday_runup?.runup?.return_from_baseline_close_pct??null,
              snapshots_before_runup:(r.intraday_runup?.lead_snapshots_before_runup??[]).map(x=>({
                lead_minutes:x.requested_lead_minutes,status:x.status,observed_at:x.observed_at,
                price:x.price,change_to_runup_pct:x.price_change_to_runup_pct,
                production_detector_replay:replaySummary(x.production_pre_move_replay)
              })),
              snapshots_before_crossing:(r.lead_snapshots_before_crossing??[]).map(x=>({
                lead_minutes:x.requested_lead_minutes,status:x.status,observed_at:x.observed_at,
                price:x.price,change_to_crossing_pct:x.price_change_to_crossing_pct,
                production_detector_replay:replaySummary(x.production_pre_move_replay)
              })),
              runup_retrospective_outcome:{
                latest_at:r.intraday_runup?.retrospective_outcome?.latest_observed_at??null,
                latest_price:r.intraday_runup?.retrospective_outcome?.latest_price??null,
                return_from_runup_to_latest_pct:r.intraday_runup?.retrospective_outcome?.return_from_runup_to_latest_pct??null,
                max_favorable_pct:r.intraday_runup?.retrospective_outcome?.max_favorable_pct_since_runup??null,
                max_adverse_pct:r.intraday_runup?.retrospective_outcome?.max_adverse_pct_since_runup??null,
                basis:r.intraday_runup?.retrospective_outcome?.basis??null
              },
              orderbook_history_status:r.orderbook_history_status
            };
          });
          console.log('EARLY_MOVER_RETROSPECTIVE_AUDIT '+JSON.stringify({
            threshold_pct:b.options.threshold_pct,
            threshold_measure:b.threshold_measure,
            window_hours:b.options.window_hours,
            lead_minutes:b.options.lead_minutes,
            benchmark:b.benchmark,
            results:rows,
            production_detector_replay:{
              movers_replayed:rows.filter(row=>row.production_detector_replay_before||row.snapshots_before_crossing?.some(x=>x.production_detector_replay)).length,
              core_ready_at_least_15m_before_crossing:rows.filter(row=>
                row.snapshots_before_crossing?.some(x=>Number(x.lead_minutes)>=15&&x.production_detector_replay?.core_setup_gate_passed===true)
              ).map(row=>row.symbol),
              interpretation:'Core setup replay only; a passing stage does not prove a live notification or phone push was sent.'
            },
            limitation:'Retrospective closed-candle replay, not a validated forecast. Historical order-book depth and the live ticker-activity baseline are unavailable.'
          }));
          NODE

      - name: Verify one live scan from the 20-analyst center on DHDTech
        timeout-minutes: 6
        run: |
          set -euo pipefail
          BASE_URL="$BASE/api/multi-analyst?quote=USDT&limit=10"
          REQUEST_ID="gha-${GITHUB_SHA}"
          START_URL="${BASE_URL}&background=1&scan=1&_ts=${REQUEST_ID}"
          START_TMP="$RUNNER_TEMP/multi-analyst-start.tmp.json"
          START_CODE="000"
          START_CURL_EXIT=0
          STARTED=false
          for attempt in $(seq 1 8); do
            rm -f "$START_TMP"
            START_CURL_EXIT=0
            START_CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 -o "$START_TMP" -w "%{http_code}" "$START_URL")" || START_CURL_EXIT=$?
            if [ "$START_CURL_EXIT" -eq 0 ] && [ "$START_CODE" = "202" ]; then
              STARTED=true
              break
            fi
            case "$START_CODE" in
              502|503|504|000)
                echo "::warning::DHDTech analyst scan enqueue transient failure (curl=$START_CURL_EXIT HTTP=$START_CODE) on attempt $attempt/8."
                sleep 5
                ;;
              *)
                echo "::error::DHDTech rejected the analyst scan enqueue (curl=$START_CURL_EXIT HTTP=$START_CODE)."
                cat "$START_TMP" 2>/dev/null | head -c 2000 || true
                exit 1
                ;;
            esac
          done
          if [ "$STARTED" != "true" ]; then
            echo "::error::Could not enqueue the bounded background 20-analyst scan after 8 attempts (curl=$START_CURL_EXIT HTTP=$START_CODE)."
            cat "$START_TMP" 2>/dev/null | head -c 2000 || true
            exit 1
          fi

          # One request may be reset after the application has completed a large
          # JSON response. Treat transport failures and truncated JSON as transient
          # polling errors; only a parsed, completed live scan can satisfy this gate.
          POLL_URL="${BASE_URL}&progress=1&summary=1&scan=1&_ts=${REQUEST_ID}"
          POLL_TMP="$RUNNER_TEMP/multi-analyst.poll.tmp.json"
          POLL_JSON="$RUNNER_TEMP/multi-analyst.json"
          READY=false
          for attempt in $(seq 1 48); do
            rm -f "$POLL_TMP"
            CURL_EXIT=0
            CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -o "$POLL_TMP" -w "%{http_code}" "$POLL_URL")" || CURL_EXIT=$?
            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "::warning::DHDTech analyst poll transport failed (curl=$CURL_EXIT HTTP=${CODE:-unknown}) on attempt $attempt/48."
              rm -f "$POLL_TMP"
              sleep 5
              continue
            fi
            case "$CODE" in
              200)
                if ! node --input-type=module - "$POLL_TMP" <<'NODE'
          import fs from 'node:fs';
          try {
            const body=fs.readFileSync(process.argv[2],'utf8');
            const parsed=JSON.parse(body);
            if(!parsed || typeof parsed!=='object' || Array.isArray(parsed)) process.exit(1);
          } catch { process.exit(1); }
          NODE
                then
                  echo "::warning::DHDTech analyst poll returned incomplete JSON on attempt $attempt/48; retrying without treating it as completed."
                  rm -f "$POLL_TMP"
                  sleep 5
                  continue
                fi
                mv "$POLL_TMP" "$POLL_JSON"
                STATE="$(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/multi-analyst.json','utf8'));console.log(b.status||(b.scan?.completed===true?'ready':'unknown'))")"
                COMPLETED="$(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/multi-analyst.json','utf8'));console.log(b.scan?.completed===true?'true':'false')")"
                SCAN_ERROR="$(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/multi-analyst.json','utf8'));console.log(String(b.error||b.scan?.error||b.monitoring?.last_error||b.diagnostics?.last_scan_error||'').replace(/[^A-Za-z0-9_:.-]/g,''))")"
                if [ "$STATE" = "ready" ] && [ "$COMPLETED" = "true" ]; then
                  READY=true
                  break
                fi
                if [ "$STATE" = "error" ] || { [ "$STATE" = "not_ready" ] && [ -n "$SCAN_ERROR" ]; }; then
                  echo "::error::DHDTech 20-analyst background scan failed: ${SCAN_ERROR:-unknown}"
                  cat "$POLL_JSON" | head -c 8000
                  exit 1
                fi
                ;;
              202)
                rm -f "$POLL_TMP"
                ;;
              502|503|504|000)
                echo "::warning::DHDTech analyst progress poll transient HTTP $CODE on attempt $attempt/48."
                rm -f "$POLL_TMP"
                ;;
              *)
                echo "::error::DHDTech analyst progress returned non-retryable HTTP $CODE."
                cat "$POLL_TMP" 2>/dev/null | head -c 2000 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$READY" != "true" ]; then
            echo "::error::DHDTech 20-analyst background scan did not complete within the bounded polling window."
            cat "$POLL_JSON" 2>/dev/null | head -c 8000 || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/multi-analyst.json','utf8'));
          const u=b.universe||{},d=b.diagnostics||{},m=b.meta||{},scan=b.scan||{},monitor=b.monitoring||{};
          const summary={
            status:b.status||'ready',
            analysis_mode:m.analysis_mode,
            live:m.live,
            scan,
            scanned:u.scanned,
            deep_scan_pool:u.deep_scan_pool,
            attempted_analyses:d.attempted_analyses,
            successful_analyses:d.successful_analyses,
            gate_rejected:d.gate_rejected,
            failed_analyses:d.failed_analyses,
            scan_failure_count:d.scan_failure_count||0,
            candidates:Number(b.result_counts?.candidates),
            watchlist:Number(b.result_counts?.watchlist),
            lab_results:Number(b.result_counts?.lab_results),
            error:b.error||d.last_scan_error||monitor.last_error||scan.error||null,
            last_error:monitor.last_error||null
          };
          console.log('MULTI_ANALYST_DHDTECH_LIVE_SCAN '+JSON.stringify(summary));
          const problems=[];
          if(m.analysis_mode!=='FORCED_SCAN')problems.push('MULTI_ANALYST_FORCED_SCAN_NOT_CONFIRMED');
          if(scan.requested!==true||scan.completed!==true||scan.error)problems.push('MULTI_ANALYST_SCAN_NOT_COMPLETED');
          if(m.live!==true)problems.push('MULTI_ANALYST_NO_VALID_LIVE_DATA');
          if(m.paper_trading!==true||m.real_order_execution!==false||m.confidence_score!=='UNKNOWN')problems.push('MULTI_ANALYST_READ_ONLY_POLICY_INVALID');
          if(!(Number(u.scanned)>0))problems.push('MULTI_ANALYST_ZERO_ROWS_SCANNED');
          if(!(Number(d.attempted_analyses)>0))problems.push('MULTI_ANALYST_LAB_NOT_ENTERED');
          if(!(Number(d.successful_analyses)>0))problems.push('MULTI_ANALYST_DATA_GATE_HAS_NO_VALID_ROWS');
          if(!b.result_counts||!['candidates','watchlist','lab_results'].every(key=>Number.isFinite(Number(b.result_counts[key]))))
            problems.push('MULTI_ANALYST_SUMMARY_COUNTS_MISSING');
          if(problems.length)throw new Error(JSON.stringify({problems,summary}));
          NODE

      - name: Start and poll one real Pre-Move market scan on DHDTech
        run: |
          set -euo pipefail
          URL="$BASE/api/pre-move-radar?quote=USDT&limit=50"
          PRE_TMP="$RUNNER_TEMP/pre-move-radar.poll.tmp.json"
          PRE_JSON="$RUNNER_TEMP/pre-move-radar.json"
          READY=false
          for cycle in 1 2; do
            START_TMP="$RUNNER_TEMP/pre-move-start.tmp.json"
            START_CURL_EXIT=0
            START_CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 -o "$START_TMP" -w "%{http_code}" "$URL&scan=1")" || START_CURL_EXIT=$?
            if [ "$START_CURL_EXIT" -ne 0 ] || [ "$START_CODE" != "200" ]; then
              echo "::error::Could not start DHDTech Pre-Move scan (curl=$START_CURL_EXIT HTTP=$START_CODE)"
              cat "$START_TMP" 2>/dev/null | head -c 2000 || true
              exit 1
            fi
            for attempt in $(seq 1 36); do
              rm -f "$PRE_TMP"
              CURL_EXIT=0
              CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 -o "$PRE_TMP" -w "%{http_code}" "$URL")" || CURL_EXIT=$?
              if [ "$CURL_EXIT" -ne 0 ]; then
                echo "::warning::DHDTech Pre-Move poll transport failed (curl=$CURL_EXIT HTTP=${CODE:-unknown}) on cycle $cycle attempt $attempt/36."
                rm -f "$PRE_TMP"
                sleep 5
                continue
              fi
              case "$CODE" in
                200)
                  if ! node --input-type=module - "$PRE_TMP" <<'NODE'
          import fs from 'node:fs';
          try {
            const body=fs.readFileSync(process.argv[2],'utf8');
            const parsed=JSON.parse(body);
            if(!parsed || typeof parsed!=='object' || Array.isArray(parsed)) process.exit(1);
          } catch { process.exit(1); }
          NODE
                  then
                    echo "::warning::DHDTech Pre-Move poll returned incomplete JSON on cycle $cycle attempt $attempt/36; retrying."
                    rm -f "$PRE_TMP"
                    sleep 5
                    continue
                  fi
                  mv "$PRE_TMP" "$PRE_JSON"
                  STATE="$(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pre-move-radar.json','utf8'));console.log(b.status||'unknown')")"
                  if [ "$STATE" = "ready" ]; then
                    READY=true
                    break 2
                  fi
                  if [ "$STATE" = "error" ]; then
                    echo "::warning::Pre-Move scan attempt failed: $(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pre-move-radar.json','utf8'));console.log((b.reason||b.error||'unknown').replace(/[^A-Za-z0-9_:.-]/g,''))")"
                    break
                  fi
                  ;;
                202|429|502|503|504)
                  echo "::warning::DHDTech Pre-Move poll transient HTTP $CODE on cycle $cycle attempt $attempt/36."
                  rm -f "$PRE_TMP"
                  ;;
                *)
                  echo "::error::DHDTech Pre-Move poll returned non-retryable HTTP $CODE."
                  cat "$PRE_TMP" 2>/dev/null | head -c 2000 || true
                  exit 1
                  ;;
              esac
              sleep 5
            done
            if [ "$cycle" -lt 2 ] && [ "$READY" != "true" ]; then sleep 10; fi
          done
          if [ "$READY" != "true" ]; then
            echo "::error::DHDTech did not complete a live Pre-Move scan within the acceptance window."
            cat "$PRE_JSON" 2>/dev/null | head -c 8000 || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pre-move-radar.json','utf8'));
          if (b.status !== 'ready') throw new Error('PRE_MOVE_RESPONSE_NOT_READY');
          if (b.meta?.radar !== 'PRE_MOVE') throw new Error('PRE_MOVE_RADAR_ID_INVALID');
          if (b.meta?.live !== true || b.meta?.paper_trading !== true || b.meta?.real_order_execution !== false) throw new Error('PRE_MOVE_RADAR_LIVE_POLICY_INVALID');
          if (b.source !== 'Binance Public REST') throw new Error('PRE_MOVE_RADAR_SOURCE_INVALID');
          if (b.session?.timezone !== 'Asia/Aden' || b.session?.window !== '04:00 local → latest closed candle') throw new Error('PRE_MOVE_SESSION_CONTRACT_INVALID');
          const u=b.universe||{};
          console.log('PRE_MOVE_LIVE_SCAN_OBSERVATION '+JSON.stringify({
            elapsed_ms:u.elapsed_ms,discovered:u.discovered,deep_scanned:u.deep_scanned,
            valid_data:u.valid_data,observed_candle_data:u.observed_candle_data,
            actionable:u.actionable,returned:u.returned,watch_only:u.watch_only,
            ticker_activity_signal_count:u.ticker_activity_signal_count,
            ticker_activity_baseline_source:u.ticker_activity_baseline_source,
            ticker_activity_baseline_persisted:u.ticker_activity_baseline_persisted,
            candidates:b.candidates||[],watch_candidates:b.watch_candidates||[],
            watch_notification_candidates:b.watch_notification_candidates||[],
            watch_notification_diagnostics:b.watch_notification_diagnostics||null,
            near_miss_audit:b.near_miss_audit||[]
          }));
          for (const k of ['scanned','deep_scanned','valid_data','observed_candle_data','watch_only','evidence_incomplete_excluded','extended_excluded','no_setup_excluded','eligible_spot_symbols','discovered','actionable','returned','elapsed_ms','rotation_cycle','rotation_offset','rotation_width','ticker_activity_signal_count']) {
            if (typeof u[k] !== 'number' || !Number.isFinite(u[k])) throw new Error('PRE_MOVE_SCHEMA_OUTDATED:'+k);
          }
          if (u.scanned<1 || u.valid_data<1 || u.eligible_spot_symbols<1 || u.discovered<1 || u.deep_scanned!==u.discovered) throw new Error('PRE_MOVE_NO_VALID_LIVE_MARKET_DATA');
          if (u.coverage_mode !== 'PINNED_PLUS_ROTATING_V1') throw new Error('PRE_MOVE_UNIVERSE_ROTATION_NOT_DEPLOYED');
          if (u.rotation_cursor_source !== 'DURABLE_STORE' || u.rotation_cursor_persisted !== true ||
              u.rotation_sequence !== 'COMPLETED_SCAN_CURSOR_V1') throw new Error('PRE_MOVE_ROTATION_CURSOR_NOT_PERSISTED');
          if (u.ticker_activity_baseline_source !== 'DURABLE_STORE' || u.ticker_activity_baseline_persisted !== true)
            throw new Error('PRE_MOVE_TICKER_ACTIVITY_BASELINE_NOT_PERSISTED');
          if (u.rotation_width<1 || u.rotation_cycle<0 || u.rotation_offset<0) throw new Error('PRE_MOVE_ROTATION_METADATA_INVALID');
          if (u.elapsed_ms>45000) throw new Error('PRE_MOVE_SCAN_LATENCY_OVER_45_SECONDS:'+u.elapsed_ms);
          if (!Array.isArray(b.candidates)) throw new Error('PRE_MOVE_CANDIDATES_MISSING');
          if (!Array.isArray(b.watch_candidates)) throw new Error('PRE_MOVE_WATCH_CANDIDATES_MISSING');
          if (!Array.isArray(b.watch_notification_candidates) || b.watch_notification_candidates.length > 3) throw new Error('PRE_MOVE_WATCH_NOTIFICATION_CANDIDATES_INVALID');
          const wd=b.watch_notification_diagnostics;
          if (!wd || !Number.isFinite(wd.evaluated) || !Number.isFinite(wd.eligible) || !Number.isFinite(wd.rejected) || !wd.rejection_counts || !Array.isArray(wd.samples)) throw new Error('PRE_MOVE_WATCH_NOTIFICATION_DIAGNOSTICS_MISSING');
          if (wd.evaluated !== (Array.isArray(b.watch_candidates)?b.watch_candidates.length:0) || wd.eligible < b.watch_notification_candidates.length || wd.rejected + wd.eligible !== wd.evaluated) throw new Error('PRE_MOVE_WATCH_NOTIFICATION_DIAGNOSTICS_INCONSISTENT');
          for (const x of b.watch_notification_candidates) {
            if (x?.event !== 'PRE_MOVE_RADAR_WATCH_ONLY' || x?.watch_only !== true || x?.entry_eligible !== false || x?.potential_label !== 'WATCH_EARLY' || x?.market !== 'SPOT' || x?.closed_candles_only !== true || x?.paper_trading !== true || x?.real_order_execution !== false || x?.source !== 'Binance Public REST' || x?.data_status?.data_valid !== true || x?.data_status?.data_stale !== false || !Number.isFinite(x?.data_quality) || x.data_quality < 70 || !Number.isFinite(x?.liquidity_quality) || x.liquidity_quality < 60) throw new Error('PRE_MOVE_WATCH_NOTIFICATION_GATE:'+String(x?.symbol||'UNKNOWN'));
          }
          if (!Array.isArray(b.near_miss_audit)) throw new Error('PRE_MOVE_NEAR_MISS_AUDIT_MISSING');
          for (const x of b.near_miss_audit) {
            if (x?.diagnostic_only !== true || x?.watch_only !== true || x?.alert_eligible !== false || !Array.isArray(x.blocker_codes) || x.blocker_codes.length < 1)
              throw new Error('PRE_MOVE_DIAGNOSTIC_AUDIT_GATE:'+String(x?.symbol||'UNKNOWN'));
          }
          for (const x of b.candidates) {
            const p=x?.pre_move_context;
            if (x?.data_status?.data_valid !== true || typeof x.data_quality!=='number' || !Number.isFinite(x.data_quality) || x.data_quality<70 || typeof x.liquidity_quality!=='number' || !Number.isFinite(x.liquidity_quality) || x.liquidity_quality<60) throw new Error('PRE_MOVE_DATA_QUALITY_GATE:'+String(x?.symbol||'UNKNOWN'));
            if (!p || p.evidence_complete !== true || p.closed_candles_only !== true || p.already_moved === true || ['ALREADY_MOVED','NO_SETUP'].includes(p.stage)) throw new Error('PRE_MOVE_EARLY_STAGE_GATE:'+String(x?.symbol||'UNKNOWN'));
            if (p.flow_transition_confirmed !== true || p.price_window_valid !== true || p.structure_confirmed !== true) throw new Error('PRE_MOVE_QUALIFICATION_FLAGS:'+String(x.symbol));
            for (const [key,value] of Object.entries({
              score:p.score,session_return_pct:p.session_return_pct,one_hour_return_pct:p.one_hour_return_pct,
              volume_acceleration:p.volume_acceleration,trade_acceleration:p.trade_acceleration,
              taker_buy_ratio:p.taker_buy_ratio,taker_buy_acceleration:p.taker_buy_acceleration,
              mean_close_location:p.mean_close_location,compression:p.components?.squeeze,structure:p.components?.structure,
              buying_pressure:p.components?.buying_pressure
            })) if (typeof value !== 'number' || !Number.isFinite(value)) throw new Error('PRE_MOVE_REQUIRED_EVIDENCE:'+String(x.symbol)+':'+key);
            if (p.volume_acceleration<1.12 || p.trade_acceleration<1.05 || p.taker_buy_ratio<0.53 ||
                p.taker_buy_acceleration<0.01 || p.mean_close_location<0.54 ||
                p.one_hour_return_pct<0.15 || p.one_hour_return_pct>4.5 ||
                p.session_return_pct<0 || p.session_return_pct>6 ||
                p.components.squeeze<55 || p.components.structure<60 || p.components.buying_pressure<60 ||
                p.session_return_pct>9 || x.price_change_24h>20)
              throw new Error('PRE_MOVE_QUALIFICATION_THRESHOLD:'+String(x.symbol));
            
          }
          for (const x of b.watch_candidates) {
            const p=x?.pre_move_context;
            if (x?.watch_only !== true || x?.alert_eligible !== false || p?.watch_only !== true || p?.stage !== 'WATCH_EARLY' || p?.actionable !== false || p?.already_moved === true ||
                typeof x.data_quality !== 'number' || !Number.isFinite(x.data_quality) || x.data_quality < 70 ||
                p?.evidence_complete !== true || p?.closed_candles_only !== true || !Array.isArray(x.watch_reason_codes) || x.watch_reason_codes.length < 1)
              throw new Error('PRE_MOVE_WATCH_ONLY_GATE:'+String(x?.symbol||'UNKNOWN'));
          }
          console.log(JSON.stringify({
            status:b.status,radar:b.meta.radar,live:b.meta.live,source:b.source,session:b.session,
            universe:{scanned:u.scanned,deep_scanned:u.deep_scanned,valid_data:u.valid_data,observed_candle_data:u.observed_candle_data,watch_only:u.watch_only,returned:u.returned,actionable:u.actionable,
              eligible_spot_symbols:u.eligible_spot_symbols,discovered:u.discovered,coverage_mode:u.coverage_mode,rotation_cycle:u.rotation_cycle,rotation_offset:u.rotation_offset,rotation_width:u.rotation_width,elapsed_ms:u.elapsed_ms,
              evidence_incomplete_excluded:u.evidence_incomplete_excluded,extended_excluded:u.extended_excluded,no_setup_excluded:u.no_setup_excluded},
            candidates:b.candidates.map(x=>({symbol:x.symbol,score:x.pre_move_context.score,stage:x.pre_move_context.stage,session_return_pct:x.pre_move_context.session_return_pct,one_hour_return_pct:x.pre_move_context.one_hour_return_pct,volume_acceleration:x.pre_move_context.volume_acceleration,trade_acceleration:x.pre_move_context.trade_acceleration,taker_buy_ratio:x.pre_move_context.taker_buy_ratio,taker_buy_acceleration:x.pre_move_context.taker_buy_acceleration,mean_close_location:x.pre_move_context.mean_close_location,flow_transition_confirmed:x.pre_move_context.flow_transition_confirmed,price_window_valid:x.pre_move_context.price_window_valid,structure_confirmed:x.pre_move_context.structure_confirmed,liquidity_quality:x.liquidity_quality,data_quality:x.data_quality})),
            watch_candidates:b.watch_candidates.map(x=>({symbol:x.symbol,score:x.pre_move_context.score,stage:x.pre_move_context.stage,original_stage:x.pre_move_context.original_stage,session_return_pct:x.pre_move_context.session_return_pct,one_hour_return_pct:x.pre_move_context.one_hour_return_pct,volume_acceleration:x.pre_move_context.volume_acceleration,trade_acceleration:x.pre_move_context.trade_acceleration,taker_buy_ratio:x.pre_move_context.taker_buy_ratio,watch_reason_codes:x.watch_reason_codes,data_quality:x.data_quality,liquidity_quality:x.liquidity_quality,watch_only:x.watch_only,alert_eligible:x.alert_eligible})),
            near_miss_audit:b.near_miss_audit,
            paper_trading:b.meta.paper_trading,real_order_execution:b.meta.real_order_execution
          }));
          NODE

      - name: Verify independent Pre-Move background worker completed a fresh DHDTech scan
        timeout-minutes: 5
        run: |
          set -euo pipefail
          STATUS_URL="$BASE/api/pre-move-radar-status"
          READY=false
          for attempt in $(seq 1 12); do
            CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 -o "$RUNNER_TEMP/pre-move-worker-status.json" -w "%{http_code}" "$STATUS_URL" || true)"
            if [ "$CODE" != "200" ]; then
              case "$CODE" in
                502|503|504|000)
                  echo "::warning::Pre-Move worker status temporarily unavailable (HTTP $CODE), attempt $attempt/12."
                  ;;
                *)
                  echo "::error::DHDTech Pre-Move worker status endpoint returned HTTP $CODE; continuous worker cannot be proven."
                  cat "$RUNNER_TEMP/pre-move-worker-status.json" 2>/dev/null || true
                  exit 1
                  ;;
              esac
            else
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let x;
          try { x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pre-move-worker-status.json','utf8')); }
          catch { process.exit(10); }
          const w=x.worker||{},s=x.last_background_scan||w.last_summary||{};
          const delivery=w.notification_delivery||{};
          console.log('PRE_MOVE_BACKGROUND_LIVE_STATUS '+JSON.stringify({
            status:x.status,scanner_ready:x.scanner_ready,worker_enabled:w.enabled,
            worker_running:w.running,successful_scans:w.successful_scans,
            last_scan_status:w.last_scan_status,last_scan_at:w.last_scan_at,
            elapsed_ms:s.elapsed_ms,discovered:s.discovered,deep_scanned:s.deep_scanned,
            scanned:s.scanned,valid_data:s.valid_data,actionable:s.actionable,watch_only:s.watch_only,
            watch_notification_evaluated:s.watch_notification_evaluated,
            watch_notification_eligible:s.watch_notification_eligible,
            watch_notification_rejected:s.watch_notification_rejected,
            watch_notification_rejection_counts:s.watch_notification_rejection_counts||{},
            near_miss_review_count:s.near_miss_review_count,
            near_miss_blocker_counts:s.near_miss_blocker_counts||{},
            notification_delivery:{
              results:delivery.results??0,send_calls:delivery.send_calls??0,
              recipients_attempted:delivery.recipients_attempted??0,notifications_sent:delivery.notifications_sent??0,
              current_status:delivery.current_status||'NOT_YET_ATTEMPTED',
              current_reason:delivery.current_reason||null,last_result_at:delivery.last_result_at||null,
              status_counts:delivery.status_counts||{},reason_counts:delivery.reason_counts||{},
              last_results:Array.isArray(delivery.last_results)?delivery.last_results.slice(0,5):[]
            },
            paper_trading:x.paper_trading,real_order_execution:x.real_order_execution
          }));
          const ready=x.scanner_ready===true && w.enabled===true &&
            Number(w.successful_scans)>=1 && w.last_scan_status==='READY' &&
            Number(s.scanned)>0 && Number(s.valid_data)>0 &&
            Number(s.discovered)>0 && Number(s.elapsed_ms)>0 &&
            Number(s.elapsed_ms)<=45000 && x.paper_trading===true &&
            x.real_order_execution===false;
          process.exit(ready?0:10);
          NODE
              then
                READY=true
                break
              else
                echo "Pre-Move background worker has not yet demonstrated a complete fresh scan (attempt $attempt/12)."
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Pre-Move worker did not prove one successful live scan on DHDTech within the bounded verification window."
            cat "$RUNNER_TEMP/pre-move-worker-status.json" 2>/dev/null || true
            exit 1
          fi

      - name: Publish live API result as a commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'pre-move-radar-live-api',
              description: passed ? 'DHDTech returned fresh Pre-Move data with all core evidence' : 'DHDTech live Pre-Move API or data gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
