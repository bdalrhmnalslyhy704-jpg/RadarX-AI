name: Build 224 Container Runtime API Smoke

on:
  pull_request:
    branches:
      - build224-multi-analyst-20261007
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - phase2/**
      - android/app/src/main/assets/**
      - android/app/src/main/assets/**
      - .github/workflows/build224-container-runtime-smoke.yml
  push:
    branches:
      - build224-multi-analyst-20261007
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - phase2/**
      - android/app/src/main/assets/**
      - .github/workflows/build224-container-runtime-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Build 224 source
        uses: actions/checkout@v4
      - name: Install locked dependencies for behavioral tests
        run: npm ci
      - name: Run adaptive trader and radar outcome regression tests
        run: |
          node --check phase2/core/adaptive-trader-engine.mjs
          node --check phase2/core/adaptive-trader-worker.mjs
          node --check phase2/core/early-move-sentinel.mjs
          node --check phase2/core/radar-signal-outcomes.mjs
          node --check phase2/core/strong-move-radar.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          node --check android/app/src/main/assets/radar-outcome-audit.mjs
          node --check phase2/core/store.mjs
          node --test --test-timeout=60000 phase2/tests/radar-signal-outcomes.test.mjs phase2/tests/strong-move-radar.test.mjs
          node --test --test-timeout=60000 phase2/tests/adaptive-trader-engine.test.mjs phase2/tests/adaptive-trader-api.test.mjs phase2/tests/adaptive-trader-worker.test.mjs phase2/tests/adaptive-trader-execution.test.mjs phase2/tests/early-move-sentinel.test.mjs phase2/tests/pre-move-watch-notification.test.mjs phase2/tests/fcm-push.test.mjs
          node --test --test-timeout=60000 android/app/src/main/assets/tests/adaptive-trader-ui.test.mjs android/app/src/main/assets/tests/radar-outcome-audit-ui.test.mjs
      - name: Build exact container image
        run: docker build --pull -t radarx-build224-smoke .
      - name: Start exact container image
        run: docker run --detach --name radarx-build224-smoke --publish 127.0.0.1:18787:8787 radarx-build224-smoke
      - name: Verify routes are served by the Node API inside the container
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:18787"
          status=""
          for attempt in $(seq 1 45); do
            status="$(curl --connect-timeout 2 --max-time 5 --silent --show-error -o "$RUNNER_TEMP/deployment-info.json" -w "%{http_code}" "$BASE/api/deployment-info" || true)"
            if [[ "$status" == "200" ]]; then break; fi
            sleep 2
          done
          if [[ "$status" != "200" ]]; then
            echo "::error::Built container did not serve /api/deployment-info (HTTP ${status:-none})."
            docker logs radarx-build224-smoke || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/deployment-info.json', 'utf8'));
          if (x.service !== 'RADARX_BACKEND' || x.build_version !== 'Build 224' || x.deployment_contract !== 'BUILD224_DHDTECH_V1') {
            throw new Error('CONTAINER_DEPLOYMENT_CONTRACT_INVALID');
          }
          if (x.paper_trading !== true || x.real_order_execution !== false || x.confidence_score !== 'UNKNOWN') {
            throw new Error('CONTAINER_READ_ONLY_POLICY_INVALID');
          }
          if (x.expected_radars !== 12 || x.registered_radars !== 12 || x.pre_move_scanner_ready !== true) {
            throw new Error('CONTAINER_RADAR_INTEGRATION_INVALID ' + JSON.stringify({
              expected_radars: x.expected_radars,
              registered_radars: x.registered_radars,
              pre_move_scanner_ready: x.pre_move_scanner_ready
            }));
          }
          if (x.analyst_system?.expected_analysts !== 20 ||
              x.analyst_system?.engine_configured !== true ||
              x.analyst_system?.review_bridge_installed !== true) {
            throw new Error('CONTAINER_ANALYST_INTEGRATION_INVALID ' + JSON.stringify(x.analyst_system));
          }
          console.log('CONTAINER_API_CONTRACT_OK ' + JSON.stringify({
            service: x.service,
            build_version: x.build_version,
            deployment_contract: x.deployment_contract,
            expected_radars: x.expected_radars,
            registered_radars: x.registered_radars,
            pre_move_scanner_ready: x.pre_move_scanner_ready,
            analyst_system: x.analyst_system,
            paper_trading: x.paper_trading,
            real_order_execution: x.real_order_execution
          }));
          NODE
          ROOT_STATUS="$(curl --connect-timeout 2 --max-time 5 --silent --show-error -o "$RUNNER_TEMP/root.json" -w "%{http_code}" "$BASE/")"
          HEALTH_STATUS="$(curl --connect-timeout 2 --max-time 5 --silent --show-error -o "$RUNNER_TEMP/healthz.json" -w "%{http_code}" "$BASE/healthz")"
          test "$ROOT_STATUS" = "200"
          test "$HEALTH_STATUS" = "200"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const path of ['root.json', 'healthz.json']) {
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/' + path, 'utf8');
            const x = JSON.parse(raw);
            if (path === 'root.json' && x.deployment_contract !== 'BUILD224_DHDTECH_V1') throw new Error('CONTAINER_ROOT_ROUTE_INVALID');
            if (path === 'healthz.json' && !Object.hasOwn(x, 'database')) throw new Error('CONTAINER_HEALTH_ROUTE_NOT_NODE_API');
          }
          console.log('CONTAINER_ROOT_AND_HEALTH_ROUTES_OK');
          NODE
          docker logs radarx-build224-smoke
      - name: Verify live Spot scan and background learning worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:18787"
          code="$(curl --connect-timeout 5 --max-time 240 --silent --show-error -o "$RUNNER_TEMP/adaptive-snapshot.json" -w "%{http_code}" "$BASE/api/adaptive-trader/market-snapshot?limit=40" || true)"
          if [[ "$code" != "200" ]]; then
            echo "::error::Live adaptive trader market snapshot failed with HTTP ${code:-none}."
            cat "$RUNNER_TEMP/adaptive-snapshot.json" 2>/dev/null || true
            docker logs radarx-build224-smoke || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/adaptive-snapshot.json','utf8'));
          if (x.status!=='LIVE_DATA' || x.meta?.live!==true || x.meta?.paper_trading!==true ||
              x.meta?.real_order_execution!==false || x.meta?.closed_candles_only!==true ||
              x.meta?.engine!=='ADAPTIVE_TRADER_SIDECAR_V1') {
            throw new Error('ADAPTIVE_TRADER_LIVE_DATA_CONTRACT_FAILED '+JSON.stringify({
              status:x.status,universe:x.universe,meta:x.meta,error:x.error,reason:x.reason
            }));
          }
          if (!(Number(x.universe?.eligible_spot_symbols)>0) ||
              !(Number(x.universe?.analyzed_symbols)>0) ||
              !(Number(x.universe?.valid_symbols)>0) ||
              !Array.isArray(x.candidates) || !x.candidates.some(row=>row.data_valid===true&&Number.isFinite(Number(row.score)))) {
            throw new Error('ADAPTIVE_TRADER_ZERO_VALID_ANALYSIS '+JSON.stringify(x.universe));
          }
          console.log('ADAPTIVE_TRADER_LIVE_SCAN_OK '+JSON.stringify({
            source:x.source,eligible:x.universe.eligible_spot_symbols,
            analyzed:x.universe.analyzed_symbols,valid:x.universe.valid_symbols,
            coverage_pct:x.universe.coverage_pct,scan_complete:x.universe.scan_complete,
            real_order_execution:x.meta.real_order_execution
          }));
          NODE
          worker_ok=0
          for attempt in $(seq 1 50); do
            curl --connect-timeout 3 --max-time 8 --silent --show-error "$BASE/api/adaptive-trader/status" -o "$RUNNER_TEMP/adaptive-status.json" || true
            if node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/adaptive-status.json','utf8'));process.exit(Number(x.successful_scans)>0&&x.in_flight!==true&&!!x.last_scan_at&&!!x.last_summary?.as_of&&x.last_error===null&&Number(x.memory?.history_rows)>0&&x.real_order_execution===false&&x.paper_trading===true?0:1)" 2>/dev/null; then
              worker_ok=1
              break
            fi
            sleep 2
          done
          if [[ "$worker_ok" != "1" ]]; then
            echo "::error::Adaptive trader worker did not finish a successful background scan and persist learning history."
            cat "$RUNNER_TEMP/adaptive-status.json" 2>/dev/null || true
            docker logs radarx-build224-smoke || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/adaptive-status.json','utf8'));
          const capture=x.learning_capture||null;
          const brain=x.cognitive_brain||{};
          const brainProfile=brain.profile||{};
          const neuralNetwork=brainProfile.neural_network||{};
          const temporalNetwork=brainProfile.temporal_network||{};
          const summary=x.last_summary||{};
          if(x.cognitive_model_contract!=='RADARX_COGNITIVE_AGENT_V5_TCN_V6'||
             temporalNetwork.architecture!=='TCN_24x29_DILATED_RESIDUAL_BTC_CONTEXT_GATED_MASKED_MICRO_ENSEMBLE_V6'||
             temporalNetwork.target_definition!=='FIRST_PASSAGE_3PCT_BEFORE_MINUS_2PCT_4H_V1'){
            throw new Error('CONTAINER_COGNITIVE_V5_TCN_V6_SOURCE_CONTRACT_INVALID '+JSON.stringify({
              top_level_contract:x.cognitive_model_contract||null,
              temporal_architecture:temporalNetwork.architecture||null,
              temporal_target:temporalNetwork.target_definition||null
            }));
          }
          const legacyNeuralNetworkContract=
            neuralNetwork.architecture==='18-10-6-1+RESIDUAL'&&
            Number(neuralNetwork.input_neurons)===18&&
            Number(neuralNetwork.hidden_neurons)===10&&
            Number(neuralNetwork.second_hidden_neurons)===6&&
            Number(neuralNetwork.output_neurons)===1&&
            Number(neuralNetwork.samples_required)>=240&&
            Number(neuralNetwork.ensemble_members_required)===3&&
            (!neuralNetwork.trained||Number(neuralNetwork.ensemble_members)===3);
          const temporalNetworkContract=
            temporalNetwork.architecture==='TCN_24x29_DILATED_RESIDUAL_BTC_CONTEXT_GATED_MASKED_MICRO_ENSEMBLE_V6'&&
            temporalNetwork.target_definition==='FIRST_PASSAGE_3PCT_BEFORE_MINUS_2PCT_4H_V1'&&
            Number(temporalNetwork.sequence_steps)===24&&
            Number(temporalNetwork.sequence_channels)===29&&
            Number(temporalNetwork.ensemble_members_required)===3&&
            (!temporalNetwork.trained||Number(temporalNetwork.ensemble_members)===3)&&
            ['WAITING_FOR_TEMPORAL_FIRST_PASSAGE_SAMPLES',
             'WAITING_FOR_REGIME_SPECIALIST_SAMPLE_COVERAGE',
             'VALIDATION_DID_NOT_BEAT_POOLED_BASELINE',
             'VALIDATION_PASSED_HOLDOUT_NOT_PASSED',
             'OUT_OF_SAMPLE_VALIDATED_PAPER_ONLY',
             'LIVE_GATE_PASSED_OUT_OF_SAMPLE'].includes(String(temporalNetwork.status));
          const cognitiveEvidence={
            method:String(brainProfile.method||brain.method||'UNKNOWN'),
            model_selected:String(brainProfile.model_selection?.selected_model||'NONE'),
            v5_status:String(neuralNetwork.status||'UNKNOWN'),
            v5_trained:neuralNetwork.trained===true,
            v5_training_samples:Number(neuralNetwork.training_samples)||0,
            v5_required_samples:Number(neuralNetwork.samples_required)||0,
            v5_ensemble_members:Number(neuralNetwork.ensemble_members)||0,
            v5_selected:neuralNetwork.selected===true,
            v5_probability_ready:neuralNetwork.probability_ready===true,
            v5_validation_evaluated:neuralNetwork.validation?.evaluated===true,
            v5_validation_brier:neuralNetwork.validation?.model_brier_score??null,
            v5_validation_base_rate_brier:neuralNetwork.validation?.base_rate_brier_score??null,
            v5_holdout_evaluated:neuralNetwork.holdout?.evaluated===true,
            v5_holdout_brier:neuralNetwork.holdout?.model_brier_score??null,
            v5_holdout_base_rate_brier:neuralNetwork.holdout?.base_rate_brier_score??null,
            legacy_neural_network_contract:legacyNeuralNetworkContract,
            temporal_network_contract:temporalNetworkContract,
            temporal_network_status:String(temporalNetwork.status||'UNKNOWN'),
            temporal_network_regime_specialists:Object.fromEntries(Object.entries(temporalNetwork.regime_specialists||{}).map(([regime,specialist])=>[
              regime,{status:String(specialist?.status||'UNKNOWN'),
                support_gaps:Array.isArray(specialist?.support_gaps)?specialist.support_gaps:[],
                training_samples:Number(specialist?.training_samples)||0,
                training_positive_samples:Number(specialist?.training_positive_samples)||0,
                training_negative_samples:Number(specialist?.training_negative_samples)||0,
                selection_samples:Number(specialist?.selection_samples)||0,
                selection_positive_samples:Number(specialist?.selection_positive_samples)||0,
                selection_negative_samples:Number(specialist?.selection_negative_samples)||0,
                validation_samples:Number(specialist?.validation_samples)||0,
                validation_positive_samples:Number(specialist?.validation_positive_samples)||0,
                validation_negative_samples:Number(specialist?.validation_negative_samples)||0,
                holdout_samples:Number(specialist?.holdout_samples)||0,
                holdout_positive_samples:Number(specialist?.holdout_positive_samples)||0,
                holdout_negative_samples:Number(specialist?.holdout_negative_samples)||0,
                selected:specialist?.selected===true,probability_ready:specialist?.probability_ready===true,
                validation_brier:specialist?.validation_brier??null,
                validation_logistic_brier:specialist?.validation_pooled_logistic_brier??null,
                holdout_brier:specialist?.holdout_brier??null,
                holdout_logistic_brier:specialist?.holdout_pooled_logistic_brier??null}
            ])),
            spot_history_coverage:{
              worker_summary_meta_present:Boolean(summary&&summary.meta&&typeof summary.meta==='object'),
              worker_summary_meta_keys:Object.keys(summary?.meta||{}).sort(),
              worker_summary_meta_excerpt:JSON.stringify(summary?.meta||{}).slice(0,1800),
              worker_summary_universe_keys:Object.keys(summary?.universe||{}).sort(),
              btc_15m_pages:Number(summary?.meta?.btc_15m_historical_pages)||1,
              btc_15m_candles:Number(summary?.meta?.btc_15m_historical_window_candles)||0,
              btc_15m_backfill_error:String(summary?.meta?.btc_15m_historical_backfill_error||''),
              btc_benchmark_available:summary?.meta?.btc_benchmark_available===true,
              btc_benchmark_error:String(summary?.meta?.btc_benchmark_error||''),
              asset_15m_extended_symbols:Number(summary?.universe?.asset_15m_extended_symbols)||0,
              asset_5m_extended_symbols:Number(summary?.universe?.asset_5m_extended_symbols)||0,
              asset_5m_deep_history_symbols:Number(summary?.universe?.asset_5m_deep_history_symbols)||0,
              asset_5m_max_history_candles:Number(summary?.universe?.asset_5m_max_history_candles)||0,
              asset_15m_backfill_failures:Number(summary?.universe?.asset_15m_backfill_failures)||0,
              asset_5m_backfill_failures:Number(summary?.universe?.asset_5m_backfill_failures)||0,
              asset_15m_backfill_error_samples:Array.isArray(summary?.universe?.asset_15m_backfill_error_samples)?summary.universe.asset_15m_backfill_error_samples.slice(0,5):[],
              asset_5m_backfill_error_samples:Array.isArray(summary?.universe?.asset_5m_backfill_error_samples)?summary.universe.asset_5m_backfill_error_samples.slice(0,5):[]
            },
            temporal_network_resolved_samples:Number(temporalNetwork.resolved_samples)||0,
            temporal_network_training_samples:Number(temporalNetwork.training_samples)||0,
            temporal_network_required_samples:Number(temporalNetwork.required_training_samples)||0,
            temporal_network_validation_samples:Number(temporalNetwork.validation_samples)||0,
            temporal_network_holdout_samples:Number(temporalNetwork.holdout_samples)||0,
            temporal_network_training_positive_count:Number(temporalNetwork.training_positive_count)||0,
            temporal_network_training_negative_count:Number(temporalNetwork.training_negative_count)||0,
            temporal_network_training_positive_rate_pct:Number(temporalNetwork.training_positive_rate_pct)||0,
            temporal_network_validation_positive_rate_pct:Number(temporalNetwork.validation?.positive_rate_pct)||0,
            temporal_network_holdout_positive_rate_pct:Number(temporalNetwork.holdout?.positive_rate_pct)||0,
            temporal_network_validation_positive_count:Number(temporalNetwork.validation?.positive_count)||0,
            temporal_network_holdout_positive_count:Number(temporalNetwork.holdout?.positive_count)||0,
            temporal_network_selected:temporalNetwork.selected===true,
            temporal_network_probability_ready:temporalNetwork.probability_ready===true,
            temporal_network_live_eligibility_ready:temporalNetwork.live_eligibility_ready===true,
            temporal_network_validation_evaluated:temporalNetwork.validation?.evaluated===true,
            temporal_network_validation_beats_baseline:temporalNetwork.validation?.beat_base_rate===true,
            temporal_network_holdout_evaluated:temporalNetwork.holdout?.evaluated===true,
            temporal_network_holdout_beats_baseline:temporalNetwork.holdout?.beat_base_rate===true,
            temporal_network_holdout_beats_pooled_logistic:temporalNetwork.holdout_comparison?.beats_pooled_logistic===true,
            temporal_network_validation_brier:temporalNetwork.validation?.model_brier_score??null,
            temporal_network_validation_base_rate_brier:temporalNetwork.validation?.base_rate_brier_score??null,
            temporal_network_validation_pooled_logistic_brier:temporalNetwork.validation?.pooled_logistic_brier_score??null,
            temporal_network_holdout_brier:temporalNetwork.holdout?.model_brier_score??null,
            temporal_network_holdout_base_rate_brier:temporalNetwork.holdout?.base_rate_brier_score??null,
            temporal_network_holdout_pooled_logistic_brier:temporalNetwork.holdout?.pooled_logistic_brier_score??null,
            temporal_network_improvement_vs_validation_logistic:temporalNetwork.validation?.pooled_logistic_brier_score===null||
              temporalNetwork.validation?.pooled_logistic_brier_score===undefined||
              temporalNetwork.validation?.model_brier_score===null||
              temporalNetwork.validation?.model_brier_score===undefined?null:
              Number((temporalNetwork.validation.pooled_logistic_brier_score-temporalNetwork.validation.model_brier_score).toFixed(6)),
            temporal_network_validation_start_at:temporalNetwork.validation_start_at??null,
            temporal_network_holdout_start_at:temporalNetwork.holdout_start_at??null,
            temporal_network_max_training_outcome_resolved_at:temporalNetwork.max_training_outcome_resolved_at??null,
            status:String(brain.status||'UNKNOWN'),
            resolved_samples:Number(brainProfile.resolved_samples)||0,
            training_samples:Number(brainProfile.training_samples)||0,
            validation_samples:Number(brainProfile.validation_samples)||0,
            holdout_samples:Number(brainProfile.holdout_samples)||0,
            purged_overlap_samples:Number(brainProfile.purged_overlap_samples)||0,
            validation_evaluated:brainProfile.validation?.evaluated===true,
            validation_beat_base_rate:brainProfile.validation?.beat_base_rate===true,
            holdout_evaluated:brainProfile.holdout?.evaluated===true,
            holdout_beat_base_rate:brainProfile.holdout?.beat_base_rate===true,
            probability_ready:temporalNetwork.probability_ready===true||brainProfile.probability_ready===true,
            validation_start_at:brainProfile.validation_start_at??null,
            holdout_start_at:brainProfile.holdout_start_at??null,
            max_training_outcome_resolved_at:brainProfile.max_training_outcome_resolved_at??null
          };
          if(cognitiveEvidence.method!=='NESTED_PURGED_WALK_FORWARD_RESIDUAL_NEURAL_MODEL_V5'||
             !cognitiveEvidence.temporal_network_contract){
            throw new Error('ADAPTIVE_TRADER_TEMPORAL_TCN_CONTRACT_INVALID '+JSON.stringify(cognitiveEvidence));
          }
          const temporalTrained=temporalNetwork.trained===true;
          const chronologicalSplitSafe=
            Number(temporalNetwork.training_samples)>=160&&
            Number(temporalNetwork.validation_samples)>=24&&
            Number(temporalNetwork.holdout_samples)>=40&&
            Number(temporalNetwork.max_training_outcome_resolved_at)<Number(temporalNetwork.validation_start_at)&&
            Number(temporalNetwork.validation_start_at)<Number(temporalNetwork.holdout_start_at);
          const probabilityGateSafe=!temporalNetwork.probability_ready||
            (temporalNetwork.validation?.evaluated===true&&temporalNetwork.validation?.beat_base_rate===true&&
             temporalNetwork.holdout?.evaluated===true&&temporalNetwork.holdout?.beat_base_rate===true&&
             temporalNetwork.holdout_comparison?.beats_pooled_logistic===true);
          if(temporalTrained&&(!chronologicalSplitSafe||!probabilityGateSafe)){
            throw new Error('ADAPTIVE_TRADER_TEMPORAL_CHRONOLOGICAL_SPLIT_INCOMPLETE '+JSON.stringify(cognitiveEvidence));
          }
          if(temporalNetwork.probability_ready===true&&!temporalTrained){
            throw new Error('ADAPTIVE_TRADER_TEMPORAL_PROBABILITY_WITHOUT_TRAINING '+JSON.stringify(cognitiveEvidence));
          }
          const trainingEvidence={
            resolved_samples:Number(x.memory?.resolved_samples)||0,
            unresolved_samples:Number(x.memory?.unresolved_samples)||0,
            historical_input_samples:Number(capture?.historical_input_samples)||0,
            new_historical_samples:Number(capture?.new_historical_samples)||0,
            historical_samples_available:Number(capture?.snapshot_historical_samples_available)||0,
            new_deep_candidate_samples:Number(capture?.new_deep_candidate_samples)||0,
            new_closed_candle_outcomes:Number(capture?.new_closed_candle_outcomes)||0
          };
          if(!capture||Object.values(trainingEvidence).every(value=>value===0)){
            throw new Error('ADAPTIVE_TRADER_LEARNING_EVIDENCE_MISSING '+JSON.stringify({
              memory:x.memory||null,learning_capture:capture
            }));
          }
          console.log('ADAPTIVE_TRADER_LEARNING_PIPELINE_DIAGNOSTICS '+JSON.stringify({
            ...trainingEvidence,historical_rejected:capture.historical_rejected||{},
            unresolved_training_samples:Number(capture.unresolved_training_samples)||0,
            required_samples:Number(x.learning_profile?.required_samples)||60,
            learning_ready:x.learning_profile?.ready===true,
            note:'A successful scan is not proof of learned calibration; this reports the actual sample pipeline.'
          }));
          console.log('ADAPTIVE_TRADER_COGNITIVE_V3_CHRONOLOGICAL_DIAGNOSTICS '+JSON.stringify(cognitiveEvidence));
          console.log('ADAPTIVE_TRADER_WORKER_AND_MEMORY_OK '+JSON.stringify({
            status:x.status,scan_count:x.scan_count,successful_scans:x.successful_scans,
            last_scan_at:x.last_scan_at,last_error:x.last_error,
            unresolved_samples:x.memory?.unresolved_samples,history_rows:x.memory?.history_rows,
            resolved_samples:x.memory?.resolved_samples,real_order_execution:x.real_order_execution
          }));
          NODE
      - name: Stop container
        if: always()
        run: docker rm --force radarx-build224-smoke || true
