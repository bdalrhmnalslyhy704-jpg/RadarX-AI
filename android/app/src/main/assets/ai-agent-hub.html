<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a101a"><title>RadarX — مركز 10 وكلاء</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#20385a,#0a101a 45%,#060a11);color:#eaf6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(980px,100%);margin:auto;padding:16px 14px 40px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head b{font-size:23px}.muted{color:#8fa6b8;font-size:12px}.card{border:1px solid #24425e;border-radius:18px;background:#0c1724;padding:15px;margin:12px 0}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#101f2e;border:1px solid #23415c;border-radius:14px;padding:12px}.metric small{color:#87a3b8;display:block}.metric b{font-size:22px;display:block;margin-top:4px}form{display:flex;gap:9px;flex-wrap:wrap}input,button{min-height:46px;border-radius:12px;border:1px solid #36536d;background:#0b1724;color:#eff8ff;padding:0 13px;font-weight:900}input{flex:1;min-width:190px;text-transform:uppercase}button{background:linear-gradient(135deg,#35c9ff,#6d75ff);border:0;color:#06111d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.agent{padding:13px;border:1px solid #284762;border-radius:15px;background:#0d1a28}.bar{height:8px;border-radius:8px;background:#17283a;overflow:hidden;margin:8px 0}.fill{height:100%;background:#42d7a5}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#17283a;font-size:10px;font-weight:900}.reason{padding:8px 10px;border-radius:10px;background:#0b1825;margin-top:7px;font-size:12px}a{color:#cdeeff}.danger{border-color:#6a343a}@media(max-width:700px){.hero{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head>
<body><main>
<div class="head"><div><b>🧠 مركز 10 وكلاء ذكاء</b><div class="muted">أخبار • رسمي • اجتماعي • سوق • مخاطر • تعلم تاريخي</div></div><span id="status" class="tag">جاهز</span></div>
<section class="card"><form id="f"><input id="s" placeholder="مثال: SANDUSDT" autocomplete="off" spellcheck="false"><button>حلّل بكل الوكلاء</button></form><p class="muted">التغطية تعتمد على مصادر عامة قابلة للوصول مثل GDELT وGoogle News وReddit، ثم تُقاطع مع بيانات السوق. المواقع المغلقة أو المدفوعة لا تُدّعى تغطيتها.</p></section>
<section id="out" class="card"><div class="muted">أدخل رمز العملة لبدء التحليل.</div></section>
<a href="./index.html">← العودة إلى RadarX</a>
<script type="module">
import {getAgentHub} from './radarx-backend-client.mjs';
const $=x=>document.getElementById(x),f=$('f'),s=$('s'),out=$('out'),status=$('status');
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v).toFixed(1):'—';
function render(b){const d=b.decision||{};const e=b.evidence_summary||{};out.innerHTML='<div class="hero"><div class="metric"><small>حكم اللجنة</small><b>'+esc(d.direction||'—')+'</b></div><div class="metric"><small>النتيجة</small><b>'+n(d.score)+'</b></div><div class="metric"><small>المصادر</small><b>'+esc(e.independent_domains||0)+'</b></div><div class="metric"><small>تحقق الادعاءات</small><b>'+esc(e.verified_claims||0)+'</b></div></div><div class="reason">الحكم: '+esc(d.stance||'')+' • إجراء: '+esc(d.action||'')+'</div><h3>الوكلاء العشرة</h3><div class="grid">'+(b.agents||[]).map(a=>'<div class="agent"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(a.name)+'</b><span class="tag">'+n(a.score)+'</span></div><div class="muted">'+esc(a.role)+'</div><div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(a.score)||0))+'%"></div></div><div class="reason">'+esc(a.direction)+' • وزن '+n(a.weight,2)+'</div>'+(a.reasons||[]).map(r=>'<div class="reason">• '+esc(r)+'</div>').join('')+'</div>').join('')+'</div><h3>مصادر وفحص</h3><div class="reason">GDELT: '+esc(b.source_coverage?.gdelt||0)+' • Google News: '+esc(b.source_coverage?.google_news||0)+' • Reddit posts: '+esc(b.source_coverage?.reddit_posts||0)+' • Reddit comments: '+esc(b.source_coverage?.reddit_comments||0)+'</div><div class="reason">مجموع الأدلة: '+esc(e.total||0)+' • رسمي: '+esc(e.official||0)+' • اجتماعي: '+esc(e.social||0)+' • تحقق مستقل: '+esc(e.verified_claims||0)+'</div><p class="muted">'+esc(b.disclaimer||'')+'</p>'}
f.addEventListener('submit',async ev=>{ev.preventDefault();const sym=String(s.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5,20}$/.test(sym)){out.innerHTML='<div class="reason danger">رمز العملة غير صحيح.</div>';return}status.textContent='جاري التحليل...';out.innerHTML='<div class="muted">جاري جمع الأخبار والمنشورات والتعليقات ومقارنة السوق...</div>';try{const r=await getAgentHub({symbol:sym});if(!r.ok){out.innerHTML='<div class="reason danger">تعذر التحليل: HTTP_'+r.status+'</div>';status.textContent='غير متاح';return}render(r.body);status.textContent='اكتمل'}catch(e){out.innerHTML='<div class="reason danger">تعذر الاتصال: '+esc(e?.message||e)+'</div>';status.textContent='انقطاع'}})
</script></main></body></html>
