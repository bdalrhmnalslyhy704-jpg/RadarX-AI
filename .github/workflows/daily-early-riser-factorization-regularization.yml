name: Build 224 Daily MLP Factorization Regularization Ablation

on:
  push:
    branches:
      - research/daily-early-riser-mlp-budget-20261113
    paths:
      - 'phase2/core/cognitive-brain.mjs'
      - 'phase2/core/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tools/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tests/daily-early-riser-neural-benchmark.test.mjs'
      - '.github/workflows/daily-early-riser-factorization-regularization.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: build224-daily-factorization-regularization
  cancel-in-progress: false

jobs:
  verify-contracts:
    name: Verify daily neural and factor-cross contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and focused research tests
        run: |
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/daily-early-riser-neural-benchmark.mjs
          node --check phase2/tools/daily-early-riser-neural-benchmark.mjs
          node --check phase2/tests/daily-early-riser-neural-benchmark.test.mjs
          node --test --test-timeout=120000 phase2/tests/daily-early-riser-neural-benchmark.test.mjs

  factorization-regularization:
    name: Safe 72h MLP +5% factorization L2 ${{ matrix.l2 }}
    needs: verify-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        l2: [0.12, 0.18]
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download exact frozen Binance Spot census
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-daily-early-riser-census-20
          repository: ${{ github.repository }}
          run-id: '43336370744'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
      - name: Verify exact frozen sample integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/daily-early-riser-census.json
          test -s artifacts/daily-early-riser-samples.jsonl
          test -s artifacts/daily-early-riser-temporal-sequences.jsonl
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const report=JSON.parse(fs.readFileSync('artifacts/daily-early-riser-census.json','utf8'));
          const hash=createHash('sha256').update(fs.readFileSync('artifacts/daily-early-riser-samples.jsonl')).digest('hex');
          if(!['AUDITED_WITH_SURVIVOR_UNIVERSE_CAVEAT','READY'].includes(report.status) ||
             report.data_quality?.all_sample_audits_ready!==true)
            throw new Error('FROZEN_CENSUS_NOT_AUDITED');
          if(hash!==report.sample_file?.sha256 ||
             hash!=='c945fdef1389f886b5b6a748b56adb4ba6b04c4b1807e3ef5e4d18f5670d5f9d')
            throw new Error('FROZEN_SAMPLE_SHA256_MISMATCH');
          console.log(JSON.stringify({sample_sha256:hash,rows:report.sample_file.rows}));
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Train rank-16 factorization with controlled L2
        run: |
          node phase2/tools/daily-early-riser-neural-benchmark.mjs \
            --input artifacts/daily-early-riser-samples.jsonl \
            --temporal-input artifacts/daily-early-riser-temporal-sequences.jsonl \
            --census-report artifacts/daily-early-riser-census.json \
            --output artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-l2-${{ matrix.l2 }}.json \
            --target 5 \
            --label-mode safe_opportunity \
            --horizon-hours 72 \
            --liquidity-lane STANDARD_750K_PLUS \
            --skip-temporal true \
            --neural-training-history-fraction 1.0 \
            --neural-iterations 120 \
            --neural-output-initialization-scale 0.015 \
            --daily-feature-schema DAILY_CONTEXT_35 \
            --enable-factorization-machine true \
            --factorization-rank 16 \
            --factorization-iterations 120 \
            --factorization-learning-rate 0.008 \
            --factorization-l2 ${{ matrix.l2 }}
      - name: Publish factorization regularization comparison
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const l2=Number('${{ matrix.l2 }}');
          const path='artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-l2-'+l2+'.json';
          if(!fs.existsSync(path)){
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Factorization regularization report missing.\\n');
            process.exit(0);
          }
          const report=JSON.parse(fs.readFileSync(path,'utf8'));
          const target=Object.values(report.target_results||{})[0]||{};
          const neural=target.neural_network||{};
          const candidates=neural.member_selection_brier_scores??[];
          const factorIndex=neural.factorization_member_index??-1;
          const factorScores=candidates.filter(row=>row.index===factorIndex);
          const factorBest=[...factorScores].sort((a,b)=>a.brier_score-b.brier_score)[0]??null;
          const summary={
            status:report.status,feature_schema:target.feature_schema,
            feature_count:target.feature_names?.length??null,
            factorization_rank:report.factorization_rank,
            factorization_iterations:report.factorization_iterations,
            factorization_learning_rate:report.factorization_learning_rate,
            factorization_l2:report.factorization_l2,
            input_sha256:report.input_sha256,
            accepted_samples:target.samples?.accepted??null,
            training_samples:neural.training_samples??null,
            selection_samples:neural.selection_samples??null,
            logistic_selection_brier:neural.inner_selection_diagnostics?.logistic_baseline_brier_score??null,
            factorization_member_index:factorIndex,
            factorization_scores:factorScores,
            factorization_best_candidate:factorBest,
            inner_selection:neural.inner_selection_diagnostics??null,
            validation:neural.validation??null,
            validation_comparison:neural.validation_comparison??null,
            holdout:neural.holdout??null,
            holdout_comparison:neural.holdout_comparison??null,
            predictive_superiority_verified:report.predictive_superiority_verified===true,
            profitability_verified:report.profitability_verified===true,
            production_touched:report.production_touched===true,
            deployed:report.deployed===true,merged:report.merged===true,
            real_order_execution:report.real_order_execution===true
          };
          console.log('[MLP_FACTORIZATION_REGULARIZATION_ABLATION] '+JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Factorization L2 '+l2+'\\n\\n```json\\n'+
            JSON.stringify(summary,null,2)+'\\n```\\n');
          NODE
      - name: Upload isolated factorization regularization report
        if: always() && hashFiles('artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-l2-${{ matrix.l2 }}.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-mlp-factor-l2-${{ matrix.l2 }}
          path: artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-l2-${{ matrix.l2 }}.json
          retention-days: 30
