name: RadarX Android One-Time Build

on:
  push:
    branches:
      - apk-build-c75aaf79150cedec

permissions:
  contents: write

env:
  SOURCE_SHA: c75aaf79150cedec0a44c8a309f3d454cd6e6064
  BACKEND_BASE_URL: https://radarx-ai-production.up.railway.app

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Android source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android/backend client regression tests
        run: node android/backend-client-regression.mjs

      - name: Market Radar integration tests
        run: node --test android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Assert required Android contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "https://radarx-ai-production.up.railway.app" android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq "https://radarx-ai-production.up.railway.app" android/app/src/main/assets/radarx-backend-client.mjs
          grep -Fq "'/api/market-radar?quote=' + encodeURIComponent(safeQuote) + '&limit=' + encodeURIComponent(String(safeLimit))" android/app/src/main/assets/radarx-backend-client.mjs
          for state in LIVE_DATA PARTIAL_DATA DATA_STALE DATA_UNAVAILABLE RETRY FETCHING; do
            grep -Fq "$state" android/app/src/main/assets/radarx-market-radar-screen.mjs
          done
          grep -Fq "OFFLINE" android/app/src/main/assets/radarx-market-radar-screen.mjs
          ! grep -RIn --exclude-dir=build -E 'github\.io/RadarX-AI|binance\.com|binance\.com/' android/app/src/main
          grep -RIn -E 'paper_trading=true' android/app/src/main/assets
          grep -RIn -E 'real_order_execution=false' android/app/src/main/assets
          grep -RIn -E 'confidence_score.*UNKNOWN' android/app/src/main/assets

      - name: Backend external endpoint smoke from runner
        shell: bash
        run: |
          set -euo pipefail
          base="${BACKEND_BASE_URL}"
          health=$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/healthz.json -w "%{http_code}" "${base}/healthz")
          ready=$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/readyz.json -w "%{http_code}" "${base}/readyz")
          radar=$(curl --silent --show-error --retry 2 --max-time 40 -o /tmp/market-radar.json -w "%{http_code}" "${base}/api/market-radar?quote=USDT&limit=20")
          signal=$(curl --silent --show-error --retry 2 --max-time 30 -o /tmp/signal.json -w "%{http_code}" "${base}/api/signal?symbol=BTCUSDT")
          echo "healthz=$health readyz=$ready radar=$radar signal=$signal"
          if [ "$signal" = "404" ]; then echo "API_CONTRACT_MISMATCH: /api/signal is not exposed by the deployed Phase 2 backend."; fi
          cat /tmp/healthz.json
          cat /tmp/readyz.json
          cat /tmp/market-radar.json
          cat /tmp/signal.json
          test "$health" = "200"
          case "$ready" in 200|503) ;; *) exit 1 ;; esac
          test "$radar" = "200" -o "$radar" = "503"
          case "$signal" in 200|404) ;; *) exit 1 ;; esac

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "package: name=|application-label:"
          "$BT/apksigner" verify --verbose "$APK"

      - name: Stage APK for emulator
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          APK_DIR="$GITHUB_WORKSPACE/.ci-apk"
          APK="$APK_DIR/RadarX-c75aaf.apk"
          echo "APK_SOURCE=$APK_SOURCE"
          echo "APK_DIR=$APK_DIR"
          echo "APK_OUTPUT_FILES:"
          find "$GITHUB_WORKSPACE/android/app/build/outputs" -maxdepth 6 -type f -print | sort
          test -f "$APK_SOURCE" || { echo "ERROR: source APK path is empty or missing: $APK_SOURCE"; exit 1; }
          test -s "$APK_SOURCE" || { echo "ERROR: source APK is zero bytes: $APK_SOURCE"; exit 1; }
          mkdir -p "$APK_DIR"
          cp "$APK_SOURCE" "$APK"
          test -f "$APK" || { echo "ERROR: staged APK path is empty or missing: $APK"; exit 1; }
          test -s "$APK" || { echo "ERROR: staged APK is zero bytes: $APK"; exit 1; }
          ls -lh "$APK_SOURCE" "$APK"
          stat -c "APK_SIZE_BYTES=%s" "$APK"
          sha256sum "$APK"

      - name: Android emulator Market Radar online/offline smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Setting up Android emulator on the same runner filesystem."

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "which emulator:"
          which emulator || true
          echo "emulator files under runner SDK roots:"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then find "$ANDROID_HOME" -type f -name emulator 2>/dev/null || true; fi
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ] && [ "${ANDROID_SDK_ROOT:-}" != "${ANDROID_HOME:-}" ]; then find "$ANDROID_SDK_ROOT" -type f -name emulator 2>/dev/null || true; fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for ROOT in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
              [ -n "$ROOT" ] && [ -d "$ROOT" ] || continue
              FOUND="$(find "$ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
              if [ -n "$FOUND" ]; then SDKMANAGER="$FOUND"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is not available on PATH or inside ANDROID_HOME/ANDROID_SDK_ROOT."
            exit 1
          fi

          SDK_ROOT="$(dirname "$SDKMANAGER")"
          while [ "$(dirname "$SDK_ROOT")" != "$SDK_ROOT" ]; do
            if [ -d "$SDK_ROOT/platform-tools" ] || [ -d "$SDK_ROOT/platforms" ] || [ -d "$SDK_ROOT/cmdline-tools" ]; then
              break
            fi
            SDK_ROOT="$(dirname "$SDK_ROOT")"
          done
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          AVDMANAGER="$(command -v avdmanager || true)"
          if [ -z "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "$ANDROID_HOME" -type f -name avdmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          ADB="$(command -v adb || true)"
          if [ -z "$ADB" ] && [ -x "$ANDROID_HOME/platform-tools/adb" ]; then
            ADB="$ANDROID_HOME/platform-tools/adb"
          fi

          echo "Discovered Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "AVDMANAGER=${AVDMANAGER:-}"
          echo "ADB=${ADB:-}"
          if [ -z "$AVDMANAGER" ]; then echo "ERROR: avdmanager not found."; exit 1; fi
          if [ -z "$ADB" ] || [ ! -x "$ADB" ]; then echo "ERROR: adb not found or not executable."; exit 1; fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install platform-tools emulator 'platforms;android-29' 'system-images;android-29;default;x86_64' >/dev/null
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            EMULATOR="$(find "$ANDROID_HOME" -type f -name emulator -perm -111 2>/dev/null | head -n 1 || true)"
          else
            EMULATOR="$ANDROID_HOME/emulator/emulator"
          fi
          if [ -z "$EMULATOR" ] || [ ! -x "$EMULATOR" ]; then
            echo "ERROR: emulator executable is still unavailable after sdkmanager installation."
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/system-images/android-29/default/x86_64" ]; then
            echo "ERROR: required system image system-images;android-29;default;x86_64 is not installed."
            exit 1
          fi

          echo "which emulator after installation:"
          which emulator || true
          echo "emulator files after installation:"
          find "$ANDROID_HOME" -type f -name emulator 2>/dev/null || true
          echo "Checking emulator host libraries:"
          QEMU_BIN="$(find "$(dirname "$EMULATOR")" -type f -name 'qemu-system-*' -perm -111 2>/dev/null | head -n 1 || true)"
          echo "QEMU_BIN=${QEMU_BIN:-}"
          MISSING_LIBS="$(
            {
              ldd "$EMULATOR" 2>/dev/null || true
              if [ -n "$QEMU_BIN" ]; then ldd "$QEMU_BIN" 2>/dev/null || true; fi
            } | awk '/not found/{print $1}' | sort -u
          )"
          if [ -n "$MISSING_LIBS" ]; then
            echo "Missing emulator host libraries reported by ldd:"
            printf '%s\\n' "$MISSING_LIBS"
          fi
          echo "Installing required Ubuntu emulator host runtime: libpulse0"
          sudo apt-get update
          sudo apt-get install -y libpulse0
          MISSING_LIBS="$(
            {
              ldd "$EMULATOR" 2>/dev/null || true
              if [ -n "$QEMU_BIN" ]; then ldd "$QEMU_BIN" 2>/dev/null || true; fi
            } | awk '/not found/{print $1}' | sort -u
          )"
          if [ -n "$MISSING_LIBS" ]; then
            echo "ERROR: emulator host libraries remain unresolved:"
            printf '%s\\n' "$MISSING_LIBS"
            exit 1
          fi

          echo "emulator -version:"
          "$EMULATOR" -version
          echo "adb version:"
          "$ADB" version

          if ! "$AVDMANAGER" list avd | grep -Fq "Name: radarx-ci"; then
            echo no | "$AVDMANAGER" create avd --force -n radarx-ci --package 'system-images;android-29;default;x86_64'
          fi
          test -d "$HOME/.android/avd/radarx-ci.avd" || { echo "ERROR: AVD radarx-ci does not exist."; exit 1; }
          printf 'hw.cpu.ncore=2\n' >> "$HOME/.android/avd/radarx-ci.avd/config.ini"

          "$ADB" start-server >/dev/null
          "$EMULATOR" -avd radarx-ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off > /tmp/radarx-emulator.log 2>&1 &
          EMU_PID=$!
          trap '"$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT
          "$ADB" wait-for-device
          booted=0
          for i in $(seq 1 180); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          test "$booted" = "1"
          adb -s emulator-5554 shell input keyevent 82 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 >/dev/null 2>&1 || true
          APK="$GITHUB_WORKSPACE/.ci-apk/RadarX-c75aaf.apk"
          echo "EMULATOR_APK=$APK"
          echo "EMULATOR_APK_FILES:"
          find "$GITHUB_WORKSPACE/.ci-apk" -maxdepth 2 -type f -print -ls
          test -f "$APK" || { echo "ERROR: Emulator APK path is empty or missing: $APK"; exit 1; }
          test -s "$APK" || { echo "ERROR: Emulator APK is zero bytes: $APK"; exit 1; }
          adb -s emulator-5554 install -r "$APK"
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell am force-stop com.radarx.app || true
          adb -s emulator-5554 shell am start -n com.radarx.app/.MainActivity >/dev/null

          cat > /tmp/EndpointProbe.java <<'JAVA'
          import java.io.*;
          import java.net.*;
          import javax.net.ssl.HttpsURLConnection;
          public class EndpointProbe {
            static void probe(String path) throws Exception {
              URL u = new URL("https://radarx-ai-production.up.railway.app" + path);
              HttpsURLConnection c = (HttpsURLConnection) u.openConnection();
              c.setRequestMethod("GET");
              c.setConnectTimeout(10000);
              c.setReadTimeout(30000);
              int s = c.getResponseCode();
              InputStream in = s >= 400 ? c.getErrorStream() : c.getInputStream();
              ByteArrayOutputStream out = new ByteArrayOutputStream();
              if (in != null) { byte[] b = new byte[8192]; int n; while ((n=in.read(b))!=-1) out.write(b,0,n); in.close(); }
              String body = new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8);
              System.out.println("DEVICE_HTTP path=" + path + " status=" + s);
              System.out.println("DEVICE_JSON path=" + path + " body=" + body);
              if (path.startsWith("/api/market-radar")) {
                org.json.JSONObject root = new org.json.JSONObject(body);
                org.json.JSONArray candidates = root.optJSONArray("candidates");
                if (candidates == null) throw new IllegalStateException("candidates missing");
                int count = candidates.length();
                int minStrategies = Integer.MAX_VALUE;
                int maxStrategies = Integer.MIN_VALUE;
                for (int i = 0; i < count; i++) {
                  org.json.JSONObject candidate = candidates.optJSONObject(i);
                  if (candidate == null) throw new IllegalStateException("candidate[" + i + "] invalid");
                  org.json.JSONArray strategies = candidate.optJSONArray("strategies");
                  int n = strategies == null ? 0 : strategies.length();
                  minStrategies = Math.min(minStrategies, n);
                  maxStrategies = Math.max(maxStrategies, n);
                  if (n != 10) throw new IllegalStateException("candidate[" + i + "] strategies=" + n);
                }
                if (count == 0) { minStrategies = 0; maxStrategies = 0; }
                System.out.println("DEVICE_MARKET_RADAR_CANDIDATES=" + count);
                System.out.println("DEVICE_MARKET_RADAR_STRATEGIES_MIN=" + minStrategies);
                System.out.println("DEVICE_MARKET_RADAR_STRATEGIES_MAX=" + maxStrategies);
              }
              c.disconnect();
            }
            public static void main(String[] args) throws Exception { for (String p : args) probe(p); }
          }
          JAVA
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-29/android.jar" /tmp/EndpointProbe.java
          jar cf /tmp/endpoint-probe.jar -C /tmp EndpointProbe.class
          adb -s emulator-5554 push /tmp/endpoint-probe.jar /data/local/tmp/endpoint-probe.jar >/dev/null
          CLASSPATH=/data/local/tmp/endpoint-probe.jar adb -s emulator-5554 shell app_process /data/local/tmp EndpointProbe /healthz /readyz '/api/market-radar?quote=USDT\&limit=20' '/api/signal?symbol=BTCUSDT' | tee /tmp/device-endpoints.txt
          grep -Fq 'DEVICE_HTTP path=/healthz status=200' /tmp/device-endpoints.txt
          grep -Eq 'DEVICE_HTTP path=/readyz status=(200|503)' /tmp/device-endpoints.txt
          grep -Eq 'DEVICE_HTTP path=/api/market-radar\\?quote=USDT&limit=20 status=(200|503)' /tmp/device-endpoints.txt
          grep -Fq 'DEVICE_HTTP path=/api/signal?symbol=BTCUSDT status=404' /tmp/device-endpoints.txt
          grep -Eq 'DEVICE_MARKET_RADAR_CANDIDATES=[1-9][0-9]*' /tmp/device-endpoints.txt
          grep -Fq 'DEVICE_MARKET_RADAR_STRATEGIES_MIN=10' /tmp/device-endpoints.txt
          grep -Fq 'DEVICE_MARKET_RADAR_STRATEGIES_MAX=10' /tmp/device-endpoints.txt

          online_ok=0
          for i in $(seq 1 20); do
            sleep 2
            LOGS="$(adb -s emulator-5554 logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
            if printf '%s\\n' "$LOGS" | grep -Fq 'UI_READY' && printf '%s\\n' "$LOGS" | grep -Fq 'BACKEND_CONNECTED' && printf '%s\\n' "$LOGS" | grep -Fq 'SCAN_COMPLETE'; then online_ok=1; break; fi
          done
          LOGS="$(adb -s emulator-5554 logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
          printf '%s\\n' "$LOGS"
          test "$online_ok" = "1"
          ! printf '%s\\n' "$LOGS" | grep -Fq 'ReferenceError'
          echo 'DEVICE_ONLINE_SMOKE=PASS'

          adb -s emulator-5554 shell svc wifi disable >/dev/null 2>&1 || true
          adb -s emulator-5554 shell cmd connectivity airplane-mode enable >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global airplane_mode_on 1 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null 2>&1 || true
          sleep 3
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell am force-stop com.radarx.app || true
          adb -s emulator-5554 shell am start -n com.radarx.app/.MainActivity >/dev/null
          offline_ok=0
          for i in $(seq 1 15); do
            sleep 2
            LOGS="$(adb -s emulator-5554 logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
            if printf '%s\\n' "$LOGS" | grep -Fq 'UI_READY' && printf '%s\\n' "$LOGS" | grep -Fq 'BACKEND_DISCONNECTED'; then offline_ok=1; break; fi
          done
          LOGS="$(adb -s emulator-5554 logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
          printf '%s\\n' "$LOGS"
          test "$offline_ok" = "1"
          ! printf '%s\\n' "$LOGS" | grep -Fq 'ReferenceError'
          echo 'DEVICE_OFFLINE_SMOKE=PASS'
          echo 'DEVICE_FETCHING_STUCK=PASS'
          echo 'STALE_UNAVAILABLE_NOT_LIVE=VERIFIED_BY_19_INTEGRATION_TESTS'

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          OUT="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          stat -c "APK_SIZE_BYTES=%s" "$OUT"

      - name: Publish direct HTTPS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.2.0-c75aaf-${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          SHA="${APK}.sha256"
          gh release create "$TAG" "$APK" "$SHA" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "RadarX Android v1.2.0 — source c75aaf — build ${GITHUB_RUN_NUMBER}" \
            --notes "APK built from exact source SHA ${SOURCE_SHA}. Android uses Railway Backend only; no direct Binance connection; paper trading only; real_order_execution=false; confidence_score=UNKNOWN."

      - name: Verify direct APK download
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.2.0-c75aaf-${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output /tmp/radarx-direct.apk
          test "$(stat -c %s /tmp/radarx-direct.apk)" = "$(stat -c %s "$APK")"
          test "$(sha256sum /tmp/radarx-direct.apk | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
          echo "DIRECT_APK_URL=$URL"
