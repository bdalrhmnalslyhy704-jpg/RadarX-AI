# Coin Hunter + Build 224 release pipeline
name: RadarX Android Release APK

on:
  push:
    branches:
      - android-early-wake-6.8.9
      - phase3-triple-radar
      - android-build224-radar8-v2-20261006
      - phase4-symbol-deep-scan
      - android-icon-6.8.8-release
      - tradli-feature-integration
      - premium-ui-manual-execution-safe
      - background-prebreakout-engine
      - tradli-separate-page-ui
      - tradli-connectivity-native-screen
      - bottom-reversal-radar-page
      - phase6-radar4-independent-microstructure
      - feature-coin-hunter-20261006-android
      - android-whale-intelligence-v2-build224-20261007
      - android-build224-whale-accumulation-v3-20261007
      - android-build224-final-stable-20261007
      - build224-multi-analyst-20261007
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: radarx-android-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Publish only from the official Build 224 branch after its backend and Android checks pass.
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Require successful Triple Radar CI for this exact Build 224 commit
        if: github.ref_name == 'build224-multi-analyst-20261007'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 55 * 60))
          while (( SECONDS < deadline )); do
            response="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f "head_sha=$GITHUB_SHA" -F "per_page=100")"
            selected="$(jq -c --arg expected_name "RadarX Triple Radar CI" --arg expected_sha "$GITHUB_SHA" --arg expected_branch "$GITHUB_REF_NAME" \
              '[.workflow_runs[] | select(.name == $expected_name and .head_sha == $expected_sha and .head_branch == $expected_branch)] | sort_by(.created_at) | last // empty' \
              <<<"$response")"
            if [[ -n "$selected" ]]; then
              status="$(jq -r '.status' <<<"$selected")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$selected")"
              run_url="$(jq -r '.html_url' <<<"$selected")"
              echo "Triple Radar CI for $GITHUB_SHA: status=$status conclusion=$conclusion ($run_url)"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Exact-commit Triple Radar CI passed; release checks may begin."
                  exit 0
                fi
                echo "::error::Refusing APK publication: Triple Radar CI did not pass on this exact commit ($conclusion)."
                exit 1
              fi
            else
              echo "Waiting for Triple Radar CI to start on exact SHA $GITHUB_SHA ..."
            fi
            sleep 15
          done
          echo "::error::Refusing APK publication: no successful Triple Radar CI completed for $GITHUB_SHA before timeout."
          exit 1
      - name: Checkout exact release-signing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Verify release branch checkout and backend URL
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature-coin-hunter-20261006-android" || test "$GITHUB_REF_NAME" = "android-build224-radar8-v2-20261006" || test "$GITHUB_REF_NAME" = "android-whale-intelligence-v2-build224-20261007" || test "$GITHUB_REF_NAME" = "android-build224-final-stable-20261007" || test "$GITHUB_REF_NAME" = "build224-multi-analyst-20261007"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "https://radarx-ai-triple-production.up.railway.app" android/app/src/main/assets/radarx-backend-client.mjs
          ! grep -RIn --exclude-dir=build "github.io/RadarX-AI" android/app/src/main
          grep -Fq 'versionCode 15' android/app/build.gradle
          grep -Fq 'versionName "1.4.9"' android/app/build.gradle
          test -s android/app/src/main/assets/falcon-eye-radar.html
          grep -Fq 'falcon-eye-radar.html' android/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android command-line tools 16.0
        timeout-minutes: 8
        env:
          ANDROID_CMDLINE_TOOLS_ZIP: commandlinetools-linux-12266719_latest.zip
          ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/radarx-android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            "$ANDROID_CMDLINE_TOOLS_URL" \
            --output "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

          unzip -q "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/16.0"

          if [[ ! -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            echo "::error::Pinned Android command-line tools 16.0 sdkmanager was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

          rm -f "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

      - name: Verify pinned sdkmanager
        timeout-minutes: 2
        run: |
          set -euo pipefail
          command -v sdkmanager
          SDKMANAGER_VERSION="$(sdkmanager --version | head -n 1)"
          echo "sdkmanager version: $SDKMANAGER_VERSION"
          [[ "$SDKMANAGER_VERSION" == 16.0* ]]

      - name: Install required Android SDK packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses < <(yes) >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

      - name: Verify Railway backend and Radar 8 public contract
        timeout-minutes: 5
        env:
          RADAR8_JSON: ${{ runner.temp }}/radar8.json
        run: |
          set -euo pipefail
          BASE="https://radarx-ai-triple-production.up.railway.app"
          HEALTH="$(curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/healthz.json" -w "%{http_code}" "$BASE/healthz")"
          READY="$(curl --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/readyz.json" -w "%{http_code}" "$BASE/readyz")"
          test "$HEALTH" = "200"
          case "$READY" in 200|503) ;; *) echo "::error::Unexpected readyz status: $READY"; exit 1 ;; esac
          export READY_STATUS="$READY"

          # Do not publish an APK while Radar 8 is merely instantiated but has
          # zero market coverage. Give a fresh Railway deploy time to complete
          # its first real Spot-USDT scan before validating the contract.
          VERIFIED=false
          for attempt in $(seq 1 18); do
            RADAR8="$(curl --location --connect-timeout 10 --max-time 25 --silent --show-error -o "$RADAR8_JSON" -w "%{http_code}" "$BASE/api/early-expansion-radar?quote=USDT&limit=100" || true)"
            if [ "$RADAR8" = "200" ] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync(process.env.RADAR8_JSON, 'utf8'));
          const problems = [];
          if (body.schema_version !== 'RADAR8_V2') problems.push('RADAR8_SCHEMA_VERSION_INVALID');
          if (body.radar !== 'EARLY_EXPANSION_RADAR') problems.push('RADAR8_NAME_INVALID');
          if (body.meta?.live !== true) problems.push('RADAR8_NOT_LIVE');
          if (body.meta?.paper_trading !== true) problems.push('PAPER_TRADING_INVARIANT_FAILED');
          if (body.meta?.real_order_execution !== false) problems.push('REAL_ORDER_EXECUTION_INVARIANT_FAILED');
          if (body.meta?.confidence_score !== 'UNKNOWN') problems.push('CONFIDENCE_SCORE_INVARIANT_FAILED');
          if (body.monitoring?.running !== true) problems.push('RADAR8_MONITOR_NOT_RUNNING');
          for (const key of ['expected_total','received_total','missing_ticker_total','eligible_total','fast_scanned_total','scanned_total','deep_scanned_total','skipped_total','failed_total','coverage_ratio','deep_coverage_ratio']) {
            if (!Object.hasOwn(body.universe ?? {}, key)) problems.push('RADAR8_COVERAGE_FIELD_MISSING:'+key);
          }
          for (const key of ['running','last_scan_at','failed_total','poll_ms','micro_scan_candidates','micro_concurrency','rotation_reserve','quiet_reserve','deep_candidates','deep_concurrency']) {
            if (!Object.hasOwn(body.monitoring ?? {}, key)) problems.push('RADAR8_MONITORING_FIELD_MISSING:'+key);
          }
          for (const key of ['requested','completed','error']) {
            if (!Object.hasOwn(body.scan ?? {}, key)) problems.push('RADAR8_SCAN_FIELD_MISSING:'+key);
          }
          if (!(Number(body.universe?.expected_total) > 0)) problems.push('RADAR8_EXPECTED_UNIVERSE_EMPTY');
          if (!(Number(body.universe?.received_total) > 0)) problems.push('RADAR8_RECEIVED_TICKERS_EMPTY');
          if (!(Number(body.universe?.coverage_ratio) >= 0.95)) problems.push('RADAR8_COVERAGE_BELOW_95_PERCENT');
          if (!(Number(body.monitoring?.last_scan_at) > 0)) problems.push('RADAR8_HAS_NOT_COMPLETED_A_SCAN');
          if (problems.length) {
            console.log('Radar 8 warm-up/integration check not ready:', problems.join(','));
            process.exit(1);
          }
          console.log(JSON.stringify({
            schema_version: body.schema_version,
            radar: body.radar,
            meta_live: body.meta.live,
            meta_paper_trading: body.meta.paper_trading,
            meta_real_order_execution: body.meta.real_order_execution,
            meta_confidence_score: body.meta.confidence_score,
            universe: body.universe,
            monitoring: body.monitoring,
            scan: body.scan,
            readyz_http_status: Number(process.env.READY_STATUS)
          }, null, 2));
          NODE
            then
              VERIFIED=true
              break
            fi
            echo "Radar 8 has not completed a valid market scan yet (attempt $attempt/18; HTTP ${RADAR8:-no response})."
            sleep 5
          done
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Radar 8 did not pass the live market-coverage check; refusing to publish this APK."
            exit 1
          fi

      - name: Verify full-radar Triple backend contract
        timeout-minutes: 12
        run: |
          set -euo pipefail
          BASE="https://radarx-ai-triple-production.up.railway.app"
          check_endpoint() {
            local path="$1" label="$2" file="$RUNNER_TEMP/radar-check-$2.json" code="000"
            for attempt in $(seq 1 6); do
              code="$(curl --location --connect-timeout 8 --max-time 12 --silent --show-error \
                -o "$file" -w "%{http_code}" "$BASE$path" 2>"$RUNNER_TEMP/radar-curl-$2.log" || true)"
              if [[ "$code" == "200" ]] && node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "$file" >/dev/null 2>&1; then
                echo "PASS $label HTTP 200 with valid JSON (attempt $attempt)"
                return 0
              fi
              echo "Retry $attempt/6 for $label: HTTP $code"
              if (( attempt < 6 )); then sleep 4; fi
            done
            echo "::error::Required endpoint is unavailable or invalid after bounded retries: $label ($path), HTTP $code"
            cat "$file" 2>/dev/null || true
            cat "$RUNNER_TEMP/radar-curl-$2.log" 2>/dev/null || true
            return 1
          }

          while IFS='|' read -r label path; do
            check_endpoint "$path" "$label"
          done <<'ENDPOINTS'
          radar-status|/api/radar-status
          move-radar|/api/move-radar?limit=1
          strong-move-radar|/api/strong-move-radar?limit=1
          rotation-lag-radar|/api/rotation-lag-radar?limit=1
          liquidity-absorption-radar|/api/liquidity-absorption-radar?limit=1
          kahir-radar|/api/kahir-radar?limit=1&scan=0
          doomsday-radar|/api/doomsday-radar?limit=1&scan=0
          professor-radar|/api/professor-radar?limit=1&scan=0
          almuqawim-radar|/api/almuqawim-radar?limit=1&scan=0
          whale-accumulation-radar|/api/whale-accumulation-radar?limit=1&scan=0
          falcon-eye-radar|/api/falcon-eye-radar?limit=1&scan=0
          ENDPOINTS

          # HTTP 200 alone is insufficient: every current production scanner must
          # be instantiated and running; this does not claim every unit is independent.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/radar-check-radar-status.json','utf8'));
          if(!Array.isArray(body.radars))throw new Error('RADAR_STATUS_LIST_MISSING');
          if(body.meta?.paper_trading!==true||body.meta?.real_order_execution!==false||body.meta?.confidence_score!=='UNKNOWN')throw new Error('RADAR_FLEET_POLICY_INVALID');
          const required=[
            'EARLY_MOVE_RADAR','STRONG_MOVE_RADAR','ROTATION_LAG_RADAR',
            'LIQUIDITY_ABSORPTION_RADAR','KAHIR_RADAR','DOOMSDAY_RADAR',
            'ALMUQAWIM_RADAR','EARLY_EXPANSION_RADAR','COIN_HUNTER_RADAR',
            'WHALE_ACCUMULATION_RADAR','PROFESSOR_RADAR','FALCON_EYE_RADAR'
          ];
          const failures=[];
          for(const id of required){
            const row=body.radars.find(x=>x.radar===id);
            if(!row)failures.push(id+':MISSING');
            else if(row.running!==true)failures.push(id+':NOT_RUNNING');
          }
          if(failures.length)throw new Error('RADAR_FLEET_NOT_READY:'+failures.join(','));
          console.log(JSON.stringify({radars:body.radars.length,required_running:required.length,policy:body.meta}));
          NODE
      - name: Verify Coin Hunter public contract and runtime
        timeout-minutes: 8
        env:
          BASE: https://radarx-ai-triple-production.up.railway.app
        run: |
          set -euo pipefail
          READY=false
          CODE="000"
          for attempt in $(seq 1 8); do
            CODE="$(curl --location --connect-timeout 8 --max-time 15 --silent --show-error \
              -o "$RUNNER_TEMP/coin-hunter.json" -w "%{http_code}" \
              "$BASE/api/coin-hunter-radar?quote=USDT&limit=5&scan=0" 2>"$RUNNER_TEMP/coin-hunter-curl.log" || true)"
            export CODE
            if [[ "$CODE" == "200" ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/coin-hunter.json','utf8'));
          const h=body.monitoring||{}, errors=[];
          if(body.radar!=='COIN_HUNTER_RADAR')errors.push('RADAR_INVALID');
          if(body.radar_name!=='🎯 صائد العملات')errors.push('NAME_INVALID');
          if(body.meta?.live!==true||h.running!==true)errors.push('NOT_RUNNING');
          if(!Number(h.last_scan_at)||body.scan?.completed!==true||body.scan?.error)errors.push('NO_SUCCESSFUL_SCAN');
          if(body.status==='not_ready'||body.error)errors.push('NOT_READY');
          if(body.meta?.paper_trading!==true||body.meta?.real_order_execution!==false||body.meta?.confidence_score!=='UNKNOWN')errors.push('POLICY_INVALID');
          if(body.data_policy?.closed_candles_only!==true||body.data_policy?.no_synthetic_prices!==true)errors.push('DATA_POLICY_INVALID');
          if(!Array.isArray(body.candidates))errors.push('CANDIDATES_MISSING');
          if(!Object.hasOwn(body,'lesson')||!Object.hasOwn(body,'coverage'))errors.push('LEARNING_CONTRACT_MISSING');
          if(errors.length){console.error(errors.join(','));process.exit(1);}
          console.log(JSON.stringify({radar:body.radar,scans:h.scans,last_scan_at:h.last_scan_at,candidates:body.candidates.length,learned_samples:h.learned_samples,coverage:body.coverage}));
          NODE
              then READY=true; break; fi
            fi
            echo "Coin Hunter not proven ready (attempt $attempt/8, HTTP $CODE)."
            if (( attempt < 8 )); then sleep 5; fi
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Coin Hunter failed HTTP/schema/runtime validation after bounded retries."
            cat "$RUNNER_TEMP/coin-hunter.json" 2>/dev/null || true
            cat "$RUNNER_TEMP/coin-hunter-curl.log" 2>/dev/null || true
            exit 1
          fi
      - name: Verify Whale Accumulation public contract and runtime
        timeout-minutes: 8
        env:
          BASE: https://radarx-ai-triple-production.up.railway.app
        run: |
          set -euo pipefail
          READY=false
          CODE="000"
          for attempt in $(seq 1 8); do
            CODE="$(curl --location --connect-timeout 8 --max-time 15 --silent --show-error \
              -o "$RUNNER_TEMP/whale.json" -w "%{http_code}" \
              "$BASE/api/whale-accumulation-radar?limit=5&scan=0" 2>"$RUNNER_TEMP/whale-curl.log" || true)"
            export CODE
            if [[ "$CODE" == "200" ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/whale.json','utf8'));
          const h=body.monitoring||{}, errors=[];
          if(body.radar!=='WHALE_ACCUMULATION_RADAR')errors.push('RADAR_INVALID');
          if(body.radar_name!=='🐋 تجمع الحيتان')errors.push('NAME_INVALID');
          if(body.meta?.live!==true||h.running!==true)errors.push('NOT_RUNNING');
          if(!Number(h.last_scan_at)||body.scan?.completed!==true||body.scan?.error)errors.push('NO_SUCCESSFUL_SCAN');
          if(body.status==='not_ready'||body.error)errors.push('NOT_READY');
          if(body.meta?.paper_trading!==true||body.meta?.real_order_execution!==false||body.meta?.confidence_score!=='UNKNOWN')errors.push('POLICY_INVALID');
          if(!Array.isArray(body.candidates))errors.push('CANDIDATES_MISSING');
          if(!body.report||!body.methodology)errors.push('REPORT_OR_METHODOLOGY_MISSING');
          if(errors.length){console.error(errors.join(','));process.exit(1);}
          console.log(JSON.stringify({radar:body.radar,scans:h.scans,last_scan_at:h.last_scan_at,candidates:body.candidates.length,confirmed:body.confirmed_count||0}));
          NODE
              then READY=true; break; fi
            fi
            echo "Whale Accumulation not proven ready (attempt $attempt/8, HTTP $CODE)."
            if (( attempt < 8 )); then sleep 5; fi
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Whale Accumulation failed HTTP/schema/runtime validation after bounded retries."
            cat "$RUNNER_TEMP/whale.json" 2>/dev/null || true
            cat "$RUNNER_TEMP/whale-curl.log" 2>/dev/null || true
            exit 1
          fi
      - name: Verify Multi-Analyst public contract and actual analysis
        timeout-minutes: 10
        env:
          BASE: https://radarx-ai-triple-production.up.railway.app
        run: |
          set -euo pipefail
          READY=false
          CODE="000"
          for attempt in $(seq 1 10); do
            CODE="$(curl --location --connect-timeout 8 --max-time 20 --silent --show-error \
              -o "$RUNNER_TEMP/multi-analyst.json" -w "%{http_code}" \
              "$BASE/api/multi-analyst?quote=USDT&limit=1" 2>"$RUNNER_TEMP/multi-analyst-curl.log" || true)"
            export CODE
            if [[ "$CODE" == "200" ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/multi-analyst.json','utf8'));
          const h=body.monitoring||{}, d=body.diagnostics||{}, errors=[];
          if(body.radar!=='MULTI_ANALYST')errors.push('RADAR_INVALID');
          if(body.meta?.analyst_count!==20||body.meta?.specialist_count!==19)errors.push('ANALYST_COUNT_INVALID');
          if(body.meta?.live!==true)errors.push('NO_VALID_LIVE_ANALYSIS');
          if(body.meta?.paper_trading!==true||body.meta?.real_order_execution!==false||body.meta?.confidence_score!=='UNKNOWN')errors.push('POLICY_INVALID');
          if(!Array.isArray(body.pipeline)||body.pipeline.length!==6)errors.push('PIPELINE_INVALID');
          if(!Array.isArray(body.candidates)||!Array.isArray(body.watchlist))errors.push('RESULT_LISTS_MISSING');
          if(h.running!==true||Number(h.scan_count)<1||!h.last_scan_at)errors.push('BACKGROUND_SCAN_NOT_PROVEN');
          if(h.last_error)errors.push('BACKGROUND_SCAN_ERROR:'+h.last_error);
          if(Number(d.attempted_analyses)<1)errors.push('NO_REAL_ANALYSIS_ATTEMPT');
          if(Number(d.successful_analyses)<1)errors.push('NO_VALID_ANALYSIS');
          if(Number(d.failed_analyses)>Number(d.attempted_analyses))errors.push('DIAGNOSTIC_COUNTS_INVALID');
          const asOf=Date.parse(body.as_of||'');
          if(!Number.isFinite(asOf)||Date.now()-asOf>240000||asOf>Date.now()+5000)errors.push('SNAPSHOT_STALE_OR_FUTURE');
          for(const c of [...(body.candidates||[]),...(body.watchlist||[])]){
            if(!Array.isArray(c.analysts)||c.analysts.length!==19)errors.push('SPECIALISTS_INVALID:'+c.symbol);
            if(c.final_judge?.totalAnalysts!==19)errors.push('FINAL_JUDGE_INVALID:'+c.symbol);
            if(c.paper_trading!==true||c.real_order_execution!==false||c.confidence_score!=='UNKNOWN')errors.push('RESULT_POLICY_INVALID:'+c.symbol);
          }
          if(errors.length){console.error(errors.join(','));process.exit(1);}
          console.log(JSON.stringify({radar:body.radar,analyst_count:body.meta.analyst_count,specialist_count:body.meta.specialist_count,
            scan_count:h.scan_count,last_scan_at:h.last_scan_at,attempted_analyses:d.attempted_analyses,
            successful_analyses:d.successful_analyses,gate_rejected:d.gate_rejected,failed_analyses:d.failed_analyses,
            candidates:body.candidates.length,watchlist:body.watchlist.length,as_of:body.as_of}));
          NODE
              then READY=true; break; fi
            fi
            echo "Multi-Analyst actual runtime not proven (attempt $attempt/10, HTTP $CODE)."
            if (( attempt < 10 )); then sleep 5; fi
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Multi-Analyst failed actual-run, freshness, policy, or 19-specialist contract validation after bounded retries."
            cat "$RUNNER_TEMP/multi-analyst.json" 2>/dev/null || true
            cat "$RUNNER_TEMP/multi-analyst-curl.log" 2>/dev/null || true
            exit 1
          fi
      - name: Verify X-FACTOR multi-analyst + Falcon + Move Forensics
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --check phase2/core/move-forensics.mjs
          node --check phase2/core/evidence-trajectory.mjs
          node --check phase2/core/outcome-calibrator.mjs
          node --check phase2/core/radar-falcon-core.mjs
          node --check phase2/core/radar-quality-v3.mjs
          node --check phase2/core/radar-notification-gate.mjs
          node --check phase2/core/radar-alert-meta.mjs
          node --check phase2/core/king-intelligence.mjs
          node --test phase2/tests/move-forensics.test.mjs
          node --test phase2/tests/multi-analyst-engine.test.mjs
          node --test phase2/tests/multi-analyst.test.mjs
          node --test phase2/tests/rest.test.mjs
          node --test phase2/tests/evidence-trajectory.test.mjs
          node --test phase2/tests/outcome-calibrator.test.mjs
          node --test phase2/tests/falcon-radar-core.test.mjs
          node --test phase2/tests/falcon-market-pulse.test.mjs
          node --test phase2/tests/falcon-eye-radar.test.mjs
          node --test phase2/tests/king-intelligence.test.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Release signing secrets are present
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Materialize signing keystore in runner temp only
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/radarx-release.keystore"
          test -s "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Run Android dashboard release smoke checks
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node android/backend-client-regression.mjs
          node android/background-monitor-regression.mjs
          node android/app/src/main/assets/tests/market-radar-integration.test.mjs
          grep -Fq "https://radarx-ai-triple-production.up.railway.app" android/app/src/main/assets/radarx-backend-client.mjs
          ! grep -RIn --exclude-dir=build "github.io/RadarX-AI" android/app/src/main
          grep -RInq "Paper Trading" android/app/src/main/assets
          grep -RInq "paper_trading=true" android/app/src/main/assets
          grep -RInq "real_order_execution=false" android/app/src/main/assets
          grep -RInq "confidence_score=UNKNOWN" android/app/src/main/assets

      - name: Validate embedded RadarX JavaScript syntax
        run: |
          set -euo pipefail
          find android/app/src/main/assets -maxdepth 1 -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/assets")
          pattern = re.compile(r"\?\?|\?\.")
          offenders = []
          for path in sorted(list(root.rglob("*.mjs")) + list(root.rglob("*.html"))):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"Asset is not valid UTF-8: {path}: {exc}")
              if pattern.search(text):
                  offenders.append(str(path))
          if offenders:
              for path in offenders:
                  print(f"FORBIDDEN_JS_SYNTAX {path}")
              raise SystemExit("Optional chaining/nullish coalescing found in embedded WebView assets.")
          print("Checked WebView assets for optional chaining/nullish coalescing: none found.")
          PY
          node --check android/app/src/main/assets/tests/market-radar-integration.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          root = Path("android/app/src/main/assets")
          scripts = 0
          for path in sorted(root.glob("*.html")):
              text = path.read_text(encoding="utf-8")
              for index, match in enumerate(re.finditer(r"<script(?:[^>]*?)>(.*?)</script>", text, re.IGNORECASE | re.DOTALL), 1):
                  body = match.group(1).strip()
                  if not body or "src=" in match.group(0).lower():
                      continue
                  scripts += 1
                  probe = Path(tempfile.gettempdir()) / ("radarx-inline-%d-%d.mjs" % (abs(hash(str(path))) % 100000, index))
                  probe.write_text(body, encoding="utf-8")
                  try:
                      subprocess.run(["node", "--check", str(probe)], check=True, capture_output=True, text=True)
                  except subprocess.CalledProcessError as exc:
                      print(exc.stdout)
                      print(exc.stderr)
                      raise SystemExit("Inline JavaScript syntax failure: %s script #%d" % (path, index))
                  finally:
                      probe.unlink(missing_ok=True)
          print("Validated", scripts, "inline HTML scripts")
          PY

          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/manifest.json
          test -s android/app/src/main/assets/radar8-lightning.html
          test -s android/app/src/main/assets/coin-hunter-radar.html
          test -s android/app/src/main/assets/whale-accumulation-radar.html
          test -s android/app/src/main/assets/falcon-eye-radar.html
          test -s android/app/src/main/assets/multi-analyst.html
          grep -Fq 'multi-analyst-center.html' android/app/src/main/assets/index.html
          grep -Fq 'whale-accumulation-radar.html' android/app/src/main/assets/index.html
          grep -Fq 'falcon-eye-radar.html' android/app/src/main/assets/index.html
          grep -Fq 'coin-hunter-radar.html' android/app/src/main/assets/index.html
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          grep -Fq 'radar8-lightning.html' android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/whale-accumulation-radar.html
          grep -Fq 'whale-accumulation-radar.html' android/app/src/main/assets/index.html
          test -s android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml

      - name: Build signed universal Release APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/radarx-release.keystore
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Verify APK signature, package, and universal output
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          if (( ${#APKS[@]} != 1 )); then
            echo "::error::Expected exactly one Release APK; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}" || true
            exit 1
          fi

          if [[ "${APKS[0]}" != "$APK_DIR/app-release.apk" ]]; then
            echo "::error::Expected the universal Release APK at $APK_DIR/app-release.apk."
            exit 1
          fi

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "${APKS[0]}"
          CERTS="$($APKSIGNER verify --print-certs "${APKS[0]}")"
          echo "$CERTS"
          ! grep -qi "CN=Android Debug" <<<"$CERTS"

          PACKAGE="$("$AAPT" dump badging "${APKS[0]}" | sed -n "s/^package: name='\\([^']*\\)'.*$/\\1/p" | head -n 1)"
          if [[ "$PACKAGE" != "com.radarx.app" ]]; then
            echo "::error::Unexpected package: $PACKAGE"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/radarx-release"
          cp "${APKS[0]}" "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

          sha256sum "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android Emulator online/offline smoke test (required before publication)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: bash android/smoke-test.sh

      - name: Publish signed APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="radarx-native-build224-radar8-v2-hawkeye-${GITHUB_RUN_NUMBER}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RadarX Native — Build 224 + Radar 8 V2 + عين الصقر Hawkeye V2 1.4.9 ${GITHUB_RUN_NUMBER}" \
            --notes "Signed universal APK built on Build 224 lineage. Version 1.4.9. Includes Radar 8 V2 + Whale Accumulation + X-Factor 20-Analyst Command Center + Radar 9 — عين الصقر Hawkeye V2 + OGN-inspired Move Forensics + Evidence Trajectory Memory, continuous independent background monitoring (auto-start enabled by default), redesigned premium main dashboard, embedded Android UI, Spot/Paper/read-only only; real_order_execution=false; confidence_score=UNKNOWN."

      - name: Verify published HTTPS download
        run: |
          set -euo pipefail
          TAG="radarx-native-build224-radar8-v2-hawkeye-${GITHUB_RUN_NUMBER}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          DOWNLOADED="${RUNNER_TEMP}/radarx-release-downloaded.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/radarx-release.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output "$DOWNLOADED"
          test -s "$DOWNLOADED"
          test "$(stat -c %s "$DOWNLOADED")" = "$(stat -c %s "$APK")"
          test "$(sha256sum "$DOWNLOADED" | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
      - name: Remove signing keystore before artifact upload
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/radarx-release.keystore"
          test ! -e "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Upload verified APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-release-apk
          path: ${{ runner.temp }}/radarx-release/radarx-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0