name: RadarX Android APK Release

on:
  push:
    branches:
      - android-apk-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radarx-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "package: name=|application-label:"
          "$BT/apksigner" verify --verbose "$APK"
          test -s "$APK"

      - name: SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "$APK" | tee "dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk.sha256"
          stat -c "APK_SIZE_BYTES=%s" "$APK"

      - name: Publish HTTPS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.0.0.${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"
          SHA="dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk.sha256"
          gh release create "$TAG" "$APK" "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RadarX Android v1.0.0 (Build ${GITHUB_RUN_NUMBER})" \
            --notes "RadarX Android release wrapper for the current RadarX public PWA. Paper Trading only; real_order_execution=false; confidence_score=UNKNOWN; no Binance API keys; no 24/7 monitoring or Push."

      - name: Verify published HTTPS download
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.0.0.${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"
          DOWNLOADED="$RUNNER_TEMP/radarx-download.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/RadarX-Android-v1.0.0-build-${GITHUB_RUN_NUMBER}.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output "$DOWNLOADED"
          test -s "$DOWNLOADED"
          test "$(stat -c %s "$DOWNLOADED")" = "$(stat -c %s "$APK")"
          test "$(sha256sum "$DOWNLOADED" | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
