name: RadarX Background Market Radar

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

jobs:
  wake-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run server-side RadarX scan
        env:
          RADAR_URL: https://radar-x-ai.vercel.app/api/radarx-background?mode=cron&source=github
        run: |
          curl --fail --show-error --silent --retry 2 --max-time 90 "$RADAR_URL"
