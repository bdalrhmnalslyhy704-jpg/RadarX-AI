name: RadarX Pages Backend Integration Tests

on:
  pull_request:
    branches:
      - pages-static-pwa
  push:
    branches:
      - pages-static-pwa-backend-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check radarx-backend-client.mjs
          node --check sw.js
          node -e "const fs=require('node:fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/); if(!m) throw new Error('MODULE_SCRIPT_NOT_FOUND'); fs.writeFileSync('/tmp/radarx-index-script.mjs',m[1]);"
          node --check /tmp/radarx-index-script.mjs
      - name: Interface contract tests
        run: node --test pages-tests/*.test.mjs
