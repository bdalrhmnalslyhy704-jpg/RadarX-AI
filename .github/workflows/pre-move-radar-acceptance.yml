name: Pre-Move Radar Acceptance

on:
  push:
    branches:
      - build224-multi-analyst-20261007
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regression:
    name: Pre-Move unit, API, UI, and history regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Build 224 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check syntax of modified backend and Pre-Move modules
        run: |
          set -euo pipefail
          node --check phase2/http/api.mjs
          node --check phase2/market/universe-scanner.mjs
          node --check phase2/tests/api.test.mjs
          node --check phase2/tests/market-radar.test.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-pre-move.mjs
          node --check android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Run focused scanner and API regression tests
        run: node --test phase2/tests/market-radar.test.mjs phase2/tests/api.test.mjs

      - name: Run Android Pre-Move UI regression tests
        run: node android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Verify historical replay and outcome accounting tests
        run: node --test phase2/tests/historical-replay-matrix.test.mjs phase2/tests/monthly-historical-replay-lab.test.mjs phase2/tests/radar-signal-outcomes.test.mjs

      - name: Run complete Phase 2 regression suite
        run: node phase2/tests/run-tests.mjs phase2

      - name: Publish regression result as a commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'pre-move-radar-tests',
              description: passed ? 'Pre-Move tests and Phase 2 regression passed' : 'Pre-Move tests or Phase 2 regression failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  live_backend:
    name: Live DHDTech Pre-Move market-data acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
    steps:
      - name: Allow production deployment rollout
        run: sleep 60

      - name: Check DHDTech deployment contract
        run: |
          set -euo pipefail
          CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/deployment-info.json" -w "%{http_code}" "$BASE/api/deployment-info")"
          if [ "$CODE" != "200" ]; then
            echo "::error::DHDTech deployment-info returned HTTP $CODE"
            cat "$RUNNER_TEMP/deployment-info.json"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/deployment-info.json','utf8'));
          if (b.build_version !== 'Build 224') throw new Error('BUILD_VERSION_NOT_224');
          if (b.paper_trading !== true || b.real_order_execution !== false) throw new Error('READ_ONLY_POLICY_INVALID');
          NODE

      - name: Run one real Pre-Move market scan against DHDTech
        run: |
          set -euo pipefail
          CODE="$(curl --location --silent --show-error --connect-timeout 10 --max-time 480 -o "$RUNNER_TEMP/pre-move-radar.json" -w "%{http_code}" "$BASE/api/pre-move-radar?quote=USDT&limit=10")"
          if [ "$CODE" != "200" ]; then
            echo "::error::DHDTech Pre-Move API returned HTTP $CODE"
            cat "$RUNNER_TEMP/pre-move-radar.json"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pre-move-radar.json','utf8'));
          if (b.meta?.radar !== 'PRE_MOVE') throw new Error('PRE_MOVE_RADAR_ID_INVALID');
          if (b.meta?.live !== true || b.meta?.paper_trading !== true || b.meta?.real_order_execution !== false) throw new Error('PRE_MOVE_RADAR_LIVE_POLICY_INVALID');
          if (b.source !== 'Binance Public REST') throw new Error('PRE_MOVE_RADAR_SOURCE_INVALID');
          if (b.session?.timezone !== 'Asia/Aden' || b.session?.window !== '04:00 local → latest closed candle') throw new Error('PRE_MOVE_SESSION_CONTRACT_INVALID');
          const u=b.universe||{};
          for (const k of ['scanned','valid_data','evidence_incomplete_excluded','extended_excluded','no_setup_excluded','eligible_spot_symbols','discovered']) {
            if (!Number.isFinite(Number(u[k]))) throw new Error('PRE_MOVE_SCHEMA_OUTDATED:'+k);
          }
          if (Number(u.scanned)<1 || Number(u.valid_data)<1 || Number(u.eligible_spot_symbols)<1 || Number(u.discovered)<1) throw new Error('PRE_MOVE_NO_VALID_LIVE_MARKET_DATA');
          if (!Array.isArray(b.candidates)) throw new Error('PRE_MOVE_CANDIDATES_MISSING');
          for (const x of b.candidates) {
            const p=x?.pre_move_context;
            if (x?.data_status?.data_valid !== true || !(Number(x.data_quality)>=70) || !(Number(x.liquidity_quality)>=60)) throw new Error('PRE_MOVE_DATA_QUALITY_GATE:'+String(x?.symbol||'UNKNOWN'));
            if (!p || p.evidence_complete !== true || p.closed_candles_only !== true || p.already_moved === true || ['ALREADY_MOVED','NO_SETUP'].includes(p.stage)) throw new Error('PRE_MOVE_EARLY_STAGE_GATE:'+String(x?.symbol||'UNKNOWN'));
            for (const [key,value] of Object.entries({
              score:p.score,session_return_pct:p.session_return_pct,volume_acceleration:p.volume_acceleration,
              taker_buy_ratio:p.taker_buy_ratio,taker_buy_acceleration:p.taker_buy_acceleration,
              compression:p.components?.squeeze,structure:p.components?.structure,
              buying_pressure:p.components?.buying_pressure
            })) if (!Number.isFinite(Number(value))) throw new Error('PRE_MOVE_REQUIRED_EVIDENCE:'+String(x.symbol)+':'+key);
            if (Number(p.session_return_pct)>9 || Number(x.price_change_24h)>20) throw new Error('PRE_MOVE_CHASE_FILTER:'+String(x.symbol));
          }
          console.log(JSON.stringify({
            build:b.meta.radar,live:b.meta.live,source:b.source,session:b.session,
            universe:{scanned:u.scanned,valid_data:u.valid_data,returned:u.returned,actionable:u.actionable,
              evidence_incomplete_excluded:u.evidence_incomplete_excluded,extended_excluded:u.extended_excluded,no_setup_excluded:u.no_setup_excluded},
            candidates:b.candidates.map(x=>({symbol:x.symbol,score:x.pre_move_context.score,stage:x.pre_move_context.stage,session_return_pct:x.pre_move_context.session_return_pct,volume_acceleration:x.pre_move_context.volume_acceleration,taker_buy_ratio:x.pre_move_context.taker_buy_ratio,liquidity_quality:x.liquidity_quality,data_quality:x.data_quality})),
            paper_trading:b.meta.paper_trading,real_order_execution:b.meta.real_order_execution
          }));
          NODE

      - name: Publish live API result as a commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'pre-move-radar-live-api',
              description: passed ? 'DHDTech returned fresh Pre-Move data with all core evidence' : 'DHDTech live Pre-Move API or data gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
