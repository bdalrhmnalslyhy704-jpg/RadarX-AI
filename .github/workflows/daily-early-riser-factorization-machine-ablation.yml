name: Build 224 Daily Factorization-Machine Interaction Ablation

on:
  push:
    branches:
      - research/daily-early-riser-opportunity-targets-20261113
    paths:
      - '.github/workflows/daily-early-riser-factorization-machine-ablation.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: build224-daily-factorization-ablation
  cancel-in-progress: false

jobs:
  compare:
    name: Test low-rank pairwise feature interactions against Logistic and MLP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Build 224 research branch
        uses: actions/checkout@v4
        with:
          ref: research/daily-early-riser-opportunity-targets-20261113

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore exact audited Binance Spot census
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-daily-early-riser-census-20
          run-id: 43336370744
          github-token: ${{ github.token }}
          path: research-input

      - name: Stream-verify census, SHA-256 and immutable row count
        shell: bash
        run: |
          set -euo pipefail
          test -s research-input/daily-early-riser-census.json
          test -s research-input/daily-early-riser-samples.jsonl
          test -s research-input/daily-early-riser-temporal-sequences.jsonl
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createReadStream} from 'node:fs';
          const report=JSON.parse(fs.readFileSync('research-input/daily-early-riser-census.json','utf8'));
          const hash=createHash('sha256');
          let lineFeeds=0,lastByte=null,totalBytes=0;
          for await(const chunk of createReadStream('research-input/daily-early-riser-samples.jsonl')){
            hash.update(chunk);totalBytes+=chunk.length;
            let offset=-1;
            while((offset=chunk.indexOf(10,offset+1))!==-1)lineFeeds++;
            if(chunk.length)lastByte=chunk[chunk.length-1];
          }
          const sha=hash.digest('hex');
          const rows=lineFeeds+(lastByte===10?0:1);
          if(!['AUDITED_WITH_SURVIVOR_UNIVERSE_CAVEAT','READY'].includes(report.status))throw Error('CENSUS_NOT_AUDITED');
          if(report.data_quality?.all_sample_audits_ready!==true)throw Error('SAMPLE_AUDIT_GATE_FAILED');
          if(sha!==report.sample_file?.sha256)throw Error('SAMPLE_SHA256_MISMATCH');
          if(rows!==Number(report.sample_file.rows))throw Error('SAMPLE_ROW_COUNT_MISMATCH');
          console.log(JSON.stringify({status:report.status,rows,bytes:totalBytes,sha256:sha}));
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Train full-history MLP plus low-rank Factorization Machine on the exact standard cohort
        run: |
          mkdir -p artifacts
          node phase2/tools/daily-early-riser-neural-benchmark.mjs \
            --input research-input/daily-early-riser-samples.jsonl \
            --temporal-input research-input/daily-early-riser-temporal-sequences.jsonl \
            --census-report research-input/daily-early-riser-census.json \
            --label-mode safe_opportunity \
            --horizon-hours 72 \
            --target 5 \
            --liquidity-lane STANDARD_750K_PLUS \
            --skip-temporal true \
            --neural-training-history-fraction 1.0 \
            --enable-factorization-machine true \
            --factorization-rank 8 \
            --factorization-iterations 60 \
            --factorization-learning-rate 0.008 \
            --factorization-l2 0.06 \
            --output artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-cross.json

      - name: Publish Factorization-Machine nested selection results
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-cross.json';
          if(!fs.existsSync(path)){
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Factorization-Machine report missing; inspect the training step.\\n');
            process.exit(0);
          }
          const report=JSON.parse(fs.readFileSync(path,'utf8'));
          const target=Object.values(report.target_results||{})[0]||{};
          const neural=target.neural_network||{};
          const profile=(neural.member_training_profiles||[]).find(row=>row.model_kind==='RESIDUAL_FACTOR_CROSS_V1')||null;
          const summary={
            status:report.status,input_sha256:report.input_sha256,
            label_mode:report.label_mode,horizon_hours:report.horizon_hours,
            liquidity_lane:report.required_liquidity_lane,
            neural_training_history_fraction:report.neural_training_history_fraction,
            factorization_machine_enabled:neural.factorization_member_enabled===true,
            factorization_member_index:neural.factorization_member_index??-1,
            architecture:neural.architecture,training_strategy:neural.training_strategy,
            fit_training_samples:neural.fit_training_samples,
            selection_samples:neural.selection_samples,
            factorization_profile:profile,
            factorization_candidate_scores:neural.member_selection_brier_scores?.filter(row=>
              profile&&row.index===neural.factorization_member_index)??[],
            all_member_profiles:neural.member_training_profiles??[],
            inner_selection:neural.inner_selection_diagnostics,
            validation:neural.validation,
            validation_comparison:neural.validation_comparison,
            holdout:neural.holdout,
            holdout_comparison:neural.holdout_comparison,
            gbdt_status:target.boosted_tree_model?.status??null,
            hybrid_status:target.hybrid_model?.status??null,
            predictive_superiority_verified:report.predictive_superiority_verified===true,
            profitability_verified:report.profitability_verified===true,
            production_touched:report.production_touched===true,
            real_order_execution:report.real_order_execution===true
          };
          console.log('[DAILY_FACTOR_CROSS_ABLATION] '+JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Daily low-rank Factorization-Machine ablation\\n\\n```json\\n'+JSON.stringify(summary,null,2)+'\\n```\\n');
          NODE

      - name: Upload Factorization-Machine benchmark
        if: always() && hashFiles('artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-cross.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-daily-factor-cross-ablation
          path: artifacts/daily-early-riser-safe-72h-5pct-mlp-factor-cross.json
          retention-days: 30
