name: RadarX Android APK Release

on:
  push:
    branches:
      - android-apk-embedded-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radarx-android-embedded-final-v2
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        working-directory: android
        run: |
          set -eu
          gradle :app:assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "package: name=|application-label:"
          "$BT/apksigner" verify --verbose "$APK"
          test -s "$APK"

      - name: SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "$APK" | tee "dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk.sha256"
          stat -c "APK_SIZE_BYTES=%s" "$APK"

      - name: Verify Railway backend connectivity
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://radarx-ai-production.up.railway.app"
          HEALTH="$(curl --fail --location --retry 3 --retry-delay 2 --max-time 15 --silent --show-error -o "$RUNNER_TEMP/healthz.json" -w "%{http_code}" "$BASE/healthz")"
          SIGNAL="$(curl --fail --location --retry 3 --retry-delay 2 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/signal.json" -w "%{http_code}" "$BASE/api/signal?symbol=BTCUSDT")"
          READY="$(curl --location --retry 3 --retry-delay 2 --max-time 15 --silent --show-error -o "$RUNNER_TEMP/readyz.json" -w "%{http_code}" "$BASE/readyz")"
          test "$HEALTH" = "200"
          test "$SIGNAL" = "200"
          case "$READY" in
            200|503) ;;
            *) echo "Unexpected readyz status: $READY"; exit 1 ;;
          esac
          echo "Railway healthz=$HEALTH signal=$SIGNAL readyz=$READY"
          echo "A 503 readyz is treated as data-not-ready, not as a network disconnect."

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            set -eu
            APK="android/app/build/outputs/apk/release/app-release.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.radarx.app || true
            adb shell am start -n com.radarx.app/.MainActivity
            ready=0
            connected=0
            for i in $(seq 1 12); do
              sleep 3
              LOGS="$(adb logcat -d -s RadarXSmoke:I '*:S' 2>/dev/null || true)"
              if printf '%s\n' "$LOGS" | grep -Fq "UI_READY"; then ready=1; fi
              if printf '%s\n' "$LOGS" | grep -Fq "BACKEND_CONNECTED"; then connected=1; fi
              if [ "$ready" = "1" ] && [ "$connected" = "1" ]; then break; fi
            done
            test "$ready" = "1"
            test "$connected" = "1"
            adb shell cmd connectivity airplane-mode enable || true
            adb shell settings put global airplane_mode_on 1 || true
            adb shell svc wifi disable || true
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true || true
            sleep 3
            adb logcat -c
            adb shell am force-stop com.radarx.app
            adb shell am start -n com.radarx.app/.MainActivity
            ready_offline=0
            disconnected=0
            for i in $(seq 1 8); do
              sleep 2
              LOGS="$(adb logcat -d -s RadarXSmoke:I '*:S' 2>/dev/null || true)"
              if printf '%s\n' "$LOGS" | grep -Fq "UI_READY"; then ready_offline=1; fi
              if printf '%s\n' "$LOGS" | grep -Fq "BACKEND_DISCONNECTED"; then disconnected=1; fi
              if [ "$ready_offline" = "1" ] && [ "$disconnected" = "1" ]; then break; fi
            done
            test "$ready_offline" = "1"
            test "$disconnected" = "1"
            adb shell cmd connectivity airplane-mode disable || true
            adb shell settings put global airplane_mode_on 0 || true
            adb shell svc wifi enable || true
            echo "Android emulator online/offline smoke tests passed."

      - name: Verify embedded assets are present inside APK source
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/radarx-backend-client.mjs
          test -s android/app/src/main/assets/radarx-backend-client.js
          test -s android/app/src/main/assets/manifest.json
          test -s android/app/src/main/assets/icons/icon-192.svg
          test -s android/app/src/main/assets/icons/icon-512.svg
          ! grep -RIn --exclude-dir=build "github.io/RadarX-AI" android/app/src/main

      - name: Verify embedded shell has no GitHub Pages dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=build "github.io/RadarX-AI" android
          grep -RIn "appassets.androidplatform.net/assets/index.html" android/app/src/main
          grep -RIn "radarx-ai-production.up.railway.app" android/app/src/main
          grep -RIn "real_order_execution=false" android/app/src/main/assets
          grep -RIn "paper_trading=true" android/app/src/main/assets
          grep -RIn "confidence_score.*UNKNOWN" android/app/src/main/assets

      - name: Publish HTTPS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.2.0"
          TAG="radarx-android-v${VERSION}.${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          SHA="dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk.sha256"
          gh release create "$TAG" "$APK" "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RadarX Android v1.2.0 (Embedded UI, Build ${GITHUB_RUN_NUMBER})" \
            --notes "RadarX Android 1.2.0 with embedded local UI via WebViewAssetLoader. Runtime network allowlist: appassets.androidplatform.net and RadarX Railway backend only. Paper Trading only; real_order_execution=false; confidence_score=UNKNOWN; no Binance API keys; no real trading."

      - name: Verify published HTTPS download
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.2.0.${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk"
          DOWNLOADED="$RUNNER_TEMP/radarx-download.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/RadarX-Android-v1.2.0-build-${GITHUB_RUN_NUMBER}.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output "$DOWNLOADED"
          test -s "$DOWNLOADED"
          test "$(stat -c %s "$DOWNLOADED")" = "$(stat -c %s "$APK")"
          test "$(sha256sum "$DOWNLOADED" | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
