name: Build 224 DHDTech Adaptive Trader Live Acceptance

# Production DHDTech/TCN verification is on-demand and cannot block APK packaging.
on:
  push:
    branches:
      - build224-multi-analyst-20261007
      - verify/build224-tcn-fallback-20261106
    paths:
      - 'Dockerfile'
      - 'phase2/core/cognitive-brain.mjs'
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/core/adaptive-trader-worker.mjs'
      - 'phase2/core/adaptive-trader-engine.mjs'
      - 'phase2/core/strong-move-radar.mjs'
      - 'phase2/core/dynamic-early-warning-gate.mjs'
      - 'phase2/core/historical-replay.mjs'
      - 'phase2/tools/historical-replay.mjs'
      - 'phase2/push/index.mjs'
      - 'phase2/TCN_V6_VALIDATION_POLICY.md'
      - '.github/workflows/dhdtech-adaptive-trader-acceptance.yml'
  workflow_dispatch:

concurrency:
  group: dhdtech-adaptive-trader-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-dhdtech:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait for the deployed DHDTech worker to complete a verified live scan
        uses: actions/github-script@v7
        env:
          RADARX_BACKEND_BASE_URL: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
        with:
          script: |
            const base=String(process.env.RADARX_BACKEND_BASE_URL||'').trim();
            let url;
            try { url=new URL(base); } catch { core.setFailed('RADARX_BACKEND_BASE_URL is not a valid URL.'); return; }
            if(url.protocol!=='https:'||url.pathname!=='/'||url.username||url.password||url.search||url.hash||/\.up\.railway\.app$/i.test(url.hostname)){
              core.setFailed('RADARX_BACKEND_BASE_URL must be the bare HTTPS DHDTech origin.');
              return;
            }

            const started=Date.now();
            const probeRun=context.ref==='refs/heads/verify/build224-tcn-fallback-20261106';
            const deadline=started+(probeRun?2*60*1000:55*60*1000);
            core.info('DHDTECH_ACCEPTANCE_MODE '+(probeRun?'SHORT_READ_ONLY_PROBE':'FULL_BUILD224_ACCEPTANCE'));
            const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            let lastError='No status response yet';
            let lastObserved=null;
            // A complete eligible Spot universe needs several bounded 40-pair scans.
            // Trigger the next scan only after the previous scan timestamp advances
            // and the worker is no longer in flight; never enqueue duplicate scans.
            let lastManualScanRequestedForScanAt=null;
            let manualScanRequestedAt=null;
            while(Date.now()<deadline){
              try{
                const [response,deploymentResponse]=await Promise.all([
                  fetch(url.origin+'/api/adaptive-trader/status',{
                    headers:{Accept:'application/json', 'Cache-Control':'no-cache'},
                    signal:AbortSignal.timeout(8000)
                  }),
                  fetch(url.origin+'/api/deployment-info',{
                    headers:{Accept:'application/json', 'Cache-Control':'no-cache'},
                    signal:AbortSignal.timeout(8000)
                  })
                ]);
                const [value,deployment]=await Promise.all([response.json(),deploymentResponse.json()]);
                const currentScanAt=Date.parse(String(value.last_scan_at||''));
                const scanCoverage=value.scan_coverage||{};
                const eligibleSymbolCount=Number(scanCoverage.eligible_symbols_count)||0;
                const completedSweep=scanCoverage.last_completed_sweep||{};
                const fullUniverseCoverageReady=eligibleSymbolCount>0&&
                  Number(scanCoverage.completed_sweeps)>=1&&
                  Number(completedSweep.eligible_symbols)===eligibleSymbolCount&&
                  Number(completedSweep.attempted_symbols)===eligibleSymbolCount&&
                  Number(completedSweep.failed_symbols)===0;
                const currentScanFresh=Number.isFinite(currentScanAt)&&currentScanAt<=Date.now()+5000&&
                  Date.now()-currentScanAt<=8*60*1000&&value.last_error===null;
                // Keep running bounded scans until one entire current eligible universe
                // has been attempted with zero data failures. Each request is tied to the
                // previous completed scan timestamp to prevent duplicate in-flight work.
                const scanKey=Number.isFinite(currentScanAt)?currentScanAt:0;
                if(response.ok&&!fullUniverseCoverageReady&&value.enabled===true&&
                   value.in_flight!==true&&lastManualScanRequestedForScanAt!==scanKey){
                  lastManualScanRequestedForScanAt=scanKey;
                  const requestedAt=Date.now();
                  const scanResponse=await fetch(url.origin+'/api/adaptive-trader/scan',{
                    method:'POST',
                    headers:{Accept:'application/json','Content-Type':'application/json','Cache-Control':'no-cache'},
                    body:JSON.stringify({limit:40}),
                    signal:AbortSignal.timeout(8000)
                  });
                  const scanBody=await scanResponse.json().catch(()=>({}));
                  if(scanResponse.status===202||scanResponse.status===200){
                    manualScanRequestedAt=requestedAt;
                    core.info('DHDTECH_MANUAL_READ_ONLY_SCAN_REQUESTED '+JSON.stringify({
                      http:scanResponse.status,status:scanBody.status||null,
                      requested_limit:scanBody.requested_limit||40,
                      coverage_pct:Number(scanCoverage.progress_pct)||0,
                      remaining_symbols:Number(scanCoverage.remaining_symbols_count)||eligibleSymbolCount||null,
                      completed_sweeps:Number(scanCoverage.completed_sweeps)||0
                    }));
                  }else{
                    lastManualScanRequestedForScanAt=null;
                    core.warning('DHDTECH_MANUAL_READ_ONLY_SCAN_NOT_STARTED '+JSON.stringify({
                      http:scanResponse.status,status:scanBody.status||null,
                      error:scanBody.error||null
                    }));
                  }
                }
                const summary=value.last_summary;
                const meta=summary&&summary.meta;
                const scannedAt=Date.parse(String(value.last_scan_at||''));
                const summaryAt=Date.parse(String(summary&&summary.as_of||''));
                const historyRows=Number(value.memory&&value.memory.history_rows)||0;
                const learning=value.learning_profile||null;
                const capture=value.learning_capture||null;
                const cognitive=(value&&value.cognitive_brain)||
                  (summary&&summary.cognitive_brain)||null;
                const cognitiveProfile=cognitive&&cognitive.profile?cognitive.profile:cognitive||{};
                const cognitiveCapture=cognitive&&cognitive.capture||{};
                const neuralNetwork=cognitiveProfile.neural_network||cognitiveCapture.neural_network||{};
                const temporalNetwork=cognitiveProfile.temporal_network||cognitiveCapture.temporal_network||{};
                const temporalNetworkContract=Boolean(
                  temporalNetwork.architecture==='TCN_24x29_DILATED_RESIDUAL_BTC_CONTEXT_GATED_MASKED_MICRO_ENSEMBLE_V6'&&
                  temporalNetwork.training_strategy==='SHARED_TEMPORAL_TCN_REGIME_LOCAL_SELECTION_SHARED_FALLBACK_POOLED_ANCHOR_V19'&&
                  temporalNetwork.model_scope==='SHARED_TCN_RESIDUAL_WITH_REGIME_SPECIFIC_LOGISTIC_ANCHORS'&&
                  temporalNetwork.target_definition==='FIRST_PASSAGE_3PCT_BEFORE_MINUS_2PCT_4H_15M_V2'&&
                  Number(temporalNetwork.sequence_steps)===24&&
                  Number(temporalNetwork.sequence_channels)===29&&
                  temporalNetwork.temporal_label_resolution==='15M_ONLY'&&
                  Number(temporalNetwork.ensemble_members_required)===3&&
                  (!temporalNetwork.trained||Number(temporalNetwork.ensemble_members)===3)
                );
                const neuralNetworkContract=Boolean(
                  neuralNetwork.architecture==='18-10-6-1+RESIDUAL'&&
                  Number(neuralNetwork.input_neurons)===18&&
                  Number(neuralNetwork.hidden_neurons)===10&&
                  Number(neuralNetwork.second_hidden_neurons)===6&&
                  Number(neuralNetwork.output_neurons)===1&&
                  Number(neuralNetwork.samples_required)>=240&&
                  Number(neuralNetwork.ensemble_members_required)===3&&
                  (!neuralNetwork.trained||Number(neuralNetwork.ensemble_members)===3)
                );
                const cognitiveSplitReady=Boolean(
                  cognitiveProfile.method==='NESTED_PURGED_WALK_FORWARD_RESIDUAL_NEURAL_MODEL_V5'&&
                  Number(cognitiveProfile.resolved_samples)>=100&&
                  Number(cognitiveProfile.training_samples)>=60&&
                  Number(cognitiveProfile.validation_samples)>=20&&
                  Number(cognitiveProfile.holdout_samples)>=20&&
                  cognitiveProfile.validation?.evaluated===true&&
                  cognitiveProfile.holdout?.evaluated===true&&
                  Number(cognitiveProfile.max_training_outcome_resolved_at)<Number(cognitiveProfile.validation_start_at)&&
                  Number(cognitiveProfile.validation_start_at)<Number(cognitiveProfile.holdout_start_at)
                );
                const universe=summary&&summary.universe||{};
                const workerContract=value.scanner_contract==='SERVER_DRIVEN_SCAN_V2';
                const systemHealthy=deploymentResponse.ok&&deployment.build_version==='Build 224'&&
                  deployment.expected_radars===12&&deployment.registered_radars===12&&
                  deployment.pre_move_scanner_ready===true&&
                  deployment.analyst_system&&deployment.analyst_system.expected_analysts===20&&
                  deployment.analyst_system.engine_configured===true&&
                  deployment.analyst_system.review_bridge_installed===true&&
                  deployment.paper_trading===true&&deployment.real_order_execution===false;
                const candidates=summary&&summary.candidates;
                const prices=summary&&summary.latest_prices;
                const push=deployment.push&&typeof deployment.push==='object'?deployment.push:{};
                lastObserved={
                  http:response.status,status:value.status,scan_count:value.scan_count,
                  successful_scans:value.successful_scans,last_error:value.last_error,
                  radars:deployment.registered_radars,analysts:deployment.analyst_system&&deployment.analyst_system.expected_analysts,
                  system_healthy:systemHealthy,worker_contract:value.scanner_contract||null,
                  last_scan_at:value.last_scan_at,history_rows:historyRows,
                  candidates:Array.isArray(candidates)?candidates.length:null,
                  latest_prices:Array.isArray(prices)?prices.length:null,
                  push:{provider:String(push.provider||'unknown'),enabled:push.enabled===true,
                    active_subscriptions:Number(push.active_subscriptions)||0,
                    provider_subscriptions:Number(push.provider_subscriptions)||0,
                    fcm_devices:Number(push.fcm_devices)||0,
                    physical_device_receipt_count:Number(push.physical_device_receipt_count)||0,
                    physical_device_receipt_window_ms:Number(push.physical_device_receipt_window_ms)||0,
                    webpush_subscriptions:Number(push.webpush_subscriptions)||0,
                    physical_device_delivery_verified:push.physical_device_delivery_verified===true},
                  historical_samples_available:Number(universe.historical_training_samples_available)||0,
                  scan_coverage:{
                    eligible_symbols:eligibleSymbolCount,
                    progress_pct:Number(scanCoverage.progress_pct)||0,
                    attempted_symbols:Number(scanCoverage.attempted_symbols_count)||0,
                    valid_symbols:Number(scanCoverage.valid_symbols_count)||0,
                    failed_symbols:Number(scanCoverage.failed_symbols_count)||0,
                    remaining_symbols:Number(scanCoverage.remaining_symbols_count)||0,
                    completed_sweeps:Number(scanCoverage.completed_sweeps)||0,
                    last_completed_sweep:completedSweep,
                    full_universe_ready:fullUniverseCoverageReady
                  },
                  learning_profile:learning?{
                    resolved_samples:Number(learning.resolved_samples)||0,
                    required_samples:Number(learning.required_samples)||60,
                    ready:learning.ready===true,
                    historical_samples:Number(learning.historical_samples)||0
                  }:null,
                  learning_capture:capture?{
                    historical_input_samples:Number(capture.historical_input_samples)||0,
                    new_historical_samples:Number(capture.new_historical_samples)||0,
                    historical_sequence_backfills:Number(capture.historical_sequence_backfills)||0,
                    temporal_sequence_samples:Number(capture.temporal_sequence_samples)||0,
                    temporal_sequence_non_15m_labels:Number(capture.temporal_sequence_non_15m_labels)||0,
                    temporal_sequence_missing_samples:Number(capture.temporal_sequence_missing_samples)||0,
                    historical_rejected:capture.historical_rejected||{},
                    snapshot_historical_samples_available:Number(capture.snapshot_historical_samples_available)||0,
                    snapshot_closed_candle_outcomes_input:Number(capture.snapshot_closed_candle_outcomes_input)||0,
                    new_deep_candidate_samples:Number(capture.new_deep_candidate_samples)||0,
                    resolved_samples:Number(capture.resolved_samples)||0,
                    unresolved_training_samples:Number(capture.unresolved_training_samples)||0
                  }:null,
                  cognitive_brain:cognitive?{
                    model_contract:String(value.cognitive_model_contract||'MISSING'),
                    method:String(cognitiveProfile.method||cognitive.method||'unknown'),
                    ranking_ready:cognitiveProfile.ranking_ready===true,
                    probability_ready:cognitiveProfile.probability_ready===true,
                    learning_status:String(cognitive.status||'LEARNING'),
                    resolved_samples:Number(cognitiveProfile.resolved_samples)||0,
                    training_samples:Number(cognitiveProfile.training_samples)||0,
                    validation_samples:Number(cognitiveProfile.validation_samples)||0,
                    holdout_samples:Number(cognitiveProfile.holdout_samples)||0,
                    validation_evaluated:cognitiveProfile.validation?.evaluated===true,
                    holdout_evaluated:cognitiveProfile.holdout?.evaluated===true,
                    chronological_split_ready:cognitiveSplitReady,
                    purged_overlap_samples:Number(cognitiveProfile.purged_overlap_samples)||0,
                    journal_records:Number(cognitive.journal_records??cognitive.journal_rows)||0,
                    journal_resolved:Number(cognitiveCapture.journal_resolved??cognitive.resolved_journal_rows)||0,
                    early_setup_reviews:Number(cognitiveCapture.early_setup_reviews)||0,
                    neural_network:neuralNetwork?{
                      architecture:String(neuralNetwork.architecture||'unknown'),
                      status:String(neuralNetwork.status||'unknown'),
                      training_samples:Number(neuralNetwork.training_samples)||0,
                      samples_required:Number(neuralNetwork.samples_required)||0,
                      trained:neuralNetwork.trained===true,
                      selected:neuralNetwork.selected===true,
                      validation_brier:neuralNetwork.validation?.model_brier_score??null,
                      validation_base_rate_brier:neuralNetwork.validation?.base_rate_brier_score??null,
                      holdout_brier:neuralNetwork.holdout?.model_brier_score??null,
                      holdout_base_rate_brier:neuralNetwork.holdout?.base_rate_brier_score??null,
                      probability_ready:neuralNetwork.probability_ready===true,
                      validation_evaluated:neuralNetwork.validation?.evaluated===true,
                      holdout_evaluated:neuralNetwork.holdout?.evaluated===true
                    }:null,
                    temporal_network:temporalNetwork?{
                      architecture:String(temporalNetwork.architecture||'unknown'),
                      target_definition:String(temporalNetwork.target_definition||'unknown'),
                      status:String(temporalNetwork.status||'unknown'),
                      resolved_samples:Number(temporalNetwork.resolved_samples)||0,
                      training_samples:Number(temporalNetwork.training_samples)||0,
                      validation_samples:Number(temporalNetwork.validation_samples)||0,
                      holdout_samples:Number(temporalNetwork.holdout_samples)||0,
                      regime_specialists:temporalNetwork.regime_specialists||{},
                      trained:temporalNetwork.trained===true,
                      selected:temporalNetwork.selected===true,
                      probability_ready:temporalNetwork.probability_ready===true,
                      live_eligibility_ready:temporalNetwork.live_eligibility_ready===true,
                      validation_evaluated:temporalNetwork.validation?.evaluated===true,
                      validation_brier:temporalNetwork.validation?.model_brier_score??null,
                      validation_base_rate_brier:temporalNetwork.validation?.base_rate_brier_score??null,
                      validation_pooled_logistic_brier:temporalNetwork.validation?.pooled_logistic_brier_score??null,
                      holdout_evaluated:temporalNetwork.holdout?.evaluated===true,
                      holdout_brier:temporalNetwork.holdout?.model_brier_score??null,
                      holdout_base_rate_brier:temporalNetwork.holdout?.base_rate_brier_score??null,
                      holdout_pooled_logistic_brier:temporalNetwork.holdout?.pooled_logistic_brier_score??null,
                      holdout_comparison:temporalNetwork.holdout_comparison||{}
                    }:null
                  }:null
                };
                const scanFresh=Number.isFinite(scannedAt)&&scannedAt<=Date.now()+5000&&
                  Date.now()-scannedAt<=8*60*1000&&
                  (manualScanRequestedAt===null||scannedAt>=manualScanRequestedAt-5000);
                const cognitiveV5=value.cognitive_model_contract==='RADARX_COGNITIVE_AGENT_V5_TCN_V6'&&
                  cognitiveProfile.method==='NESTED_PURGED_WALK_FORWARD_RESIDUAL_NEURAL_MODEL_V5'&&
                  cognitiveProfile.identifier_features_used===false&&neuralNetworkContract&&temporalNetworkContract;
                const probabilityClaimSafe=temporalNetwork.probability_ready!==true||
                  (temporalNetwork.validation?.evaluated===true&&temporalNetwork.validation?.beat_base_rate===true&&
                   temporalNetwork.holdout?.evaluated===true&&temporalNetwork.holdout?.beat_base_rate===true);
                const temporalComparison=temporalNetwork.holdout_comparison||{};
                const selectedTemporalRegimes=Array.isArray(temporalNetwork.selected_regimes)
                  ?temporalNetwork.selected_regimes:[];
                const temporalNeuralContributionSafe=selectedTemporalRegimes.length>0&&
                  selectedTemporalRegimes.every(regime=>{
                    const specialist=temporalNetwork.regime_specialists?.[regime];
                    return specialist?.neural_residual_contributes===true&&
                      Number(specialist.selected_residual_scale)>0&&
                      specialist.probability_calibration?.fitted===true&&
                      specialist.logistic_probability_calibration?.fitted===true;
                  });
                const neuralLiveReady=temporalNetwork.training_strategy==='SHARED_TEMPORAL_TCN_REGIME_LOCAL_SELECTION_SHARED_FALLBACK_POOLED_ANCHOR_V19'&&
                  temporalNetwork.model_scope==='SHARED_TCN_RESIDUAL_WITH_REGIME_SPECIFIC_LOGISTIC_ANCHORS'&&
                  temporalNeuralContributionSafe&&temporalNetwork.selected===true&&
                  temporalNetwork.probability_ready===true&&temporalNetwork.live_eligibility_ready===true&&
                  temporalNetwork.validation?.evaluated===true&&temporalNetwork.validation?.beat_base_rate===true&&
                  temporalNetwork.holdout?.evaluated===true&&temporalNetwork.holdout?.beat_base_rate===true&&
                  Number(temporalNetwork.holdout?.sample_count)>=150&&
                  temporalComparison.passed===true&&temporalComparison.beats_base_rate===true&&
                  temporalComparison.beats_pooled_logistic===true;
                // A trained V5 is not an accepted V5: require its own chronological
                // validation, untouched 100+ outcome holdout, and independent
                // logistic/base-rate superiority gates before DHDTech can be green.
                const v5NeuralLiveReady=neuralNetwork.trained===true&&
                  neuralNetwork.selected===true&&neuralNetwork.probability_ready===true&&
                  neuralNetwork.live_eligibility_ready===true&&
                  Number(neuralNetwork.training_samples)>=240&&
                  neuralNetwork.validation?.evaluated===true&&
                  neuralNetwork.validation?.beat_base_rate===true&&
                  neuralNetwork.holdout?.evaluated===true&&
                  neuralNetwork.holdout?.beat_base_rate===true&&
                  Number(neuralNetwork.holdout_comparison?.sample_count)>=100&&
                  neuralNetwork.holdout_comparison?.passed===true&&
                  neuralNetwork.holdout_comparison?.beats_base_rate===true&&
                  neuralNetwork.holdout_comparison?.beats_same_window_logistic===true&&
                  neuralNetwork.holdout_comparison?.beats_global_logistic===true&&
                  neuralNetwork.holdout_comparison?.beats_recent_logistic!==false;
                const paperValidation=value.paper_validation_profile||{};
                const paperTradingReady=paperValidation.ready===true&&
                  Number(paperValidation.evaluation_window_trades)>=100&&
                  Number(paperValidation.win_rate_pct)>=55&&
                  Number(paperValidation.net_pnl_usdt)>0&&
                  Number(paperValidation.max_drawdown_pct)<=8;
                const physicalDeviceDeliveryReady=push.enabled===true&&
                  Number(push.fcm_devices)>=2&&
                  Number(push.physical_device_receipt_count)>=2&&
                  Number(push.physical_device_receipt_window_ms)>=7*24*60*60*1000&&
                  push.physical_device_delivery_verified===true;
                lastObserved.full_universe_coverage_ready=fullUniverseCoverageReady;
                lastObserved.paper_trading_ready=paperTradingReady;
                lastObserved.physical_device_delivery_ready=physicalDeviceDeliveryReady;
                lastObserved.v5_neural_live_ready=v5NeuralLiveReady;
                lastObserved.temporal_tcn_live_ready=neuralLiveReady;
                lastObserved.cognitive_chronological_split_ready=cognitiveSplitReady;
                lastObserved.neural_live_ready=neuralLiveReady;
                lastObserved.temporal_network_contract=temporalNetworkContract;
                lastObserved.neural_holdout_comparison=temporalComparison;
                lastObserved.paper_trading_readiness={
                  ready:paperTradingReady,evaluation_window_trades:Number(paperValidation.evaluation_window_trades)||0,
                  win_rate_pct:Number(paperValidation.win_rate_pct)||0,
                  net_pnl_usdt:Number(paperValidation.net_pnl_usdt)||0,
                  max_drawdown_pct:Number(paperValidation.max_drawdown_pct)||0
                };
                const valid=response.ok&&systemHealthy&&workerContract&&value.enabled===true&&value.running===true&&
                  value.in_flight!==true&&value.paper_trading===true&&value.real_order_execution===false&&
                  Number(value.successful_scans)>0&&value.last_error===null&&scanFresh&&
                  summary&&summary.status==='LIVE_DATA'&&Number.isFinite(summaryAt)&&
                  Date.now()-summaryAt>=0&&Date.now()-summaryAt<=8*60*1000&&meta&&meta.live===true&&
                  meta.paper_trading===true&&meta.real_order_execution===false&&
                  meta.closed_candles_only===true&&meta.engine==='ADAPTIVE_TRADER_SIDECAR_V1'&&
                  Array.isArray(candidates)&&candidates.length>0&&
                  Array.isArray(prices)&&prices.length>0&&historyRows>0&&
                  cognitive&&cognitiveV5&&cognitiveSplitReady&&neuralNetworkContract&&
                  v5NeuralLiveReady&&temporalNetworkContract&&temporalNetwork.trained===true&&
                  Number(temporalNetwork.ensemble_members)===3&&Number(temporalNetwork.training_samples)>=160&&
                  fullUniverseCoverageReady&&paperTradingReady&&physicalDeviceDeliveryReady&&
                  neuralLiveReady&&probabilityClaimSafe&&Number(cognitiveProfile.resolved_samples)>=0&&
                  Number(cognitiveProfile.training_samples)>=0&&
                  Number(cognitiveProfile.validation_samples)>=0&&
                  Number(cognitiveProfile.holdout_samples)>=0&&
                  Number(cognitiveProfile.purged_overlap_samples)>=0&&
                  (cognitiveProfile.validation_start_at===null||cognitiveProfile.max_training_outcome_resolved_at===null||
                    Number(cognitiveProfile.max_training_outcome_resolved_at)<Number(cognitiveProfile.validation_start_at))&&
                  (cognitiveProfile.validation_start_at===null||cognitiveProfile.holdout_start_at===null||
                    Number(cognitiveProfile.validation_start_at)<Number(cognitiveProfile.holdout_start_at))&&
                  (cognitiveProfile.probability_ready!==true||
                    (cognitiveProfile.holdout&&cognitiveProfile.holdout.evaluated===true&&cognitiveProfile.holdout.beat_base_rate===true));
                if(valid){
                  const description='Build 224 accepted: full Spot sweep, V5/TCN, paper validation and two-device FCM receipts verified.';
                  await github.rest.repos.createCommitStatus({
                    owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
                    state:'success',context:'dhdtech-adaptive-trader-live',
                    description:description.slice(0,140),target_url:url.origin+'/api/adaptive-trader/status'
                  });
                  core.info('DHDTECH_ADAPTIVE_TRADER_LIVE_OK '+JSON.stringify({
                    ...lastObserved,
                    cognitive_model_may_still_be_learning:cognitiveProfile.probability_ready!==true,
                    chronological_split_ready:cognitiveSplitReady
                  }));
                  return;
                }
                lastError='DHDTech full-universe Spot sweep, V5/TCN independent superiority, 100-trade paper validation, or two-device physical FCM receipt gate is not ready';
              }catch(error){
                lastError=String(error&&error.message||error).slice(0,180);
              }
              core.info('Waiting for the deployed DHDTech worker: '+lastError+
                (lastObserved?' | '+JSON.stringify(lastObserved):''));
              await delay(15000);
            }

            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:'failure',context:'dhdtech-adaptive-trader-live',
              description:('DHDTech live scan not verified: '+lastError).slice(0,140),
              target_url:url.origin+'/api/adaptive-trader/status'
            });
            core.setFailed('DHDTech Adaptive Trader live acceptance failed: '+lastError+
              (lastObserved?' | '+JSON.stringify(lastObserved):''));
