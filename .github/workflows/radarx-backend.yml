name: RadarX Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/radarx-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/radarx-backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/radarx
      - name: Run unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"
