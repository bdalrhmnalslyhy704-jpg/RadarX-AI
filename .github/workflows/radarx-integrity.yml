name: RadarX Integrity Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript files
        run: |
          set -e
          node --check RadarX_Ultimate_5.5.js
          node --check RadarX_ProEngine_5.5.js
          for f in api/*.js; do
            node --check "$f"
          done
      - name: Check embedded One-File scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path("RadarX_ONEFILE_5.5.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", s, flags=re.I)
          if len(scripts) != 3:
              raise SystemExit(f"Expected 3 script blocks, found {len(scripts)}")
          for i,code in enumerate(scripts[1:], 2):
              p=Path(tempfile.gettempdir())/f"radarx_script_{i}.js"
              p.write_text(code,encoding="utf-8")
              subprocess.run(["node","--check",str(p)],check=True)
          print("One-File script syntax OK")
          PY
