name: Build 224 Neural Closure — Replay Fixed Binance Spot Cohort

on:
  push:
    branches:
      - research/build224-point-in-time-liquidity-20261117
      - research/build224-tcn-lstm-pairwise-rank-20261118
      - research/build224-tcn-lstm-shared-loss-20261120
      - research/build224-tcn-lstm-score-head-oos-ablation-20261120
      - research/build224-temporal-logistic-cv-20261120
    paths:
      - '.github/workflows/neural-closure-fixed-cohort-replay.yml'
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/tools/train-neural-closure-models.mjs'
      - 'phase2/tests/temporal-lstm-hybrid.test.mjs'
      - 'phase2/tests/neural-closure-training-wiring.test.mjs'
      - 'phase2/core/neural-closure-contracts.mjs'
      - 'phase2/tests/neural-closure-contracts.test.mjs'

permissions:
  actions: read
  contents: read

concurrency:
  # Full cohort work is push-only; all PRs use lightweight regression workflows.
  # Normalize by branch name so one branch cannot run two expensive replays.
  group: build224-neural-closure-fixed-cohort-replay-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    name: Rebenchmark challengers on the immutable 180-day Binance Spot cohort
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the previously validated fixed cohort
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-neural-closure-dataset-039c9074fc21fa0ea303e360a6ea56d3a401a559
          path: artifacts/neural-closure
          repository: ${{ github.repository }}
          run-id: '44196188685'
          github-token: ${{ github.token }}

      - name: Verify required immutable cohort file exists
        run: |
          test -s artifacts/neural-closure/dataset.json
          echo "Reusing the exact validated 30-symbol / 32,300-row cohort."
          echo "Expected canonical dataset SHA-256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77"

      - name: Train neural challengers on the unchanged cohort
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          node --expose-gc phase2/tools/train-neural-closure-models.mjs \
            --input artifacts/neural-closure/dataset.json \
            --output artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json \
            --epochs 8 \
            --denseEpochs 36 \
            --minimumHoldoutTrades 100 \
            --minimumWinRatePct 55 \
            --maximumDrawdownPct 8 \
            --roundTripCostBps 30

      - name: Verify exact cohort identity and candidate code SHA
        env:
          EXPECTED_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
          EXPECTED_ROW_COUNT: '32300'
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const report=JSON.parse(fs.readFileSync('artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json','utf8'));
            if(report.integrity?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) throw new Error('FIXED_COHORT_SHA_MISMATCH');
            if(Number(report.integrity?.row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) throw new Error('FIXED_COHORT_ROW_COUNT_MISMATCH');
            if(report.integrity?.model_source_commit_sha!==process.env.GITHUB_SHA) throw new Error('MODEL_SOURCE_SHA_MISMATCH');
            console.log(JSON.stringify({dataset_sha256:report.integrity.dataset_sha256,row_count:report.integrity.row_count,model_source_commit_sha:report.integrity.model_source_commit_sha,status:report.status}));
          "

      - name: Validate immutable experiment, tuned Logistic baseline and holdout lock
        env:
          EXPECTED_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
          EXPECTED_ROW_COUNT: '32300'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath='artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json';
          const report=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const benchmark=report.benchmark;
          const manifest=report.experiment_manifest;
          const logistic=benchmark?.models?.LOGISTIC_REGRESSION;
          const logisticCv=report.training?.logistic_baseline_temporal_cv;
          const models=benchmark?.models??{};
          const holdout=benchmark?.holdout_access;
          const failures=[];
          if(report.integrity?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) failures.push('FIXED_COHORT_SHA_MISMATCH');
          if(Number(report.integrity?.row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) failures.push('FIXED_COHORT_ROW_COUNT_MISMATCH');
          if(report.integrity?.model_source_commit_sha!==process.env.GITHUB_SHA) failures.push('MODEL_SOURCE_SHA_MISMATCH');
          if(manifest?.schema!=='RADARX_BUILD224_NEURAL_CLOSURE_EXPERIMENT_MANIFEST_V1') failures.push('EXPERIMENT_MANIFEST_MISSING_OR_INVALID');
          if(manifest?.code_commit_sha!==process.env.GITHUB_SHA) failures.push('MANIFEST_CODE_SHA_MISMATCH');
          if(manifest?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) failures.push('MANIFEST_DATASET_SHA_MISMATCH');
          if(Number(manifest?.dataset_row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) failures.push('MANIFEST_ROW_COUNT_MISMATCH');
          if(logisticCv?.status!=='COMPLETE') failures.push('TUNED_LOGISTIC_CV_INCOMPLETE');
          if(Number(logisticCv?.fold_count)!==5) failures.push('TUNED_LOGISTIC_EXPECTED_FIVE_FOLDS');
          if(logisticCv?.outer_validation_used_for_hyperparameter_selection!==false) failures.push('LOGISTIC_OUTER_VALIDATION_HYPERPARAMETER_LEAKAGE');
          if(logisticCv?.calibration?.outer_validation_used_for_calibrator_fit!==false||
             logisticCv?.calibration?.outer_validation_used_for_calibrator_selection!==false||
             logisticCv?.calibration?.holdout_used_for_calibration!==false) failures.push('LOGISTIC_CALIBRATION_PROVENANCE_INVALID');
          if(!Number.isFinite(logistic?.validation?.raw_brier_score)) failures.push('TUNED_LOGISTIC_RAW_BRIER_MISSING');
          if(holdout?.opened!==false) failures.push('HOLDOUT_WAS_OPENED');
          if(holdout?.opening_protocol?.status!=='LOCKED') failures.push('HOLDOUT_PROTOCOL_NOT_LOCKED');
          if(holdout?.opening_protocol?.passed!==false) failures.push('HOLDOUT_PROTOCOL_UNEXPECTEDLY_APPROVED');
          if((holdout?.opened_for_models??[]).length!==0) failures.push('HOLDOUT_SCORING_MODEL_LIST_NOT_EMPTY');
          if(Number(report.integrity?.holdout_scored_rows)!==0) failures.push('HOLDOUT_PREDICTION_ROWS_NOT_ZERO');
          if(manifest?.holdout?.opened!==false||manifest?.holdout?.metrics_read!==false||
             Number(manifest?.holdout?.rows_included_in_scored_predictions)!==0) failures.push('MANIFEST_HOLDOUT_LOCK_MISMATCH');
          if(Object.values(models).some(model=>model?.holdout?.evaluated===true||
             model?.holdout?.brier_score!==null&&model?.holdout?.brier_score!==undefined||
             model?.holdout?.net_pnl_pct!==null&&model?.holdout?.net_pnl_pct!==undefined)) {
            failures.push('HOLDOUT_METRICS_PRESENT_WHILE_LOCKED');
          }
          const candidateNames=Object.keys(models).filter(name=>name!=='LOGISTIC_REGRESSION');
          const outerPassed=candidateNames.filter(name=>
            models[name]?.validation?.outer_validation_gate?.passed===true);
          const tcn=benchmark?.models?.TCN_LSTM_HYBRID;
          const ablation=report.training?.model_internal_diagnostics?.TCN_LSTM_HYBRID?.score_conditioned_external_ablation??null;
          const bootstrap=report.training?.outer_validation_uncertainty_bootstrap??null;
          const scientificDecision={
            schema:'RADARX_BUILD224_OUTER_VALIDATION_SCIENTIFIC_DECISION_V1',
            status:outerPassed.length
              ?'OUTER_VALIDATION_GATES_PASSED_HOLDOUT_STILL_LOCKED'
              :'NEURAL_SUPERIORITY_NOT_PROVEN_HOLDOUT_LOCKED',
            code_commit_sha:report.integrity?.model_source_commit_sha??null,
            dataset_sha256:report.integrity?.dataset_sha256??null,
            row_count:report.integrity?.row_count??null,
            logistic_baseline:{
              raw_brier:logistic?.validation?.raw_brier_score??null,
              calibrated_brier:logistic?.validation?.calibrated_brier_score??null,
              cv_status:logisticCv?.status??null,
              folds:logisticCv?.fold_count??0,
              selected_configuration:logisticCv?.selected_configuration??null,
              calibration_method:logisticCv?.calibration?.selected_method??null
            },
            outer_validation_passed_candidates:outerPassed,
            tcn_lstm:{
              raw_brier:tcn?.validation?.raw_brier_score??null,
              calibrated_brier:tcn?.validation?.calibrated_brier_score??null,
              outer_validation_gate:tcn?.validation?.outer_validation_gate??null
            },
            score_conditioned_vs_pooled_only_ablation:ablation,
            uncertainty_bootstrap:bootstrap,
            holdout:{
              status:'LOCKED',
              opened:false,
              scored_rows:0,
              metrics_read:false,
              missing_protocol_checks:holdout?.opening_protocol?.missing_checks??[]
            },
            failures
          };
          fs.writeFileSync('artifacts/neural-closure-replay/scientific-decision.json',
            JSON.stringify(scientificDecision,null,2)+'\\n');
          console.log(JSON.stringify(scientificDecision,null,2));
          if(failures.length) process.exitCode=1;
          NODE
      - name: Upload fixed-cohort rebenchmark report and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-neural-closure-replay-${{ github.sha }}
          path: artifacts/neural-closure-replay/
          if-no-files-found: ignore
          retention-days: 30
