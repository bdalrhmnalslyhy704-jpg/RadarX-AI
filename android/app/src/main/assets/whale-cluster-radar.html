<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131c"><title>RadarX — تجمع الحيتان</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123b4d,#061018 48%,#03080d);color:#e9fbff;font-family:Arial,sans-serif}main{max-width:980px;margin:auto;padding:18px}.hero{border:1px solid #245d72;border-radius:24px;padding:22px;background:linear-gradient(145deg,#0c2734,#07121b);box-shadow:0 15px 50px #0008}.icon{font-size:42px}.title{font-size:26px;font-weight:1000}.sub{color:#8db4c1;line-height:1.8;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;background:#32c9ef;color:#031018}button.stop{background:#17303c;color:#d9f8ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{padding:13px;border:1px solid #194557;border-radius:16px;background:#081923}.metric b{display:block;font-size:20px}.metric small{color:#7fa4b0}.card{margin-top:14px;border:1px solid #194557;border-radius:18px;padding:15px;background:#071721}.row{border-top:1px solid #173845;padding:14px 0}.row:first-child{border-top:0}.sym{font-size:18px;font-weight:1000}.score{float:left;color:#56e5ff;font-weight:1000}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{padding:5px 8px;border-radius:8px;background:#102a36;color:#a8dbe8;font-size:11px}.good{color:#62e7ad}.bad{color:#ff8c8c}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:22px}}</style></head><body><main><section class="hero"><div class="icon">🐋</div><div class="title">تجمع الحيتان</div><div class="sub">ماسح سيولة متقدم يبحث عن <b>تجمع شراء محتمل</b> عبر دفتر الأوامر + امتصاص البيع + Taker Flow + تسارع الحجم والصفقات. لا يدّعي معرفة هوية الحوت؛ يثبت فقط وجود بصمة سوقية قابلة للقياس.</div><div class="actions"><button id="scan">فحص السوق الآن</button><button id="start" class="stop">تشغيل الرادار</button></div></section><div class="grid"><div class="metric"><b id="u">—</b><small>مرشح مفحوص</small></div><div class="metric"><b id="a">—</b><small>تجمع محتمل</small></div><div class="metric"><b id="w">—</b><small>مراقبة</small></div><div class="metric"><b id="s">—</b><small>آخر فحص</small></div></div><section class="card"><h3>تقرير السوق</h3><div id="report">جاري تحميل البيانات…</div></section></main><script type="module">
import {getWhaleClusterRadar,setRadarState} from './radarx-backend-client.mjs';
var report=document.getElementById('report'),u=document.getElementById('u'),a=document.getElementById('a'),w=document.getElementById('w'),s=document.getElementById('s');
function esc(v){return String(v==null?'—':v).replace(/[&<>"]/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[x]})}
function render(x){var c=Array.isArray(x.candidates)?x.candidates:[],acc=c.filter(function(v){return v.signal==='WHALE_ACCUMULATION'}),watch=c.filter(function(v){return v.signal==='WHALE_WATCH'});u.textContent=c.length;a.textContent=acc.length;w.textContent=watch.length;s.textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});if(!c.length){report.innerHTML='<div class="bad">لم تظهر بصمة تجمع مؤهلة في هذه الدورة. هذا أفضل من اختراع نتيجة.</div>';return}report.innerHTML=c.map(function(v){var r=v.whale_report||{},risk=(v.risk_flags||[]).join(' • ')||'لا توجد رايات خطر';return '<div class="row"><span class="sym">'+esc(v.symbol)+'</span><span class="score">'+esc(v.opportunity_score)+'/100</span><div class="tags"><span class="tag">'+esc(v.signal)+'</span><span class="tag">Bid '+esc(r.depth_imbalance)+'</span><span class="tag">Taker '+esc(r.taker_buy_ratio)+'</span><span class="tag">1m Vol ×'+esc(r.volume_ratio_1m)+'</span><span class="tag">Trades ×'+esc(r.trade_count_ratio)+'</span><span class="tag">Spread '+esc(r.spread_bps)+'bps</span></div><div class="sub">Bid wall '+esc(r.bid_wall_share)+'% • Ask wall '+esc(r.ask_wall_share)+'% • امتصاص '+esc(r.absorption_score)+' • تراكم '+esc(r.accumulation_score)+' • حركة 1m '+esc(r.one_minute_move_pct)+'%</div><div class="'+(risk==='لا توجد رايات خطر'?'good':'bad')+'">المخاطر: '+esc(risk)+'</div></div>'}).join('')}
async function scan(){report.innerHTML='يفحص السوق…';try{render(await getWhaleClusterRadar({limit:30,scan:true}))}catch(e){report.innerHTML='<div class="bad">تعذر الفحص: '+esc(e.message)+'</div>'}}
document.getElementById('scan').onclick=scan;
document.getElementById('start').onclick=async function(){try{await setRadarState('WHALE_CLUSTER_RADAR','start');this.textContent='الرادار يعمل';scan()}catch(e){report.innerHTML='<div class="bad">'+esc(e.message)+'</div>'}};
scan();
</script></body></html>
