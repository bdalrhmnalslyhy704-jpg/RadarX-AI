name: RadarX Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact release-signing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: f1db315053d15b0e2549aa97946e415a4a424384

      - name: Verify Build 224 + Falcon Eye source
        shell: bash
        run: |
          set -euo pipefail
          set -x
          test "$(git rev-parse HEAD)" = "f1db315053d15b0e2549aa97946e415a4a424384"
          grep -Fq 'versionCode 27' android/app/build.gradle
          grep -Fq 'versionName "1.6.1"' android/app/build.gradle
          test -s android/app/src/main/assets/falcon-eye-radar.html
          test -s android/app/src/main/assets/radarx-supreme-fusion.mjs
          grep -Fq 'falcon-eye-radar.html' android/app/src/main/assets/index.html
          grep -Fq 'radarx-supreme-fusion.mjs' android/app/src/main/assets/multi-analyst-center.html
          grep -Fq 'ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -Fq 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -Fq 'FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml
          grep -Fq 'RadarXBackgroundMonitorService' android/app/src/main/AndroidManifest.xml
          grep -Fq 'POST_NOTIFICATIONS_MISSING_MONITOR_STILL_STARTED' android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq 'BACKGROUND_AUTO_START_CHECK' android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq 'processServiceRunning' android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          grep -Fq 'BACKGROUND_NETWORK_AVAILABLE' android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          grep -Fq 'BACKGROUND_OFFLINE_WAIT' android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          grep -Fq 'price_at_detection' android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          grep -Fq 'isAllowedBackendUri(request.getUrl())' android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq 'manager.getRunningServices(Integer.MAX_VALUE)' android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          grep -Fq 'export async function getFalconEyeRadar' android/app/src/main/assets/radarx-backend-client.mjs
          grep -Fq "id!=='FALCON_EYE_RADAR'" android/app/src/main/assets/radarx-radar-screen.mjs
          grep -Fq 'RadarX Android 1.6.1' android/EMBEDDED_UI_BUILD.txt
          test -s android/app/src/main/assets/tradli.html
          test -s android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          test -s android/app/src/main/assets/tests/tradli-regression.test.mjs
          grep -Fq 'BACKEND_FALLBACK_ORIGIN' android/app/src/main/java/com/radarx/app/TradliActivity.java
          grep -Fq 'isAllowedBackendUri(Uri.parse(url.toString()))' android/app/src/main/java/com/radarx/app/TradliActivity.java
          grep -Fq 'connection.setReadTimeout(180000)' android/app/src/main/java/com/radarx/app/TradliActivity.java
          grep -Fq 'getSymbolDeepScan' android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          grep -Fq 'getRadarAlerts' android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          grep -Fq 'function renderCandleChart' android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          grep -Fq 'scan.chart?.timeframes?.[timeframe]?.candles' android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          grep -Fq 'chart:{' phase2/core/symbol-deep-analyzer.mjs
          grep -Fq 'TRADLI_ACTIVITY_ON_CREATE' android/app/src/main/java/com/radarx/app/TradliActivity.java
          grep -Fq 'TRADLI_OPEN_REQUESTED' android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq 'SAVED_DATA_NOT_VALID_FOR_TRADE_REVIEW' android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          grep -Fq 'uiautomator dump /sdcard/radarx-window.xml' android/smoke-test.sh
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='android/app/src/main/assets/';
          const index=fs.readFileSync(base+'index.html','utf8');
          const page=fs.readFileSync(base+'tradli.html','utf8');
          const suite=fs.readFileSync(base+'radarx-tradli-feature-suite.mjs','utf8');
          const entries=index+'\n'+page;
          if (/https?:\/\/[^"'\s]*github\.io\/RadarX-AI/i.test(entries)) throw new Error('ANDROID_ENTRY_PAGES_MUST_NOT_DEPEND_ON_GITHUB_PAGES');
          if (!page.includes('paper_trading=true')) throw new Error('TRADLI_PAPER_POLICY_LABEL_MISSING');
          if (!page.includes('real_order_execution=false')) throw new Error('TRADLI_NO_EXECUTION_POLICY_LABEL_MISSING');
          if (!page.includes('NO EXECUTION') && !suite.includes('NO EXECUTION')) throw new Error('TRADLI_ORDER_DESK_MUST_BE_NON_EXECUTING');
          if (!suite.includes('SAVED_DATA_NOT_VALID_FOR_TRADE_REVIEW')) throw new Error('TRADLI_REVIEW_SAFETY_GUARD_MISSING');
          console.log('TRADLI embedded policy and no-Pages checks passed');
          NODE

      - name: Verify Falcon Eye and Supreme Fusion tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n android/smoke-test.sh
          node --check android/app/src/main/assets/radarx-supreme-fusion.mjs
          node --test android/supreme-fusion.test.mjs
          node android/backend-client-regression.mjs
          node --check android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          node --test android/app/src/main/assets/tests/tradli-regression.test.mjs
          node --check phase2/core/falcon-eye-radar.mjs
          node --check phase2/core/radar-notification-gate.mjs
          node --check phase2/core/radar-alert-meta.mjs
          node --check phase2/core/symbol-deep-analyzer.mjs
          node --test phase2/tests/symbol-deep-scan.test.mjs
          node --test phase2/tests/falcon-eye-radar.test.mjs
          node --check phase2/core/store.mjs
          node --test phase2/tests/store.test.mjs
          node --test phase2/tests/falcon-radar-core.test.mjs
          node --test phase2/tests/falcon-market-pulse.test.mjs

      - name: Verify Railway Radar 9 contract
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://radarx-ai-triple-production.up.railway.app"
          HEALTH="$(curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/healthz.json" -w "%{http_code}" "$BASE/healthz")"
          STATUS="$(curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/status.json" -w "%{http_code}" "$BASE/api/radar-status")"
          FALCON="$(curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 -o "$RUNNER_TEMP/falcon.json" -w "%{http_code}" "$BASE/api/falcon-eye-radar?limit=1&scan=1")"
          test "$HEALTH" = "200"
          test "$STATUS" = "200"
          test "$FALCON" = "200"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/status.json','utf8'));
          const f=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/falcon.json','utf8'));
          const e=(s.radars||[]).find(x=>x.radar==='FALCON_EYE_RADAR');
          if(!e) throw new Error('FALCON_EYE_NOT_REGISTERED');
          if(e.running!==true || f.monitoring?.running!==true) throw new Error('FALCON_EYE_NOT_RUNNING');
          if(f.radar!=='FALCON_EYE_RADAR') throw new Error('FALCON_EYE_ENDPOINT_INVALID');
          if(f.radar_name!=='Radar 9 — عين الصقر') throw new Error('FALCON_EYE_NAME_INVALID');
          if(f.meta?.paper_trading!==true || f.meta?.real_order_execution!==false || f.meta?.confidence_score!=='UNKNOWN') throw new Error('FALCON_EYE_POLICY_INVALID');
          if(f.meta?.closed_candles_only!==true) throw new Error('FALCON_EYE_CLOSED_CANDLE_INVALID');
          if(!Array.isArray(f.candidates)) throw new Error('FALCON_EYE_CANDIDATES_INVALID');
          if(!Number.isFinite(Number(f.monitoring?.universe)) || Number(f.monitoring.universe)<1) throw new Error('FALCON_EYE_UNIVERSE_EMPTY');
          if(!Number.isFinite(Number(f.monitoring?.last_scan_at))) throw new Error('FALCON_EYE_SCAN_NOT_COMPLETED');
          if(String(f.monitoring?.last_error||'').includes('this.clock is not a function')) throw new Error('FALCON_EYE_CLOCK_REGRESSION');
          console.log(JSON.stringify({radar:f.radar,running:e.running,universe:f.monitoring.universe,last_scan_at:f.monitoring.last_scan_at,scans:f.monitoring.scans,candidates:f.candidates.length,alerts:Array.isArray(f.alerts)?f.alerts.length:0},null,2));
          NODE
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android command-line tools 16.0
        timeout-minutes: 8
        env:
          ANDROID_CMDLINE_TOOLS_ZIP: commandlinetools-linux-12266719_latest.zip
          ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/radarx-android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120             "$ANDROID_CMDLINE_TOOLS_URL"             --output "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"
          unzip -q "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/16.0"
          test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"
          rm -f "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

      - name: Verify pinned sdkmanager
        timeout-minutes: 2
        run: |
          set -euo pipefail
          command -v sdkmanager
          SDKMANAGER_VERSION="$(sdkmanager --version | head -n 1)"
          echo "sdkmanager version: $SDKMANAGER_VERSION"
          [[ "$SDKMANAGER_VERSION" == 16.0* ]]

      - name: Install Android SDK 35 and build-tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses < <(yes) >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Release signing secrets are present
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in             ANDROID_RELEASE_KEYSTORE_BASE64             ANDROID_RELEASE_STORE_PASSWORD             ANDROID_RELEASE_KEY_ALIAS             ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Materialize signing keystore in runner temp only
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/radarx-release.keystore"
          test -s "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Build signed universal Release APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/radarx-release.keystore
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Verify APK signature, package, and universal output
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          if (( ${#APKS[@]} != 1 )); then
            echo "::error::Expected exactly one Release APK; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}" || true
            exit 1
          fi

          if [[ "${APKS[0]}" != "$APK_DIR/app-release.apk" ]]; then
            echo "::error::Expected the universal Release APK at $APK_DIR/app-release.apk."
            exit 1
          fi

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "${APKS[0]}"

          PACKAGE="$("$AAPT" dump badging "${APKS[0]}" | sed -n "s/^package: name='\\([^']*\\)'.*$/\\1/p" | head -n 1)"
          if [[ "$PACKAGE" != "com.radarx.app" ]]; then
            echo "::error::Unexpected package: $PACKAGE"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/radarx-release"
          cp "${APKS[0]}" "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

          sha256sum "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android Emulator smoke test
        id: android_emulator_smoke
        timeout-minutes: 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: bash android/smoke-test.sh

      - name: Record emulator smoke result
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.android_emulator_smoke.outcome }}
        run: |
          set -euo pipefail
          echo "Android emulator smoke outcome: ${SMOKE_OUTCOME}"
          if [[ "${SMOKE_OUTCOME}" != "success" ]]; then
            echo "::error::Android emulator online/offline/TRADLI smoke did not pass; release publication is blocked."
            exit 1
          fi

      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_EMULATOR_SMOKE_OUTCOME: ${{ steps.android_emulator_smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v1.6.1-tradli-chart-lab-${GITHUB_RUN_NUMBER}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "f1db315053d15b0e2549aa97946e415a4a424384" \
            --title "RadarX Native — Build 224 + TRADLI Intelligence 1.6.1" \
            --notes "Version 1.6.1 is built from the official Build 224 line. TRADLI is a separate native Activity with six integrated modules: Chart Lab, Verify, Advisor, Signals Hub, Supply/Demand, and a paper-only Order Desk. Chart Lab renders backend-provided Binance OHLC candles for 15m/1h/4h, filters open/future candles, and does not claim to AI-analyze uploaded pictures. Connection diagnostics test health, readiness, and the actual market data endpoint. The native smoke locates the visible TRADLI dashboard entry through UI accessibility rather than guessed screen coordinates. The WebView backend proxy is HTTPS allow-listed and GET-only. Order Desk is calculation/copy only; no order or withdrawal execution exists. Spot/Paper/read-only only; paper_trading=true; real_order_execution=false; confidence_score=UNKNOWN. Android online/offline/reconnect/TRADLI emulator smoke outcome: ${ANDROID_EMULATOR_SMOKE_OUTCOME}."

      - name: Verify HTTPS release download
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v1.6.1-tradli-chart-lab-${GITHUB_RUN_NUMBER}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/radarx-release.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" -o "${RUNNER_TEMP}/radarx-release-downloaded.apk"
          test -s "${RUNNER_TEMP}/radarx-release-downloaded.apk"
          test "$(stat -c %s "${RUNNER_TEMP}/radarx-release-downloaded.apk")" = "$(stat -c %s "${RUNNER_TEMP}/radarx-release/radarx-release.apk")"
          test "$(sha256sum "${RUNNER_TEMP}/radarx-release-downloaded.apk" | awk '{print $1}')" = "$(sha256sum "${RUNNER_TEMP}/radarx-release/radarx-release.apk" | awk '{print $1}')"
      - name: Remove signing keystore before artifact upload
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/radarx-release.keystore"
          test ! -e "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Upload verified APK only
        uses: actions/upload-artifact@v4
        with:
          name: radarx-release-apk
          path: ${{ runner.temp }}/radarx-release/radarx-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
