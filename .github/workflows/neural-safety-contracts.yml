name: Build 224 Neural Safety and Directional Objective Tests

on:
  push:
    branches:
      - research/daily-early-riser-mlp-budget-20261113
    paths:
      - 'phase2/core/neural-safety-contracts.mjs'
      - 'phase2/tools/neural-hybrid-oos-matrix.mjs'
      - 'phase2/tests/neural-hybrid-oos-matrix.test.mjs'
      - 'phase2/core/adaptive-trader-engine.mjs'
      - 'phase2/core/daily-early-riser-census.mjs'
      - 'phase2/core/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/core/cognitive-brain.mjs'
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/tools/daily-early-riser-historical-census.mjs'
      - 'phase2/tools/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tests/neural-safety-contracts.test.mjs'
      - '.github/workflows/neural-safety-contracts.yml'

permissions:
  contents: read

concurrency:
  group: build224-neural-safety-contracts
  cancel-in-progress: false

jobs:
  verify-neural-safety:
    name: Verify temporal alignment, hybrid qualification and ranking gradients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check all modified neural paths
        run: |
          node --check phase2/core/neural-safety-contracts.mjs
          node --check phase2/tools/neural-hybrid-oos-matrix.mjs
          node --check phase2/tests/neural-hybrid-oos-matrix.test.mjs
          node --check phase2/core/adaptive-trader-engine.mjs
          node --check phase2/core/daily-early-riser-census.mjs
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/temporal-neural-brain.mjs
          node --check phase2/core/daily-early-riser-neural-benchmark.mjs
          node --check phase2/tools/daily-early-riser-historical-census.mjs
          node --check phase2/tools/daily-early-riser-neural-benchmark.mjs
      - name: Run mathematical safety and model-family regressions
        run: |
          node --test --test-timeout=180000 \
            phase2/tests/neural-safety-contracts.test.mjs \
            phase2/tests/neural-hybrid-oos-matrix.test.mjs \
            phase2/tests/temporal-neural-brain.test.mjs \
            phase2/tests/cognitive-brain.test.mjs \
            phase2/tests/daily-early-riser-neural-benchmark.test.mjs
