name: Build 224 — Capture Locked Out-of-Time Backfill Cohort

on:
  push:
    branches:
      - ops/build224-capture-locked-cohort-20261126
    paths:
      - '.github/workflows/neural-closure-prospective-cohort.yml'
      - 'phase2/core/neural-closure-data-builder.mjs'
      - 'phase2/core/neural-closure-universe.mjs'
      - 'phase2/core/neural-closure-contracts.mjs'
      - 'phase2/core/neural-closure-secure-bundle.mjs'
      - 'phase2/tools/build-neural-closure-dataset.mjs'
      - 'phase2/tools/secure-prospective-cohort-bundle.mjs'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Maximum currently trading Binance Spot USDT candidates (10–500); historical liquidity determines event eligibility; hard cap fails closed"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

# Push-based capture is enabled only on this isolated ops branch and only for an explicit marker commit.
concurrency:
  group: build224-prospective-neural-cohort
  cancel-in-progress: false

jobs:
  capture:
    name: Capture a retrospective out-of-time, locked, unscored cohort
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[CAPTURE-LOCKED-COHORT]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      # Retrospective backfill starts after the last resolved legacy event; it is not live-forward data.
  # Last closed 15m feature candle in the legacy 32,300-row cohort opened
      # at 2026-11-17T16:00:00Z and closed at 16:14:59.999Z.
      LEGACY_LAST_DECISION_AT: "2026-11-17T16:14:59.999Z"
      LEGACY_LAST_LABEL_RESOLVED_AT: "2026-11-17T20:14:59.999Z"
      PROSPECTIVE_START_AT: "2026-11-18T00:14:59.999Z"
      EXPECTED_LEGACY_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify prospective scheduler, collector and encryption contracts
        run: |
          node --check phase2/core/neural-closure-data-builder.mjs
          node --check phase2/tools/build-neural-closure-dataset.mjs
          node --check phase2/core/neural-closure-secure-bundle.mjs
          node --check phase2/tools/secure-prospective-cohort-bundle.mjs
          node --test phase2/tests/neural-closure-data-builder.test.mjs
          node --test phase2/tests/neural-closure-secure-bundle.test.mjs

      - name: Verify locked cohort encryption key is configured
        env:
          RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX: ${{ secrets.RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX }}
        run: |
          if [[ ! "${RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX:-}" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::Set repository secret RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX to a 32-byte random hex key before collection."
            exit 1
          fi
          echo "AES-256-GCM key format verified; secret value was not printed."

      - name: Capture real Binance Spot candles after the legacy cohort boundary
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols || '500' }}
        run: |
          set -euo pipefail
          test "$(date -u -d "$PROSPECTIVE_START_AT" +%s)" -gt "$(date -u -d "$LEGACY_LAST_LABEL_RESOLVED_AT" +%s)"
          mkdir -p artifacts/neural-closure-prospective
          node --expose-gc --max-old-space-size=3072 phase2/tools/build-neural-closure-dataset.mjs \
            --prospectiveOnly true \
            --startAt "$PROSPECTIVE_START_AT" \
            --maxSymbols "$MAX_SYMBOLS" \
            --minSymbols 20 \
            --minQuoteVolumeUsdt 750000 \
            --output artifacts/neural-closure-prospective/cohort.json \
            --archiveDir artifacts/neural-closure-prospective/raw

      - name: Verify cohort identity, lock state, maturity and hashes
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {sha256CanonicalArrayMapped} from './phase2/core/neural-closure-contracts.mjs';
          import {verifyProspectiveCohortRowCoverage} from './phase2/core/neural-closure-universe.mjs';

          const path='artifacts/neural-closure-prospective/cohort.json';
          const cohort=JSON.parse(fs.readFileSync(path,'utf8'));
          const legacyLast=Date.parse(process.env.LEGACY_LAST_DECISION_AT);
          const legacyLastLabelResolved=Date.parse(process.env.LEGACY_LAST_LABEL_RESOLVED_AT);
          const expectedStart=Date.parse(process.env.PROSPECTIVE_START_AT);
          const rows=cohort.rows;
          const failures=[];
          if(cohort.schema!=='RADARX_BUILD224_BINANCE_SPOT_4H_FIRST_TOUCH_PROSPECTIVE_COHORT_V1')
            failures.push('PROSPECTIVE_COHORT_SCHEMA_INVALID');
          if(cohort.source_commit_sha!==process.env.EXPECTED_SOURCE_SHA)
            failures.push('SOURCE_SHA_MISMATCH');
          if(cohort.cohort_contract?.status!=='LOCKED_UNSCORED')
            failures.push('COHORT_NOT_LOCKED');
          if(cohort.cohort_contract?.role!=='RETROSPECTIVE_OUT_OF_TIME_BACKFILL_ONLY'||
             cohort.cohort_contract?.collection_mode!==
               'BINANCE_PUBLIC_HISTORICAL_BACKFILL_AFTER_LEGACY_LABEL_PURGE'||
             cohort.cohort_contract?.real_time_forward_observation!==false||
             cohort.cohort_contract?.live_forward_validation!==false)
            failures.push('OUT_OF_TIME_BACKFILL_MODE_OR_LIVE_FORWARD_CLAIM_INVALID');
          if(cohort.cohort_contract?.training_allowed!==false||
             cohort.cohort_contract?.model_selection_allowed!==false||
             cohort.cohort_contract?.calibration_allowed!==false||
             cohort.cohort_contract?.model_scoring_allowed!==false||
             cohort.cohort_contract?.execution_allowed!==false)
            failures.push('LOCK_POLICY_MISMATCH');
          if(cohort.cohort_contract?.legacy_cohort?.dataset_sha256!==
             process.env.EXPECTED_LEGACY_DATASET_SHA256)
            failures.push('LEGACY_COHORT_IDENTITY_MISMATCH');
          if(cohort.cohort_contract?.legacy_cohort?.last_decision_at!==legacyLast||
             cohort.cohort_contract?.legacy_cohort?.last_label_resolved_at!==legacyLastLabelResolved)
            failures.push('LEGACY_CUTOFF_OR_LABEL_MATURITY_MISMATCH');
          if(cohort.universe?.all_eligible_candidates_included!==true||
             cohort.universe?.eligible_candidate_count!==cohort.universe?.selected_candidate_count||
             cohort.universe?.symbols?.length!==cohort.universe?.eligible_candidate_count||
             cohort.universe?.hard_cap_failure_mode!=='FAIL_CLOSED_NO_TOP_N_TRUNCATION')
            failures.push('ELIGIBLE_USDT_UNIVERSE_NOT_FULLY_CAPTURED');
          const candidatePrefilter=cohort.universe?.candidate_prefilter;
          if(cohort.universe?.selection!==
               'ALL_CURRENTLY_TRADING_BINANCE_SPOT_USDT_PAIRS_WITH_POINT_IN_TIME_HISTORICAL_24H_EVENT_GATE_V3'||
             candidatePrefilter?.method!=='CURRENT_EXCHANGE_INFO_SPOT_TRADING_USDT_STATUS_ONLY'||
             candidatePrefilter?.current_24h_ticker_used_for_eligibility!==false||
             candidatePrefilter?.current_24h_ticker_used_for_ordering!==false||
             candidatePrefilter?.current_24h_ticker_volume_is_diagnostic_only!==true)
            failures.push('CURRENT_TICKER_UNIVERSE_LOOKAHEAD_NOT_REMOVED');
          const captureAudit=cohort.universe?.capture_audit;
          const selectedSymbols=(cohort.universe?.symbols??[]).map(item=>item.symbol).sort();
          const includedSymbols=(captureAudit?.included_symbols??[]).slice().sort();
          const symbolResults=cohort.universe?.symbol_results??[];
          if(captureAudit?.schema!=='PROSPECTIVE_UNIVERSE_CAPTURE_AUDIT_V1'||
             captureAudit?.status!=='COMPLETE'||
             captureAudit?.all_eligible_symbols_have_rows!==true||
             captureAudit?.eligible_candidate_count!==cohort.universe?.eligible_candidate_count||
             captureAudit?.selected_candidate_count!==cohort.universe?.selected_candidate_count||
             captureAudit?.included_symbol_count!==cohort.universe?.eligible_candidate_count||
             captureAudit?.rejected_symbol_count!==0||
             JSON.stringify(selectedSymbols)!==JSON.stringify(includedSymbols)||
             symbolResults.length!==cohort.universe?.eligible_candidate_count||
             symbolResults.some(item=>item.status!=='INCLUDED'))
            failures.push('PROSPECTIVE_CANDIDATE_CAPTURE_INCOMPLETE');
          try{
            const rowCoverageAudit=verifyProspectiveCohortRowCoverage({
              selectedSymbols,symbolResults,rows,counts:cohort.counts,
              schedule:cohort.schedule
            });
            if(rowCoverageAudit.schema!=='PROSPECTIVE_COHORT_ROW_COVERAGE_AUDIT_V4'||
               rowCoverageAudit.status!=='VERIFIED'||
               rowCoverageAudit.symbols_verified!==cohort.universe?.eligible_candidate_count||
               rowCoverageAudit.rows_verified!==rows.length||
               rowCoverageAudit.decision_count!==cohort.schedule?.decision_count||
               rowCoverageAudit.per_symbol_event_accounting_matches_schedule!==true||
               rowCoverageAudit.historical_ineligible_event_accounting_matches_schedule!==true||
               rowCoverageAudit.rejection_reason_accounting_matches_schedule!==true||
               rowCoverageAudit.all_event_outcomes_accounted!==true)
              failures.push('PROSPECTIVE_ROW_COVERAGE_AUDIT_INVALID');
          }catch(error){
            failures.push('PROSPECTIVE_ROW_COVERAGE_AUDIT_FAILED:'+String(error?.message||error));
          }
          if(cohort.cohort_contract?.requested_start_at!==expectedStart||
             cohort.schedule?.first_decision_at!==expectedStart||
             !(expectedStart>legacyLastLabelResolved)||
             cohort.cohort_contract?.strictly_after_legacy_label_maturity!==true)
            failures.push('PROSPECTIVE_START_BOUNDARY_MISMATCH');
          if(!Array.isArray(rows)||rows.length<200)
            failures.push('PROSPECTIVE_ROW_SUPPORT_TOO_SMALL');
          if(rows?.some(row=>Number(row.at)<=legacyLast||
             Number(row.at)<expectedStart||
             Number(row.resolved_at)>Number(cohort.created_at_server_time)))
            failures.push('PROSPECTIVE_ROW_TIME_BOUNDARY_OR_MATURITY_INVALID');
          if(cohort.schedule?.last_decision_at+14400000>
             Number(cohort.created_at_server_time))
            failures.push('LAST_DECISION_LABEL_NOT_MATURE');
          if(cohort.partitions!==undefined||cohort.models_expected!==undefined||
             cohort.class_support!==undefined)
            failures.push('TRAINING_OR_EVALUATION_PARTITIONS_MUST_NOT_BE_CREATED');
          if(cohort.label_access?.status!=='LOCKED'||
             cohort.label_access?.outcome_distribution_reported!==false||
             cohort.cohort_contract?.outcome_distribution_reporting_allowed!==false)
            failures.push('LABEL_ACCESS_NOT_LOCKED');
          if(cohort.data_quality?.raw_archive_verification?.verified_count!==
             cohort.data_quality?.raw_archive_files)
            failures.push('RAW_ARCHIVE_VERIFICATION_INCOMPLETE');
          const digest=sha256CanonicalArrayMapped(rows,row=>({
            id:row.id,symbol:row.symbol,at:row.at,resolved_at:row.resolved_at,
            outcome:row.outcome,target:row.target,
            source_audit_sha256:row.source_audit.raw_klines_sha256,
            feature_information_cutoff_at:row.feature_information_cutoff_at,
            features:row.features,temporal_sequence:row.temporal_sequence,
            quote_volume_24h:row.quote_volume_24h,
            historical_liquidity:row.historical_liquidity??null,
            feature_snapshot_sha:row.feature_snapshot_sha??null,
            realized_return_pct:row.realized_return_pct
          }));
          if(digest!==cohort.dataset_sha256)
            failures.push('CANONICAL_DATASET_SHA_MISMATCH');
          if(failures.length)
            throw new Error('PROSPECTIVE_COHORT_VERIFICATION_FAILED:'+failures.join(','));
          console.log(JSON.stringify({
            status:'PROSPECTIVE_COHORT_CAPTURED_LOCKED',
            dataset_sha256:digest,
            rows:rows.length,
            included_symbols:cohort.counts?.included_symbols,
            first_decision_at:cohort.cohort_contract.actual_first_decision_at,
            last_decision_at:cohort.cohort_contract.actual_last_decision_at,
            label_maturity_verified:true,
            training_started:false,
            model_scoring_started:false,
            outer_validation_opened:false,
            holdout_opened:false
          },null,2));
          NODE

      - name: Encrypt the locked cohort and raw candle archives before artifact storage
        env:
          RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX: ${{ secrets.RADARX_PROSPECTIVE_COHORT_ENCRYPTION_KEY_HEX }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/radarx-build224-prospective-cohort.tar.gz"
          encrypted="artifacts/secure/radarx-build224-prospective-cohort-${GITHUB_SHA}.enc"
          mkdir -p artifacts/secure
          tar -czf "$bundle" -C artifacts neural-closure-prospective
          node phase2/tools/secure-prospective-cohort-bundle.mjs encrypt "$bundle" "$encrypted"
          rm -rf artifacts/neural-closure-prospective
          rm -f "$bundle"
          test -s "$encrypted"
          if find artifacts -type f ! -name '*.enc' -print -quit | grep -q .; then
            echo "::error::Plaintext cohort material remains in the artifact staging directory."
            exit 1
          fi
          echo "Only the authenticated encrypted bundle remains eligible for upload."

      - name: Upload encrypted locked prospective cohort bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-prospective-locked-cohort-encrypted-${{ github.sha }}
          path: artifacts/secure/*.enc
          if-no-files-found: error
          retention-days: 90
