name: RadarX Holdout Isolation Gate
on:
  push:
    branches:
      - fix/418-holdout-isolation-20261123
    paths:
      - phase2/core/cognitive-brain.mjs
      - phase2/core/temporal-neural-brain.mjs
      - phase2/tests/cognitive-brain.test.mjs
      - phase2/tests/temporal-neural-brain.test.mjs
      - .github/workflows/holdout-isolation-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radarx-holdout-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  holdout-isolation:
    name: Cognitive and temporal holdout isolation regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/temporal-neural-brain.mjs
          node --check phase2/tests/cognitive-brain.test.mjs
          node --check phase2/tests/temporal-neural-brain.test.mjs
      - name: Cognitive holdout isolation tests
        run: node --test phase2/tests/cognitive-brain.test.mjs
        timeout-minutes: 12
      - name: Temporal holdout isolation tests
        run: node --test phase2/tests/temporal-neural-brain.test.mjs
        timeout-minutes: 18
      - name: Verify fail-closed holdout source guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cognitive=fs.readFileSync('phase2/core/cognitive-brain.mjs','utf8');
          const temporal=fs.readFileSync('phase2/core/temporal-neural-brain.mjs','utf8');
          const guards=[
            [!cognitive.includes('const neuralHoldout=neuralFit&&'), 'cognitive challengers are not scored on Holdout before validation winner selection'],
            [cognitive.indexOf('const upEventHoldout=asUpEventRows(holdout)')>
              cognitive.indexOf('const validationWinner=validationQualified[0]||null;'),
              'cognitive Holdout labels are not derived until after one Validation winner exists'],
            [cognitive.includes('NO_VALIDATION_QUALIFIED_MODEL_HOLDOUT_REMAINS_CLOSED'), 'cognitive Holdout stays closed when no model qualifies on Validation'],
            [temporal.includes('const validationFamilyWinner=validationFamilyCandidates[0]||null;'), 'one temporal model family is frozen from Validation before Holdout'],
            [temporal.includes("holdoutFamilySelected==='TCN'&&"), 'TCN Holdout is scored only when TCN wins the per-regime validation-family selection'],
            [temporal.includes("holdoutFamilySelected==='TEMPORAL_GBDT'&&"), 'Temporal GBDT Holdout is scored only when it wins the per-regime validation-family selection'],
            [!temporal.includes("if(holdTargets.positive<minRegimePositive)"), 'Holdout class balance is not used to decide regime support'],
            [temporal.includes('positive:null,negative:null,evaluated:false'), 'Holdout class counts remain hidden before a Validation winner exists'],
            [temporal.includes('const tcnHoldoutRegimes=regimes.filter'), 'TCN aggregate includes only regimes where TCN won Validation'],
            [temporal.includes('const temporalTreeHoldoutRegimes=regimes.filter'), 'tree aggregate includes only regimes where Temporal GBDT won Validation'],
            [temporal.includes('NO_VALIDATION_FAMILY_WINNER_HOLDOUT_REMAINS_CLOSED'), 'Holdout explicitly stays closed when no temporal family qualifies']
          ];
          for(const [ok,label] of guards){
            console.log((ok?'PASS ':'FAIL ')+label);
            if(!ok)process.exitCode=1;
          }
          NODE