name: RadarX Android Native 6.5.1

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "index.html"
      - "radarx-runtime-6.0.js"
      - "radarx-background-client.js"
      - "radarx-pulse-fusion.js"
      - "RadarX_Ultimate_5.11.js"
      - "RadarX_ProEngine_5.11.js"
      - "radarx-live-chart.js"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/radarx-android.yml"

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable CI signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radarx-ci-signing-v1-${{ runner.os }}

      - name: Ensure stable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -J-Djava.security.egd=file:/dev/./urandom -keystore "$HOME/.android/debug.keystore" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build native debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build native signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK integrity, signature and original web core
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          echo "Checking bundled RadarX web core..."
          unzip -l "$APK" | grep -F "assets/index.html"
          unzip -l "$APK" | grep -F "assets/RadarX_Ultimate_5.11.js"
          unzip -l "$APK" | grep -F "assets/RadarX_ProEngine_5.11.js"
          unzip -l "$APK" | grep -F "assets/radarx-live-chart.js"
          unzip -l "$APK" | grep -F "assets/radarx-pulse-fusion.js"
          unzip -l "$APK" | grep -F "assets/radarx-runtime-6.0.js"
          unzip -l "$APK" | grep -F "assets/radarx-background-client.js"

      - name: Inspect native package
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "classes(2)?\.dex|AndroidManifest.xml|assets/(index\.html|RadarX_Ultimate_5\.11\.js)"
          echo "RadarX 6.5.1 full-core release package assembled successfully."

      - name: Prepare installable APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/RadarX-6.5.1-Native.apk
          sha256sum dist/RadarX-6.5.1-Native.apk

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.5.1-Native-Android-APK
          path: dist/RadarX-6.5.1-Native.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.5.1-Debug-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v6.5.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist/RadarX-6.5.1-Native.apk" --repo "${GITHUB_REPOSITORY}" --title "RadarX 6.5.1 Native — Binance Secure Relay" --notes "RadarX 6.5.1: full original RadarX web UI and analysis engines bundled inside the Native APK. The native shell is a thin host; the original web core remains intact and ready for incremental native data integration, plus native Binance REST failover. Built from commit ${GITHUB_SHA}." --latest
