name: RadarX Android One-Time Build

on:
  push:
    branches:
      - apk-build-c75aaf79150cedec

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: c75aaf79150cedec0a44c8a309f3d454cd6e6064
  BACKEND_BASE_URL: https://radarx-ai-production.up.railway.app

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Android source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android/backend client regression tests
        run: node android/backend-client-regression.mjs

      - name: Market Radar integration tests
        run: node --test android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Assert required Android contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "https://radarx-ai-production.up.railway.app" android/app/src/main/java/com/radarx/app/MainActivity.java
          grep -Fq "https://radarx-ai-production.up.railway.app" android/app/src/main/assets/radarx-backend-client.mjs
          grep -Fq "'/api/market-radar?quote=' + encodeURIComponent(safeQuote) + '&limit=' + encodeURIComponent(String(safeLimit))" android/app/src/main/assets/radarx-backend-client.mjs
          for state in LIVE_DATA PARTIAL_DATA DATA_STALE DATA_UNAVAILABLE RETRY FETCHING; do
            grep -Fq "$state" android/app/src/main/assets/radarx-market-radar-screen.mjs
          done
          grep -Fq "OFFLINE" android/app/src/main/assets/radarx-market-radar-screen.mjs
          ! grep -RIn --exclude-dir=build -E 'github\.io/RadarX-AI|binance\.com|binance\.com/' android/app/src/main
          grep -RIn -E 'paper_trading=true' android/app/src/main/assets
          grep -RIn -E 'real_order_execution=false' android/app/src/main/assets
          grep -RIn -E 'confidence_score.*UNKNOWN' android/app/src/main/assets

      - name: Backend external endpoint smoke from runner
        shell: bash
        run: |
          set -euo pipefail
          base="${BACKEND_BASE_URL}"
          health=$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/healthz.json -w "%{http_code}" "${base}/healthz")
          ready=$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/readyz.json -w "%{http_code}" "${base}/readyz")
          radar=$(curl --silent --show-error --retry 2 --max-time 40 -o /tmp/market-radar.json -w "%{http_code}" "${base}/api/market-radar?quote=USDT&limit=20")
          signal=$(curl --silent --show-error --retry 2 --max-time 30 -o /tmp/signal.json -w "%{http_code}" "${base}/api/signal?symbol=BTCUSDT")
          echo "healthz=$health readyz=$ready radar=$radar signal=$signal"
          if [ "$signal" = "404" ]; then echo "API_CONTRACT_MISMATCH: /api/signal is not exposed by the deployed Phase 2 backend."; fi
          cat /tmp/healthz.json
          cat /tmp/readyz.json
          cat /tmp/market-radar.json
          cat /tmp/signal.json
          test "$health" = "200"
          case "$ready" in 200|503) ;; *) exit 1 ;; esac
          test "$radar" = "200" -o "$radar" = "503"
          case "$signal" in 200|404) ;; *) exit 1 ;; esac

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "package: name=|application-label:"
          "$BT/apksigner" verify --verbose "$APK"

      - name: Stage APK for emulator
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/RadarX-c75aaf.apk"
          test -s "$RUNNER_TEMP/RadarX-c75aaf.apk"
          echo "STAGED_APK=$RUNNER_TEMP/RadarX-c75aaf.apk"
          stat -c "STAGED_APK_SIZE_BYTES=%s" "$RUNNER_TEMP/RadarX-c75aaf.apk"

      - name: Upload APK for emulator
        uses: actions/upload-artifact@v4
        with:
          name: radarx-apk-for-emulator
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Android emulator Market Radar online/offline smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            set -eu
            mkdir -p "$HOME/radarx-emulator-apk"
            gh run download "$GITHUB_RUN_ID" --name radarx-apk-for-emulator --dir "$HOME/radarx-emulator-apk"
            APK="$HOME/radarx-emulator-apk/app-release.apk"
            test -s "$APK"
            echo "DEVICE_APK=$APK"
            ls -lh "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.radarx.app || true
            adb shell am start -n com.radarx.app/.MainActivity >/dev/null

            cat > /tmp/EndpointProbe.java <<'JAVA'
            import java.io.*;
            import java.net.*;
            import javax.net.ssl.HttpsURLConnection;
            public class EndpointProbe {
              static void probe(String path) throws Exception {
                URL u = new URL("https://radarx-ai-production.up.railway.app" + path);
                HttpsURLConnection c = (HttpsURLConnection) u.openConnection();
                c.setRequestMethod("GET");
                c.setConnectTimeout(10000);
                c.setReadTimeout(30000);
                int s = c.getResponseCode();
                InputStream in = s >= 400 ? c.getErrorStream() : c.getInputStream();
                ByteArrayOutputStream out = new ByteArrayOutputStream();
                if (in != null) { byte[] b = new byte[8192]; int n; while ((n=in.read(b))!=-1) out.write(b,0,n); }
                String body = new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8);
                System.out.println("DEVICE_HTTP path=" + path + " status=" + s);
                System.out.println("DEVICE_JSON path=" + path + " body=" + body);
                if (path.startsWith("/api/market-radar")) {
                  try {
                    org.json.JSONObject root = new org.json.JSONObject(body);
                    org.json.JSONArray candidates = root.optJSONArray("candidates");
                    if (candidates == null) throw new IllegalStateException("candidates missing");
                    int count = candidates.length();
                    int minStrategies = Integer.MAX_VALUE;
                    int maxStrategies = Integer.MIN_VALUE;
                    for (int i = 0; i < count; i++) {
                      org.json.JSONObject candidate = candidates.optJSONObject(i);
                      if (candidate == null) throw new IllegalStateException("candidate[" + i + "] invalid");
                      org.json.JSONArray strategies = candidate.optJSONArray("strategies");
                      int n = strategies == null ? 0 : strategies.length();
                      minStrategies = Math.min(minStrategies, n);
                      maxStrategies = Math.max(maxStrategies, n);
                      if (n != 10) throw new IllegalStateException("candidate[" + i + "] strategies=" + n);
                    }
                    if (count == 0) { minStrategies = 0; maxStrategies = 0; }
                    System.out.println("DEVICE_MARKET_RADAR_CANDIDATES=" + count);
                    System.out.println("DEVICE_MARKET_RADAR_STRATEGIES_MIN=" + minStrategies);
                    System.out.println("DEVICE_MARKET_RADAR_STRATEGIES_MAX=" + maxStrategies);
                  } catch (Exception jsonError) {
                    System.out.println("DEVICE_MARKET_RADAR_CONTRACT_ERROR=" + jsonError.getMessage());
                    throw jsonError;
                  }
                }
                c.disconnect();
              }
              public static void main(String[] args) throws Exception { for (String p : args) probe(p); }
            }
            JAVA
            javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-29/android.jar" /tmp/EndpointProbe.java
            jar cf /tmp/endpoint-probe.jar -C /tmp EndpointProbe.class
            adb push /tmp/endpoint-probe.jar /data/local/tmp/endpoint-probe.jar >/dev/null
            CLASSPATH=/data/local/tmp/endpoint-probe.jar adb shell app_process /data/local/tmp EndpointProbe \
              /healthz /readyz '/api/market-radar?quote=USDT&limit=20' '/api/signal?symbol=BTCUSDT' | tee /tmp/device-endpoints.txt

            grep -Fq 'DEVICE_HTTP path=/healthz status=200' /tmp/device-endpoints.txt
            grep -Eq 'DEVICE_HTTP path=/readyz status=(200|503)' /tmp/device-endpoints.txt
            grep -Eq 'DEVICE_HTTP path=/api/market-radar\?quote=USDT&limit=20 status=(200|503)' /tmp/device-endpoints.txt
            grep -Fq 'DEVICE_HTTP path=/api/signal?symbol=BTCUSDT status=404' /tmp/device-endpoints.txt
            grep -Eq 'DEVICE_MARKET_RADAR_CANDIDATES=[1-9][0-9]*' /tmp/device-endpoints.txt
            grep -Fq 'DEVICE_MARKET_RADAR_STRATEGIES_MIN=10' /tmp/device-endpoints.txt
            grep -Fq 'DEVICE_MARKET_RADAR_STRATEGIES_MAX=10' /tmp/device-endpoints.txt

            for i in $(seq 1 12); do
              sleep 2
              LOGS="$(adb logcat -d -s RadarXSmoke:I '*:S' 2>/dev/null || true)"
              printf '%s\n' "$LOGS"
              if printf '%s\n' "$LOGS" | grep -Fq "UI_READY" &&
                 printf '%s\n' "$LOGS" | grep -Fq "BACKEND_CONNECTED" &&
                 printf '%s\n' "$LOGS" | grep -Fq "SCAN_COMPLETE"; then
                break
              fi
            done
            LOGS="$(adb logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
            printf '%s\n' "$LOGS"
            printf '%s\n' "$LOGS" | grep -Fq "UI_READY"
            printf '%s\n' "$LOGS" | grep -Fq "BACKEND_CONNECTED"
            printf '%s\n' "$LOGS" | grep -Fq "SCAN_COMPLETE"
            ! printf '%s\n' "$LOGS" | grep -Fq "ReferenceError"

            adb shell cmd connectivity airplane-mode enable >/dev/null 2>&1 || true
            adb shell settings put global airplane_mode_on 1 >/dev/null 2>&1 || true
            adb shell svc wifi disable >/dev/null 2>&1 || true
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null 2>&1 || true
            sleep 3
            adb logcat -c
            adb shell am force-stop com.radarx.app || true
            adb shell am start -n com.radarx.app/.MainActivity >/dev/null

            for i in $(seq 1 8); do
              sleep 2
              LOGS="$(adb logcat -d -s RadarXSmoke:I '*:S' 2>/dev/null || true)"
              if printf '%s\n' "$LOGS" | grep -Fq "UI_READY" &&
                 printf '%s\n' "$LOGS" | grep -Fq "BACKEND_DISCONNECTED"; then
                break
              fi
            done
            LOGS="$(adb logcat -d -s RadarXSmoke:I RadarXWeb:I '*:S' 2>/dev/null || true)"
            printf '%s\n' "$LOGS"
            printf '%s\n' "$LOGS" | grep -Fq "UI_READY"
            printf '%s\n' "$LOGS" | grep -Fq "BACKEND_DISCONNECTED"
            ! printf '%s\n' "$LOGS" | grep -Fq "ReferenceError"
            echo "Android emulator Market Radar online/offline smoke passed."

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          OUT="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          stat -c "APK_SIZE_BYTES=%s" "$OUT"

      - name: Publish direct HTTPS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.2.0-c75aaf-${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          SHA="${APK}.sha256"
          gh release create "$TAG" "$APK" "$SHA" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "RadarX Android v1.2.0 — source c75aaf — build ${GITHUB_RUN_NUMBER}" \
            --notes "APK built from exact source SHA ${SOURCE_SHA}. Android uses Railway Backend only; no direct Binance connection; paper trading only; real_order_execution=false; confidence_score=UNKNOWN."

      - name: Verify direct APK download
        shell: bash
        run: |
          set -euo pipefail
          TAG="radarx-android-v1.2.0-c75aaf-${GITHUB_RUN_NUMBER}"
          APK="dist/RadarX-Android-v1.2.0-source-c75aaf-build-${GITHUB_RUN_NUMBER}.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output /tmp/radarx-direct.apk
          test "$(stat -c %s /tmp/radarx-direct.apk)" = "$(stat -c %s "$APK")"
          test "$(sha256sum /tmp/radarx-direct.apk | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
          echo "DIRECT_APK_URL=$URL"
