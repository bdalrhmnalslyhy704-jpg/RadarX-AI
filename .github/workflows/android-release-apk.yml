# Coin Hunter + Build 224 release pipeline
name: RadarX Android Release APK

on:
  push:
    branches:
      - android-early-wake-6.8.9
      - phase3-triple-radar
      - android-build224-radar8-v2-20261006
      - phase4-symbol-deep-scan
      - android-icon-6.8.8-release
      - tradli-feature-integration
      - premium-ui-manual-execution-safe
      - background-prebreakout-engine
      - tradli-separate-page-ui
      - tradli-connectivity-native-screen
      - bottom-reversal-radar-page
      - phase6-radar4-independent-microstructure
      - feature-coin-hunter-20261006-android
      - android-whale-intelligence-v2-build224-20261007
      - android-build224-whale-accumulation-v3-20261007
      - android-build224-final-stable-20261007
      - build224-multi-analyst-20261007
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: radarx-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publish only from the official Build 224 branch after its backend and Android checks pass.
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RADARX_BACKEND_BASE_URL: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}

    steps:
      - name: Checkout exact release-signing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Reject obsolete Build 224 branch commits
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          remote_tip="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_tip" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish an APK from obsolete commit $GITHUB_SHA; current branch tip is $remote_tip."
            exit 1
          fi
      - name: Require successful Pre-Move acceptance statuses for this exact commit
        timeout-minutes: 18
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['pre-move-radar-tests', 'pre-move-radar-live-api'];
            const deadline = Date.now() + 17 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100
              });
              const latest = new Map();
              for (const status of data) {
                const previous = latest.get(status.context);
                if (!previous || Date.parse(status.updated_at) > Date.parse(previous.updated_at)) {
                  latest.set(status.context, status);
                }
              }
              const waiting = [];
              for (const name of required) {
                const status = latest.get(name);
                if (!status || status.state === 'pending') {
                  waiting.push(name);
                  continue;
                }
                if (status.state !== 'success') {
                  core.setFailed(`Required live acceptance ${name}=${status.state}; refusing to publish APK. Details: ${status.target_url || 'no run URL'}`);
                  return;
                }
              }
              if (waiting.length === 0) {
                core.info(`Required exact-commit acceptance passed: ${required.join(', ')}`);
                return;
              }
              core.info(`Waiting for exact-commit acceptance status: ${waiting.join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for exact-commit Pre-Move unit and live DHDTech acceptance statuses; refusing to publish APK.');

      - name: Configure Build 224 APK for DHDTech backend
        env:
          RADARX_BACKEND_BASE_URL: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=String(process.env.RADARX_BACKEND_BASE_URL||'').trim();
          if(!raw){
            console.error('::error::Set the GitHub repository variable RADARX_BACKEND_BASE_URL to the deployed DHDTech HTTPS service URL before releasing the APK.');
            process.exit(1);
          }
          let url;
          try { url=new URL(raw); } catch {
            console.error('::error::RADARX_BACKEND_BASE_URL is not a valid URL.');
            process.exit(1);
          }
          if(url.protocol!=='https:'||url.pathname!=='/'||url.username||url.password||url.search||url.hash||/\.up\.railway\.app$/i.test(url.hostname)){
            console.error('::error::RADARX_BACKEND_BASE_URL must be a public DHDTech HTTPS origin with no path, query, credentials, or Railway hostname.');
            process.exit(1);
          }
          const origin=url.origin;
          if(raw!==origin){
            console.error('::error::Set RADARX_BACKEND_BASE_URL to the bare HTTPS origin without a trailing slash.');
            process.exit(1);
          }
          const assetPaths=[
            'android/app/src/main/assets/radarx-backend-client.mjs',
            'android/app/src/main/assets/radarx-backend-client.js'
          ];
          const radar8Path='android/app/src/main/assets/radar8-lightning.html';
          const doomsdayPath='android/app/src/main/assets/radarx-doomsday-radar.mjs';
          for(const path of assetPaths){
            let source=fs.readFileSync(path,'utf8');
            const original=source;
            source=source.replace(/export const DEFAULT_BACKEND_BASE_URL = '[^']+';/,`export const DEFAULT_BACKEND_BASE_URL = '${origin}';`);
            const fallbackStart='export const BACKEND_FALLBACK_URLS = Object.freeze([';
            const fallbackStartIndex=source.indexOf(fallbackStart);
            const fallbackEndIndex=source.indexOf(']);',fallbackStartIndex);
            if(fallbackStartIndex<0||fallbackEndIndex<0){
              console.error('::error::Could not find the expected backend fallback list in '+path);
              process.exit(1);
            }
            source=source.slice(0,fallbackStartIndex)+'export const BACKEND_FALLBACK_URLS = Object.freeze([]);'+source.slice(fallbackEndIndex+3);
            if(source===original||!source.includes(`DEFAULT_BACKEND_BASE_URL = '${origin}'`)||source.includes('railway.app')){
              console.error('::error::Could not safely apply DHDTech backend configuration to '+path);
              process.exit(1);
            }
            fs.writeFileSync(path,source);
          }
          // Keep standalone radar pages on the same verified DHDTech origin.
          let radar8Source=fs.readFileSync(radar8Path,'utf8');
          radar8Source=radar8Source.replace(/const BASES=\[[^\]]*\];/, "const BASES=['"+origin+"'];");
          if(!radar8Source.includes("const BASES=['"+origin+"'];")||/railway\.app/i.test(radar8Source)){
            console.error('::error::Could not safely configure the Radar 8 standalone page for DHDTech.');
            process.exit(1);
          }
          fs.writeFileSync(radar8Path,radar8Source);
          const doomsdaySource=fs.readFileSync(doomsdayPath,'utf8');
          if(!doomsdaySource.includes('const DOOMSDAY_BACKEND=DEFAULT_BACKEND_BASE_URL;')||/railway\.app/i.test(doomsdaySource)){
            console.error('::error::Doomsday must use the shared allowlisted DHDTech backend client.');
            process.exit(1);
          }
          const javaPath='android/app/src/main/java/com/radarx/app/TradliActivity.java';
          let javaSource=fs.readFileSync(javaPath,'utf8');
          const originalJava=javaSource;
          const oldPrimary='private static final String PRIMARY_BACKEND_ORIGIN = "https://dhdtech-url-required.invalid";';
          if(!javaSource.includes(oldPrimary)){
            console.error('::error::TradliActivity.java does not contain the expected DHDTech placeholder.');
            process.exit(1);
          }
          javaSource=javaSource.replace(oldPrimary,`private static final String PRIMARY_BACKEND_ORIGIN = "${origin}";`);
          const oldFallback='private static final String FALLBACK_BACKEND_ORIGIN = "";';
          if(!javaSource.includes(oldFallback)){
            console.error('::error::TradliActivity.java does not contain the expected empty fallback.');
            process.exit(1);
          }
          javaSource=javaSource.replace(oldFallback,'private static final String FALLBACK_BACKEND_ORIGIN = "";');
          if(javaSource===originalJava||!javaSource.includes(`PRIMARY_BACKEND_ORIGIN = "${origin}"`)||!javaSource.includes('FALLBACK_BACKEND_ORIGIN = ""')||javaSource.includes('railway.app')){
            console.error('::error::Could not safely apply the DHDTech origin to TradliActivity.java');
            process.exit(1);
          }
          fs.writeFileSync(javaPath,javaSource);
          const extraJavaPaths=[
            'android/app/src/main/java/com/radarx/app/MainActivity.java',
            'android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java',
            'android/app/src/main/java/com/radarx/app/BottomRadarActivity.java',
            'android/app/src/main/java/com/radarx/app/RadarXPushRegistration.java'
          ];
          for(const path of extraJavaPaths){
            let source=fs.readFileSync(path,'utf8');
            if(path.endsWith('RadarXPushRegistration.java')){
              const placeholder='private static final String BACKEND = "https://dhdtech-url-required.invalid";';
              if(!source.includes(placeholder)){
                console.error('::error::Missing DHDTech placeholder in '+path);
                process.exit(1);
              }
              source=source.replace(placeholder,`private static final String BACKEND = "${origin}";`);
            }else{
              const placeholder='private static final String BACKEND_ORIGIN = "https://dhdtech-url-required.invalid";';
              if(!source.includes(placeholder)){
                console.error('::error::Missing DHDTech placeholder in '+path);
                process.exit(1);
              }
              source=source.replace(placeholder,`private static final String BACKEND_ORIGIN = "${origin}";`);
            }
            if((path.endsWith('MainActivity.java')||path.endsWith('BottomRadarActivity.java'))&&!source.includes('BACKEND_FALLBACK_ORIGIN = "";')){
              console.error('::error::Native WebView activity must have an empty backend fallback: '+path);
              process.exit(1);
            }
            if(path.endsWith('RadarXBackgroundMonitorService.java')&&source.includes('BACKEND_RADAR_ALERTS_FALLBACK')){
              console.error('::error::Background service contains a retired backend fallback.');
              process.exit(1);
            }
            const expectedBackendDeclaration=path.endsWith('RadarXPushRegistration.java')
              ? `BACKEND = "${origin}";`
              : `BACKEND_ORIGIN = "${origin}";`;
            if(!source.includes(expectedBackendDeclaration)||source.includes('railway.app')){
              console.error('::error::Could not safely apply DHDTech backend configuration to '+path);
              process.exit(1);
            }
            fs.writeFileSync(path,source);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,'RADARX_BACKEND_BASE_URL='+origin+String.fromCharCode(10));
          const packagedPaths=[...assetPaths,radar8Path,doomsdayPath,javaPath,...extraJavaPaths];
          const remaining=[];
          for(const path of packagedPaths){
            if(fs.readFileSync(path,'utf8').includes('railway.app'))remaining.push(path);
          }
          if(remaining.length){
            console.error('::error::Railway URLs remain in the packaged Android source: '+remaining.join(', '));
            process.exit(1);
          }
          console.log(JSON.stringify({backend_origin:origin,railway_fallbacks:0,android_files_configured:packagedPaths.length}));
          NODE

      - name: Verify release branch checkout and backend URL
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature-coin-hunter-20261006-android" || test "$GITHUB_REF_NAME" = "android-build224-radar8-v2-20261006" || test "$GITHUB_REF_NAME" = "android-whale-intelligence-v2-build224-20261007" || test "$GITHUB_REF_NAME" = "android-build224-final-stable-20261007" || test "$GITHUB_REF_NAME" = "build224-multi-analyst-20261007"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "$RADARX_BACKEND_BASE_URL" android/app/src/main/assets/radarx-backend-client.mjs
          grep -Fq "$RADARX_BACKEND_BASE_URL" android/app/src/main/assets/radar8-lightning.html
          grep -Fq 'const DOOMSDAY_BACKEND=DEFAULT_BACKEND_BASE_URL;' android/app/src/main/assets/radarx-doomsday-radar.mjs
          if grep -RIn --exclude-dir=build "railway.app" android/app/src/main; then
            echo "::error::Legacy Railway URL found in Build 224 Android source; refusing to release."
            exit 1
          fi
          if grep -RIn --exclude-dir=build "github.io/RadarX-AI" android/app/src/main; then
            echo "::error::Legacy GitHub Pages dependency found in Android source; refusing to release."
            exit 1
          fi
          grep -Fq 'versionCode 15' android/app/build.gradle
          grep -Fq 'versionName "1.4.9"' android/app/build.gradle
          test -s android/app/src/main/assets/falcon-eye-radar.html
          grep -Fq 'falcon-eye-radar.html' android/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android command-line tools 16.0
        timeout-minutes: 8
        env:
          ANDROID_CMDLINE_TOOLS_ZIP: commandlinetools-linux-12266719_latest.zip
          ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/radarx-android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            "$ANDROID_CMDLINE_TOOLS_URL" \
            --output "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

          unzip -q "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/16.0"

          if [[ ! -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            echo "::error::Pinned Android command-line tools 16.0 sdkmanager was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

          rm -f "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

      - name: Verify pinned sdkmanager
        timeout-minutes: 2
        run: |
          set -euo pipefail
          command -v sdkmanager
          SDKMANAGER_VERSION="$(sdkmanager --version | head -n 1)"
          echo "sdkmanager version: $SDKMANAGER_VERSION"
          [[ "$SDKMANAGER_VERSION" == 16.0* ]]

      - name: Install required Android SDK packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses < <(yes) >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

      - name: Provision Firebase Android app configuration (optional fallback)
        timeout-minutes: 2
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "RADARX_FIREBASE_CLIENT_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::Firebase secret is not configured. Building signed Build 224 APK with the existing local-polling notification fallback; native FCM delivery is not enabled."
            exit 0
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const app = config.client?.find(x => x.client_info?.android_client_info?.package_name === 'com.radarx.app');
          if (!config.project_info?.project_id || !app) {
            console.error('::error::Firebase config is missing project_id or the com.radarx.app client.');
            process.exit(1);
          }
          console.log(JSON.stringify({firebase_project_id: config.project_info.project_id, android_package: 'com.radarx.app', config_present: true}));
          console.log("RADARX_FIREBASE_CLIENT_CONFIGURED=true");
          NODE
          echo "RADARX_FIREBASE_CLIENT_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Verify DHDTech backend and Radar 8 public contract
        timeout-minutes: 10
        env:
          RADAR8_JSON: ${{ runner.temp }}/radar8.json
        run: |
          set -euo pipefail
          BASE="$RADARX_BACKEND_BASE_URL"
          # Release workflows may begin before DHDTech has rolled out the just-merged
          # backend commit. Do not exercise the market scanners against an old container.
          INFO_STATUS="000"
          NEW_RUNTIME_CONTRACT=false
          for attempt in $(seq 1 36); do
            INFO_STATUS="$(curl --location --silent --show-error --connect-timeout 8 --max-time 15 -o "$RUNNER_TEMP/deployment-info.json" -w "%{http_code}" "$BASE/api/deployment-info" || true)"
            if [ "$INFO_STATUS" = "200" ] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const info=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/deployment-info.json','utf8'));
            if (info.deployment_contract==='BUILD224_DHDTECH_V1' &&
                typeof info.runtime_environment==='string' && info.runtime_environment.length>0 &&
                typeof info.radar_autostart_enabled==='boolean' &&
                info.staging_live_workers_require_explicit_opt_in===true) process.exit(0);
          } catch {}
          process.exit(1);
          NODE
            then
              NEW_RUNTIME_CONTRACT=true
              break
            fi
            echo "Waiting for DHDTech to roll out the current Build 224 runtime contract (attempt $attempt/36; HTTP ${INFO_STATUS:-unknown})."
            sleep 5
          done
          if [ "$INFO_STATUS" = "200" ] && [ "$NEW_RUNTIME_CONTRACT" != "true" ]; then
            echo "::error::DHDTech is still serving an older container; the current Build 224 runtime contract (runtime_environment/radar_autostart_enabled) did not appear after the rollout window."
            cat "$RUNNER_TEMP/deployment-info.json" || true
            exit 1
          fi
          if [ "$INFO_STATUS" != "200" ]; then
            echo "::warning::Deployment-info returned HTTP $INFO_STATUS; probing root and independent API paths to distinguish stale container from domain/ingress routing."
            for PROBE_PATH in "/" "/healthz" "/api/radar-status" "/api/early-expansion-radar?quote=USDT&limit=1"; do
              SAFE_NAME="$(printf '%s' "$PROBE_PATH" | tr '/?=&' '____' | tr -cd 'A-Za-z0-9_.-' | cut -c1-70)"
              HEADERS_FILE="$RUNNER_TEMP/dhdtech-probe-$SAFE_NAME.headers"
              BODY_FILE="$RUNNER_TEMP/dhdtech-probe-$SAFE_NAME.body"
              PROBE_STATUS="$(curl --location --connect-timeout 8 --max-time 12 --silent --show-error -D "$HEADERS_FILE" -o "$BODY_FILE" -w "%{http_code}" "$BASE$PROBE_PATH" || true)"
              CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); value=$0} END{print value}' "$HEADERS_FILE" 2>/dev/null || true)"
              SERVER_HEADER="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); value=$0} END{print value}' "$HEADERS_FILE" 2>/dev/null || true)"
              BODY_PREVIEW="$(tr '\n\r' '  ' < "$BODY_FILE" 2>/dev/null | cut -c1-180 || true)"
              printf 'DHDTECH_ROUTE_DIAG path=%s status=%s content_type=%s server=%s body=%s\n' "$PROBE_PATH" "$PROBE_STATUS" "$CONTENT_TYPE" "$SERVER_HEADER" "$BODY_PREVIEW"
            done
            echo "::error::DHDTech is not serving the current Build 224 API contract (deployment-info HTTP $INFO_STATUS). Diagnostic route results above identify whether the hostname reaches the Node API."
            cat "$RUNNER_TEMP/deployment-info.json" || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const info=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/deployment-info.json','utf8'));
          if(info.service!=='RADARX_BACKEND'||info.build_version!=='Build 224'||info.deployment_contract!=='BUILD224_DHDTECH_V1') throw new Error('DHDTECH_BUILD224_CONTRACT_INVALID');
          if(info.paper_trading!==true||info.real_order_execution!==false||info.confidence_score!=='UNKNOWN') throw new Error('DHDTECH_READ_ONLY_POLICY_INVALID');
          if(typeof info.runtime_environment!=='string'||!info.runtime_environment||typeof info.radar_autostart_enabled!=='boolean'||info.staging_live_workers_require_explicit_opt_in!==true)
            throw new Error('DHDTECH_BACKEND_DEPLOYMENT_STALE: waiting for the current Build 224 runtime contract did not succeed');
          if(info.radar_autostart_enabled!==true)
            throw new Error('DHDTECH_RADAR_AUTOSTART_DISABLED: enable RADARX_RADARS_AUTOSTART=true on DHDTech only when this is the intended live production runtime; staging remains opt-in');
          console.log(JSON.stringify({service:info.service,build_version:info.build_version,deployment_contract:info.deployment_contract,expected_radars:info.expected_radars,runtime_environment:info.runtime_environment,radar_autostart_enabled:info.radar_autostart_enabled,staging_live_workers_require_explicit_opt_in:info.staging_live_workers_require_explicit_opt_in,push:info.push}));
          NODE
          HEALTH="$(curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/healthz.json" -w "%{http_code}" "$BASE/healthz")"
          READY="$(curl --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 --silent --show-error -o "$RUNNER_TEMP/readyz.json" -w "%{http_code}" "$BASE/readyz")"
          test "$HEALTH" = "200"
          case "$READY" in
            200|503) ;;
            404) echo "::warning::DHDTech returned 404 for /readyz; continuing only to strict live Radar 8 and full-radar API contract checks." ;;
            *) echo "::error::Unexpected readyz status: $READY"; exit 1 ;;
          esac
          export READY_STATUS="$READY"

          # Do not publish an APK while Radar 8 is merely instantiated but has
          # zero market coverage. Give a fresh DHDTech deploy time to complete
          # its first real Spot-USDT scan before validating the contract.
          VERIFIED=false
          for attempt in $(seq 1 18); do
            RADAR8="$(curl --location --connect-timeout 10 --max-time 75 --silent --show-error -o "$RADAR8_JSON" -w "%{http_code}" "$BASE/api/early-expansion-radar?quote=USDT&limit=100&scan=1" || true)"
            if [ "$RADAR8" = "200" ] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync(process.env.RADAR8_JSON, 'utf8'));
          const problems = [];
          if (body.schema_version !== 'RADAR8_V2') problems.push('RADAR8_SCHEMA_VERSION_INVALID');
          if (body.radar !== 'EARLY_EXPANSION_RADAR') problems.push('RADAR8_NAME_INVALID');
          if (body.meta?.live !== true) problems.push('RADAR8_NOT_LIVE');
          if (body.meta?.paper_trading !== true) problems.push('PAPER_TRADING_INVARIANT_FAILED');
          if (body.meta?.real_order_execution !== false) problems.push('REAL_ORDER_EXECUTION_INVARIANT_FAILED');
          if (body.meta?.confidence_score !== 'UNKNOWN') problems.push('CONFIDENCE_SCORE_INVARIANT_FAILED');
          if (body.monitoring?.running !== true) problems.push('RADAR8_MONITOR_NOT_RUNNING');
          for (const key of ['expected_total','received_total','missing_ticker_total','eligible_total','fast_scanned_total','scanned_total','deep_scanned_total','skipped_total','failed_total','coverage_ratio','deep_coverage_ratio']) {
            if (!Object.hasOwn(body.universe ?? {}, key)) problems.push('RADAR8_COVERAGE_FIELD_MISSING:'+key);
          }
          for (const key of ['running','busy','busy_since_at','last_scan_at','last_scan_completed_at','last_scan_duration_ms','scans','failed_total','poll_ms','micro_scan_candidates','micro_concurrency','rotation_reserve','quiet_reserve','deep_candidates','deep_concurrency']) {
            if (!Object.hasOwn(body.monitoring ?? {}, key)) problems.push('RADAR8_MONITORING_FIELD_MISSING:'+key);
          }
          for (const key of ['requested','completed','last_completed_at','error']) {
            if (!Object.hasOwn(body.scan ?? {}, key)) problems.push('RADAR8_SCAN_FIELD_MISSING:'+key);
          }
          if (!(Number(body.universe?.expected_total) > 0)) problems.push('RADAR8_EXPECTED_UNIVERSE_EMPTY');
          if (!(Number(body.universe?.received_total) > 0)) problems.push('RADAR8_RECEIVED_TICKERS_EMPTY');
          if (!(Number(body.universe?.coverage_ratio) >= 0.95)) problems.push('RADAR8_COVERAGE_BELOW_95_PERCENT');
          if (!(Number(body.monitoring?.last_scan_at) > 0)) problems.push('RADAR8_HAS_NOT_COMPLETED_A_SCAN');
          if (body.scan?.requested !== true) problems.push('RADAR8_LIVE_SCAN_NOT_REQUESTED');
          if (body.scan?.completed !== true) problems.push('RADAR8_LIVE_SCAN_NOT_COMPLETED');
          if (!(Number(body.monitoring?.scans) > 0)) problems.push('RADAR8_SUCCESSFUL_SCAN_COUNT_EMPTY');
          if (!(Number(body.monitoring?.last_scan_completed_at) > 0)) problems.push('RADAR8_NO_SUCCESSFUL_SCAN_TIMESTAMP');
          if (Number(body.scan?.last_completed_at) !== Number(body.monitoring?.last_scan_completed_at))
            problems.push('RADAR8_SCAN_COMPLETION_TIMESTAMP_MISMATCH');
          const scanAgeMs = Date.now() - Number(body.monitoring?.last_scan_completed_at);
          if (!Number.isFinite(scanAgeMs) || scanAgeMs < 0 || scanAgeMs > 120000)
            problems.push('RADAR8_LAST_SUCCESSFUL_SCAN_STALE');
          const busySinceMs = Number(body.monitoring?.busy_since_at);
          const activeScanAgeMs = Date.now() - busySinceMs;
          if (body.monitoring?.busy === true && Number.isFinite(busySinceMs) &&
              busySinceMs > 0 && activeScanAgeMs > 150000)
            problems.push('RADAR8_ACTIVE_SCAN_STUCK');
          if (problems.length) {
            console.log('Radar 8 warm-up/integration check not ready:', problems.join(','));
            process.exit(1);
          }
          console.log(JSON.stringify({
            schema_version: body.schema_version,
            radar: body.radar,
            meta_live: body.meta.live,
            meta_paper_trading: body.meta.paper_trading,
            meta_real_order_execution: body.meta.real_order_execution,
            meta_confidence_score: body.meta.confidence_score,
            universe: body.universe,
            monitoring: body.monitoring,
            scan: body.scan,
            readyz_http_status: Number(process.env.READY_STATUS)
          }, null, 2));
          NODE
            then
              VERIFIED=true
              break
            fi
            echo "Radar 8 has not completed a valid market scan yet (attempt $attempt/18; HTTP ${RADAR8:-no response})."
            sleep 5
          done
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Radar 8 did not pass the live market-coverage check; refusing to publish this APK."
            if [ -s "$RADAR8_JSON" ]; then
              node --input-type=module - "$RADAR8_JSON" <<'NODE'
          import fs from 'node:fs';
          try {
            const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            console.log('RADAR8_FAILURE_DIAGNOSTICS '+JSON.stringify({
              schema_version:body.schema_version,radar:body.radar,meta_live:body.meta?.live,
              monitoring:body.monitoring,scan:body.scan,universe:body.universe,error:body.error||null
            }));
          } catch (error) {
            console.log('RADAR8_FAILURE_DIAGNOSTICS_PARSE_ERROR '+String(error?.message||error));
          }
          NODE
            fi
            exit 1
          fi

      - name: Verify all twelve live radar workers on DHDTech
        # 24 bounded polls may take up to 8 minutes (15s request + 5s sleep each).
        # Allow a small margin for process startup/parsing while keeping failure bounded.
        timeout-minutes: 9
        env:
          BASE: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
        run: |
          set -euo pipefail
          READY=false
          # Cold starts can stagger worker initialization. Require all twelve workers
          # to report RUNNING; do not treat registration alone as readiness.
          for attempt in {1..24}; do
            CODE="$(curl --location --silent --show-error --connect-timeout 8 --max-time 15 --output "$RUNNER_TEMP/radar-swarm-status.json" --write-out "%{http_code}" "$BASE/api/radar-swarm-status" || true)"
            if [[ "$CODE" == "200" ]] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/radar-swarm-status.json', 'utf8'));
          const swarm = root.swarm ?? root;
          const radars = Array.isArray(swarm.radars) ? swarm.radars : [];
          const allRunning = radars.length === 12 && radars.every(x => x.running === true && x.status === 'RUNNING');
          const healthy = swarm.expected_count === 12 && swarm.registered_count === 12 &&
            swarm.running_count === 12 && swarm.failed_count === 0 && swarm.missing_count === 0 && allRunning;
          console.log(JSON.stringify({
            status: swarm.status ?? 'unknown',
            expected_count: swarm.expected_count ?? null,
            registered_count: swarm.registered_count ?? null,
            running_count: swarm.running_count ?? null,
            failed_count: swarm.failed_count ?? null,
            missing_count: swarm.missing_count ?? null,
            radar_statuses: radars.map(x => ({id:x.id,status:x.status,running:x.running,last_error:x.last_error??null}))
          }));
          if (!healthy) process.exit(1);
          NODE
            then
              READY=true
              break
            fi
            echo "DHDTech radar swarm not ready on attempt $attempt/24 (HTTP ${CODE:-unknown}); retrying."
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::DHDTech has not demonstrated twelve healthy running radar workers; refusing to publish this APK as fully validated."
            if [[ -s "$RUNNER_TEMP/radar-swarm-status.json" ]]; then cat "$RUNNER_TEMP/radar-swarm-status.json"; fi
            exit 1
          fi

