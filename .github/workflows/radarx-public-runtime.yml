name: RadarX Public Runtime Validation

on:
  push:
    branches:
      - phase3-fix-readiness-signal-freshness
  pull_request:
    branches:
      - phase3-railway-public-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      - name: npm audit critical
        run: npm audit --omit=dev --audit-level=critical
      - name: Syntax check server.mjs
        run: node --check server.mjs
