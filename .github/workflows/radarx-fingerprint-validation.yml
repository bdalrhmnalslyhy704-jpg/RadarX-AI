name: RadarX Pre-Breakout Fingerprint Validation

on:
  push:
    branches:
      - phase5-prebreakout-fingerprint-backend

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: npm test
        run: npm test
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check engine.mjs
          node --check prebreakout-fingerprint.mjs
