name: RadarX Build 224 — Radar 8 Forensic Gate

on:
  push:
    branches:
      - feature/build224-radar8-early-expansion-20261006
  pull_request:

permissions:
  contents: read

jobs:
  radar8-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Build 224 Radar 8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check phase2/core/early-expansion-radar.mjs
          node --check phase2/core/radar-alert-meta.mjs
          node --check phase2/core/store.mjs
          node --check phase2/config.mjs
          node --check phase2/server.mjs
          node --check phase2/http/api.mjs
          node --check phase2/tools/early-expansion-forensic.mjs
          node --check phase2/tests/early-expansion-radar.test.mjs

      - name: Run Radar 8 unit tests
        run: node --test --test-timeout=60000 phase2/tests/early-expansion-radar.test.mjs

      - name: Run full Phase 2 test suite
        run: node phase2/tests/run-tests.mjs phase2

      - name: Run 2026-10-06 forensic replay
        env:
          RADAR8_FORENSIC_THROUGH: "2026-10-06T14:45:00Z"
        run: |
          set -euo pipefail
          mkdir -p reports
          node phase2/tools/early-expansion-forensic.mjs

      - name: Upload forensic report
        uses: actions/upload-artifact@v4
        with:
          name: radar8-forensic-2026-10-06
          path: |
            reports/radar8-forensic-2026-10-06.json
            reports/radar8-forensic-2026-10-06.md
          if-no-files-found: error
          retention-days: 14

      - name: No deployment guard
        run: |
          echo "Radar 8 CI is validation-only."
          echo "No Railway deployment, no Android APK build, and no merge are performed by this workflow."
