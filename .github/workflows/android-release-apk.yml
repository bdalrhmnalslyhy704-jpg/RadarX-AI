            deployment_contract: info.deployment_contract ?? 'unknown',
            provider: info.push?.provider ?? 'unknown',
            provider_config_enabled: info.push?.enabled === true,
            server_fcm_status: label,
            physical_device_delivery_verified: false
          }));
          NODE

      - name: Require live readiness for twelve radars, twenty analysts, and push prerequisites
        # 48 bounded polls can take up to 16 minutes (15s request + 5s sleep each).
        # Preserve strict READY checks while allowing that existing retry budget to finish.
        timeout-minutes: 17
        env:
          BASE: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
        run: |
          set -euo pipefail
          if [[ "${RADARX_FIREBASE_CLIENT_CONFIGURED:-false}" != "true" ]]; then
            echo "::error::Firebase Android client configuration is required before publishing a notification-ready Build 224 APK."
            exit 1
          fi
          if [[ "${RADARX_SERVER_FCM_STATUS:-UNVERIFIED}" != "ENABLED" ]]; then
            echo "::error::DHDTech does not report an enabled FCM provider; refusing to label the APK notification-ready."
            exit 1
          fi
          VERIFIED=false
          # Allow production cold-start cache warmup and initial telemetry cycles to finish.
          # READY still requires all 12 radar cycles, full closed-candle market coverage,
          # an active WebSocket, and fresh complete 19-specialist + final-analyst evidence.
          for attempt in {1..48}; do
            CODE="$(curl --location --silent --show-error --connect-timeout 8 --max-time 15 \
              --output "$RUNNER_TEMP/radar-readiness-audit.json" --write-out "%{http_code}" \
              "$BASE/api/radar-readiness-audit" || true)"
            if [[ "$CODE" == "200" ]] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/radar-readiness-audit.json','utf8'));
          const s=body.summary||{};
          const failures=[];
          if(body.audit!=='RADARX_LIVE_READINESS_AUDIT_V1')failures.push('READINESS_AUDIT_CONTRACT_INVALID');
          if(body.status!=='READY')failures.push('LIVE_READINESS_STATUS_NOT_READY:'+String(body.status||'UNKNOWN'));
          if(s.expected_radars!==12||s.registered_radars!==12||s.running_radars!==12||s.failed_radars!==0)failures.push('RADAR_WORKER_COUNTS_NOT_12_OF_12');
          if(s.radar_role_coverage_ready!==true)failures.push('RADAR_ROLE_COVERAGE_INCOMPLETE');
          if(s.radars_with_stale_cycles!==0||s.radars_without_cycle_telemetry!==0)failures.push('RADAR_CYCLE_HEALTH_NOT_READY');
          if(s.full_market_candle_coverage_ready!==true||s.websocket_live!==true||s.websocket_sync_ready!==true)failures.push('FULL_MARKET_CLOSED_CANDLE_FEED_NOT_READY');
          if(s.analyst_status!=='READY'||s.analyst_worker_running!==true||Number(s.analyst_complete_fresh_assessments)<1||Number(s.analyst_incomplete_fresh_assessments)!==0)failures.push('TWENTY_ANALYST_RUNTIME_NOT_READY');
          if(failures.length){console.log(JSON.stringify({failures,status:body.status,summary:s,readiness_reasons:body.readiness_reasons}));process.exit(1);}
          console.log(JSON.stringify({audit:body.audit,status:body.status,summary:s,
            fresh_complete_analyst_assessments:s.analyst_complete_fresh_assessments,
            policy:body.policy,physical_device_delivery_verified:false},null,2));
          NODE
            then
              VERIFIED=true
              break
            fi
            echo "Live readiness not yet complete (attempt $attempt/48; HTTP ${CODE:-unknown}); retrying."
            sleep 5
          done
          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::DHDTech has not demonstrated 12 healthy radars, current full-market data, complete fresh 20-analyst assessments, and FCM configuration."
            if [[ -s "$RUNNER_TEMP/radar-readiness-audit.json" ]]; then cat "$RUNNER_TEMP/radar-readiness-audit.json"; fi
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Release signing secrets are present
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Materialize signing keystore in runner temp only
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/radarx-release.keystore"
          test -s "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Run Android dashboard release smoke checks
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node android/backend-client-regression.mjs
          node android/background-monitor-regression.mjs
          node android/app/src/main/assets/tests/market-radar-integration.test.mjs
          grep -Fq "$RADARX_BACKEND_BASE_URL" android/app/src/main/assets/radarx-backend-client.mjs
          grep -Fq "$RADARX_BACKEND_BASE_URL" android/app/src/main/assets/radar8-lightning.html
          grep -Fq 'const DOOMSDAY_BACKEND=DEFAULT_BACKEND_BASE_URL;' android/app/src/main/assets/radarx-doomsday-radar.mjs
          if grep -RIn --exclude-dir=build "railway.app" android/app/src/main; then
            echo "::error::Legacy Railway URL found during APK smoke checks."
            exit 1
          fi
          if grep -RIn --exclude-dir=build "github.io/RadarX-AI" android/app/src/main; then
            echo "::error::Legacy GitHub Pages dependency found during APK smoke checks."
            exit 1
          fi
          grep -RInq "Paper Trading" android/app/src/main/assets
          grep -RInq "paper_trading=true" android/app/src/main/assets
          grep -RInq "real_order_execution=false" android/app/src/main/assets
          grep -RInq "confidence_score=UNKNOWN" android/app/src/main/assets

      - name: Validate embedded RadarX JavaScript syntax
        run: |
          set -euo pipefail
          find android/app/src/main/assets -maxdepth 1 -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/assets")
          pattern = re.compile(r"\?\?|\?\.")
          offenders = []
          for path in sorted(list(root.rglob("*.mjs")) + list(root.rglob("*.html"))):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"Asset is not valid UTF-8: {path}: {exc}")
              if pattern.search(text):
                  offenders.append(str(path))
          if offenders:
              for path in offenders:
                  print(f"FORBIDDEN_JS_SYNTAX {path}")
              raise SystemExit("Optional chaining/nullish coalescing found in embedded WebView assets.")
          print("Checked WebView assets for optional chaining/nullish coalescing: none found.")
          PY
          node --check android/app/src/main/assets/tests/market-radar-integration.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          root = Path("android/app/src/main/assets")
          scripts = 0
          for path in sorted(root.glob("*.html")):
              text = path.read_text(encoding="utf-8")
              for index, match in enumerate(re.finditer(r"<script(?:[^>]*?)>(.*?)</script>", text, re.IGNORECASE | re.DOTALL), 1):
                  body = match.group(1).strip()
                  if not body or "src=" in match.group(0).lower():
                      continue
                  scripts += 1
                  probe = Path(tempfile.gettempdir()) / ("radarx-inline-%d-%d.mjs" % (abs(hash(str(path))) % 100000, index))
                  probe.write_text(body, encoding="utf-8")
                  try:
                      subprocess.run(["node", "--check", str(probe)], check=True, capture_output=True, text=True)
                  except subprocess.CalledProcessError as exc:
                      print(exc.stdout)
                      print(exc.stderr)
                      raise SystemExit("Inline JavaScript syntax failure: %s script #%d" % (path, index))
                  finally:
                      probe.unlink(missing_ok=True)
          print("Validated", scripts, "inline HTML scripts")
          PY

          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/manifest.json
          test -s android/app/src/main/assets/radar8-lightning.html
          test -s android/app/src/main/assets/coin-hunter-radar.html
          test -s android/app/src/main/assets/whale-accumulation-radar.html
          test -s android/app/src/main/assets/falcon-eye-radar.html
          test -s android/app/src/main/assets/multi-analyst.html
          grep -Fq 'multi-analyst-center.html' android/app/src/main/assets/index.html
          grep -Fq 'whale-accumulation-radar.html' android/app/src/main/assets/index.html
          grep -Fq 'falcon-eye-radar.html' android/app/src/main/assets/index.html
          grep -Fq 'coin-hunter-radar.html' android/app/src/main/assets/index.html
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          grep -Fq 'radar8-lightning.html' android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/whale-accumulation-radar.html
          grep -Fq 'whale-accumulation-radar.html' android/app/src/main/assets/index.html
          test -s android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml

      - name: Build signed universal Release APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/radarx-release.keystore
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Verify APK signature, package, and universal output
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          if (( ${#APKS[@]} != 1 )); then
            echo "::error::Expected exactly one Release APK; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}" || true
            exit 1
          fi

          if [[ "${APKS[0]}" != "$APK_DIR/app-release.apk" ]]; then
            echo "::error::Expected the universal Release APK at $APK_DIR/app-release.apk."
            exit 1
          fi

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "${APKS[0]}"
          CERTS="$($APKSIGNER verify --print-certs "${APKS[0]}")"
          echo "$CERTS"
          ! grep -qi "CN=Android Debug" <<<"$CERTS"

          PACKAGE="$("$AAPT" dump badging "${APKS[0]}" | sed -n "s/^package: name='\\([^']*\\)'.*$/\\1/p" | head -n 1)"
          if [[ "$PACKAGE" != "com.radarx.app" ]]; then
            echo "::error::Unexpected package: $PACKAGE"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/radarx-release"
          cp "${APKS[0]}" "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

          sha256sum "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android Emulator online/offline smoke test (best effort)
        timeout-minutes: 6
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: bash android/smoke-test.sh

      - name: Publish signed APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="radarx-native-build224-radar8-v2-hawkeye-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          if [[ "${RADARX_FIREBASE_CLIENT_CONFIGURED:-false}" == "true" && "${RADARX_SERVER_FCM_STATUS:-UNVERIFIED}" == "ENABLED" ]]; then
            PUSH_MODE="Firebase Android client config embedded; DHDTech reports FCM provider configuration enabled; physical-device notification delivery not verified; local polling fallback retained"
          elif [[ "${RADARX_FIREBASE_CLIENT_CONFIGURED:-false}" == "true" && "${RADARX_SERVER_FCM_STATUS:-UNVERIFIED}" == "DISABLED" ]]; then
            PUSH_MODE="Firebase Android client config embedded; DHDTech reports FCM provider disabled; local polling fallback"
          elif [[ "${RADARX_FIREBASE_CLIENT_CONFIGURED:-false}" == "true" ]]; then
            PUSH_MODE="Firebase Android client config embedded; DHDTech FCM provider status unverified; local polling fallback"
          else
            PUSH_MODE="Local polling fallback; Firebase Android client config missing; server-side FCM device delivery not verified"
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RadarX Native — Build 224 + Radar 8 V2 + عين الصقر Hawkeye V2 1.4.9 ${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}" \
            --notes "Signed universal APK built on Build 224 lineage. Version 1.4.9. Push mode: $PUSH_MODE. Includes Radar 8 V2 + Whale Accumulation + X-Factor 20-Analyst Command Center + Radar 9 — عين الصقر Hawkeye V2 + OGN-inspired Move Forensics + Evidence Trajectory Memory, continuous independent background monitoring (auto-start enabled by default), redesigned premium main dashboard, embedded Android UI, Spot/Paper/read-only only; real_order_execution=false; confidence_score=UNKNOWN."

      - name: Verify published HTTPS download
        run: |
          set -euo pipefail
          TAG="radarx-native-build224-radar8-v2-hawkeye-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          DOWNLOADED="${RUNNER_TEMP}/radarx-release-downloaded.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/radarx-release.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$URL" --output "$DOWNLOADED"
          test -s "$DOWNLOADED"
          test "$(stat -c %s "$DOWNLOADED")" = "$(stat -c %s "$APK")"
          test "$(sha256sum "$DOWNLOADED" | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
      - name: Remove signing keystore before artifact upload
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/radarx-release.keystore"
          test ! -e "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Upload verified APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-release-apk
          path: ${{ runner.temp }}/radarx-release/radarx-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0