<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
<title>RadarX — Dashboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#17304a 0,#0b1220 42%,#070c15 100%)}
header{position:sticky;top:0;z-index:10;margin:0 -14px 10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(8,15,25,.9);backdrop-filter:blur(14px);border-bottom:1px solid #20354d}
.rx-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rx-brand{display:flex;align-items:center;gap:10px}.rx-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#35c9ff,#6f7bff);display:grid;place-items:center;font-weight:1000;color:#06101b}.rx-brand b{font-size:17px}.rx-brand small{display:block;color:#8ea5b9;font-size:11px;margin-top:2px}
.rx-status{display:flex;align-items:center;gap:6px;border:1px solid #28506d;border-radius:999px;padding:6px 9px;color:#bfe9ff;font-size:10px;font-weight:900}.rx-dot{width:7px;height:7px;border-radius:50%;background:#43e0a3;box-shadow:0 0 9px #43e0a3}

main{width:min(980px,100%);margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
#marketRadarPanel{margin-top:10px}
footer{padding:18px 4px;text-align:center;color:#8fa8b2;font-size:12px}
</style>
</head>
<body>
<main>
<header><div class="rx-topbar"><div class="rx-brand"><div class="rx-logo">RX</div><div><b>RadarX</b><small>AI Market Intelligence • Spot • Paper</small></div></div><div class="rx-status"><span class="rx-dot"></span>LIVE DATA</div></div></header>
<section id="appError" hidden style="padding:14px;border:1px solid #914553;border-radius:16px;background:#0b151b">
<strong>تعذر تشغيل RadarX</strong>
<p style="color:#8fa8b2">تعذر تحميل الواجهة. أعد المحاولة.</p>
<button id="retryApp" type="button">إعادة المحاولة</button>
</section>
<div id="marketRadarPanel" aria-label="RadarX Dashboard"></div>
<div id="tradliSuitePanel" aria-label="RadarX Intelligence Suite"></div>
<footer>RadarX • SPOT • قراءة فقط • paper_trading=true • real_order_execution=false • confidence_score=UNKNOWN</footer>
</main>
<script>
window.RadarXSmoke=window.RadarXSmoke||{state:function(value){try{console.log(value)}catch(e){}}};
window.__RADARX_BOOT_OK=false;
window.__RADARX_SHOW_BOOT_ERROR=function(){if(window.__RADARX_BOOT_OK)return;var p=document.getElementById('appError');if(p)p.hidden=false};
setTimeout(window.__RADARX_SHOW_BOOT_ERROR,3500);
</script>
<script type="module">
import {mountMarketRadarScreen} from './radarx-market-radar-screen.mjs';
import {mountTradliFeatureSuite} from './radarx-tradli-feature-suite.mjs';

const panel=document.getElementById('marketRadarPanel');
const installButton=document.createElement('button');
let deferredInstallPrompt=null;

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});
installButton.addEventListener('click',async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
});

try{
  mountMarketRadarScreen(panel);
  const suite=document.getElementById('tradliSuitePanel');
  mountTradliFeatureSuite(suite);
  const tabs=Array.from(suite.querySelectorAll('.rxsuite-tab'));
  const panes=Array.from(suite.querySelectorAll('.rxsuite-pane'));
  if(tabs.length!==6 || panes.length!==6) throw new Error('TRADLI_SUITE_CONTRACT_INVALID');
  tabs.forEach(tab=>tab.click());
  if(panes.filter(p=>p.classList.contains('active')).length!==1) throw new Error('TRADLI_SUITE_TAB_STATE_INVALID');
  tabs[0].click();
  if(window.RadarXSmoke)window.RadarXSmoke.state('TRADLI_SUITE_SMOKE_OK');
  window.__RADARX_BOOT_OK=true;
  const error=document.getElementById('appError');
  if(error)error.hidden=true;
  if(window.RadarXSmoke)window.RadarXSmoke.state('UI_READY');
}catch(error){
  console.error('RadarX Dashboard boot error:',error);
  const panelError=document.getElementById('appError');
  if(panelError)panelError.hidden=false;
}
document.getElementById('retryApp').addEventListener('click',()=>window.location.reload());
</script>
</body>
</html>
