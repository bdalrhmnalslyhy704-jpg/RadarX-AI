name: RadarX Android APK 6.0
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - ".github/workflows/radarx-android.yml"
      - "index.html"
      - "RadarX_Ultimate_5.11.js"
      - "radarx-runtime-6.0.js"
      - "RadarX_ProEngine_5.11.js"
      - "radarx-pulse-fusion.js"
      - "radarx-live-chart.js"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
      - name: Publish install package
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.0-Android-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
