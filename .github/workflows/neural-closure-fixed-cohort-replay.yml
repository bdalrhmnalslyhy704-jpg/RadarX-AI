name: Build 224 Neural Closure — Replay Fixed Binance Spot Cohort

on:
  push:
    branches:
      - research/build224-point-in-time-liquidity-20261117
      - research/build224-tcn-lstm-pairwise-rank-20261118
      - research/build224-tcn-lstm-shared-loss-20261120
      - research/build224-tcn-lstm-score-head-oos-ablation-20261120
      - research/build224-temporal-logistic-cv-20261120
      - research/build224-tcn-lstm-external-logistic-execution-context-20261121
      - research/build224-tcn-lstm-execution-head-gates-20261121
      - research/build224-tcn-lstm-selective-abstention-20261121
      - research/build224-tcn-lstm-return-head-normalization-20261121
      - research/build224-tcn-lstm-hurdle-return-head-20261121
      - research/build224-tcn-lstm-hurdle-conditional-means-20261121
      - research/build224-neural-closure-parity-manifest-20261121
      - research/build224-tcn-lstm-inner-logistic-parity-20261121
      - research/build224-execution-head-no-exposure-ablation-20261121
    paths:
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/core/hurdle-return-head.mjs'
      - 'phase2/tools/train-neural-closure-models.mjs'
      - 'phase2/core/temporal-logistic-baseline.mjs'
      - 'phase2/core/neural-closure-contracts.mjs'
      - '.github/workflows/neural-closure-fixed-cohort-replay.yml'

permissions:
  actions: read
  contents: read

concurrency:
  # Full cohort work is push-only; all PRs use lightweight regression workflows.
  # Normalize by branch name so one branch cannot run two expensive replays.
  group: build224-neural-closure-fixed-cohort-replay-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    name: Rebenchmark challengers on the immutable 180-day Binance Spot cohort
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the previously validated fixed cohort
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-neural-closure-dataset-039c9074fc21fa0ea303e360a6ea56d3a401a559
          path: artifacts/neural-closure
          repository: ${{ github.repository }}
          run-id: '44196188685'
          github-token: ${{ github.token }}

      - name: Verify required immutable cohort file exists
        run: |
          test -s artifacts/neural-closure/dataset.json
          echo "Reusing the exact validated 30-symbol / 32,300-row cohort."
          echo "Expected canonical dataset SHA-256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77"

      - name: Train neural challengers on the unchanged cohort
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          node --expose-gc phase2/tools/train-neural-closure-models.mjs \
            --input artifacts/neural-closure/dataset.json \
            --output artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json \
            --epochs 8 \
            --denseEpochs 36 \
            --minimumHoldoutTrades 100 \
            --minimumWinRatePct 55 \
            --maximumDrawdownPct 8 \
            --roundTripCostBps 30

      - name: Verify exact cohort identity and candidate code SHA
        env:
          EXPECTED_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
          EXPECTED_ROW_COUNT: '32300'
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const report=JSON.parse(fs.readFileSync('artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json','utf8'));
            if(report.integrity?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) throw new Error('FIXED_COHORT_SHA_MISMATCH');
            if(Number(report.integrity?.row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) throw new Error('FIXED_COHORT_ROW_COUNT_MISMATCH');
            if(report.integrity?.model_source_commit_sha!==process.env.GITHUB_SHA) throw new Error('MODEL_SOURCE_SHA_MISMATCH');
            console.log(JSON.stringify({dataset_sha256:report.integrity.dataset_sha256,row_count:report.integrity.row_count,model_source_commit_sha:report.integrity.model_source_commit_sha,status:report.status}));
          "

      - name: Validate immutable experiment, tuned Logistic baseline and holdout lock
        env:
          EXPECTED_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
          EXPECTED_ROW_COUNT: '32300'
          EXPECTED_TARGET_DEFINITION: FIRST_TOUCH_PLUS_3_PCT_BEFORE_MINUS_2_PCT_WITHIN_4H_1M_V1
          EXPECTED_TARGET_SEMANTICS: UP_IF_PLUS_3_PCT_FIRST_BEFORE_MINUS_2_PCT_ELSE_NON_SUCCESS_WITHIN_4H_1M_V1
          EXPECTED_FEATURE_SCHEMA: RADARX_TCN_LSTM_LOGISTIC_FULL_ORDERED_SEQUENCE_24X29_696_V1
          EXPECTED_COST_MODEL_ID: FIXED_LINEAR_ROUND_TRIP_BPS_V1
          EXPECTED_SPLIT_ID: RADARX_NEURAL_CLOSURE_PURGED_60_20_20_UTC_DAY_SPLIT_V1
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath='artifacts/neural-closure-replay/fixed-sha-neural-benchmark.json';
          const report=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const benchmark=report.benchmark;
          const manifest=report.experiment_manifest;
          const logistic=benchmark?.models?.LOGISTIC_REGRESSION;
          const logisticCv=report.training?.logistic_baseline_temporal_cv;
          const logisticManifest=manifest?.models?.LOGISTIC_REGRESSION;
          const logisticTraining=report.model_artifacts?.LOGISTIC_REGRESSION;
          const logisticArtifactPath='artifacts/neural-closure-replay/model-artifacts/LOGISTIC_REGRESSION.json';
          const logisticArtifact=fs.existsSync(logisticArtifactPath)
            ?JSON.parse(fs.readFileSync(logisticArtifactPath,'utf8')):null;
          const models=benchmark?.models??{};
          const holdout=benchmark?.holdout_access;
          const failures=[];
          if(report.integrity?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) failures.push('FIXED_COHORT_SHA_MISMATCH');
          if(Number(report.integrity?.row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) failures.push('FIXED_COHORT_ROW_COUNT_MISMATCH');
          if(report.integrity?.model_source_commit_sha!==process.env.GITHUB_SHA) failures.push('MODEL_SOURCE_SHA_MISMATCH');
          if(manifest?.schema!=='RADARX_BUILD224_NEURAL_CLOSURE_EXPERIMENT_MANIFEST_V1') failures.push('EXPERIMENT_MANIFEST_MISSING_OR_INVALID');
          if(manifest?.code_commit_sha!==process.env.GITHUB_SHA) failures.push('MANIFEST_CODE_SHA_MISMATCH');
          if(manifest?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) failures.push('MANIFEST_DATASET_SHA_MISMATCH');
          if(Number(manifest?.dataset_row_count)!==Number(process.env.EXPECTED_ROW_COUNT)) failures.push('MANIFEST_ROW_COUNT_MISMATCH');
          if(logisticCv?.status!=='COMPLETE') failures.push('TUNED_LOGISTIC_CV_INCOMPLETE');
          if(Number(logisticCv?.fold_count)!==5) failures.push('TUNED_LOGISTIC_EXPECTED_FIVE_FOLDS');
          if(logisticCv?.outer_validation_used_for_hyperparameter_selection!==false) failures.push('LOGISTIC_OUTER_VALIDATION_HYPERPARAMETER_LEAKAGE');
          if(logisticCv?.calibration?.outer_validation_used_for_calibrator_fit!==false||
             logisticCv?.calibration?.outer_validation_used_for_calibrator_selection!==false||
             logisticCv?.calibration?.holdout_used_for_calibration!==false) failures.push('LOGISTIC_CALIBRATION_PROVENANCE_INVALID');
          if(!Number.isFinite(logistic?.validation?.raw_brier_score)) failures.push('TUNED_LOGISTIC_RAW_BRIER_MISSING');
          // Promotion Logistic must be the persisted full-information 696D model,
          // not the legacy 18D Cognitive diagnostic or pooled 58D anchor.
          if(logisticManifest?.training_status!=='COMPLETE') failures.push('LOGISTIC_MANIFEST_NOT_TRAINED');
          if(logisticManifest?.feature_schema_id!==process.env.EXPECTED_FEATURE_SCHEMA||
             manifest?.feature_schema_ids?.LOGISTIC_REGRESSION!==process.env.EXPECTED_FEATURE_SCHEMA||
             logisticCv?.feature_schema_id!==process.env.EXPECTED_FEATURE_SCHEMA)
            failures.push('LOGISTIC_FEATURE_SCHEMA_MISMATCH');
          if(logisticCv?.feature_transform!=='24X29_ROW_MAJOR_FLATTENED_CLOSED_SEQUENCE'||
             Number(logisticTraining?.feature_count)!==696||
             Number(logisticArtifact?.feature_names?.length)!==696)
            failures.push('LOGISTIC_FULL_SEQUENCE_FEATURE_WIDTH_MISMATCH');
          if(!logisticArtifact||logisticArtifact?.schema!=='RADARX_VERSIONED_NEURAL_MODEL_ARTIFACT_V1')
            failures.push('LOGISTIC_VERSIONED_ARTIFACT_MISSING');
          if(!logisticManifest?.artifact_sha256||
             logisticManifest?.artifact_sha256!==logisticTraining?.artifact_sha256||
             logisticManifest?.artifact_sha256!==logisticArtifact?.artifact_sha256)
            failures.push('LOGISTIC_ARTIFACT_SHA_MISMATCH');
          const lineage=logisticArtifact?.research_lineage;
          if(lineage?.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256||
             lineage?.target_definition!==process.env.EXPECTED_TARGET_DEFINITION||
             lineage?.target_semantics!==process.env.EXPECTED_TARGET_SEMANTICS||
             lineage?.feature_schema_id!==process.env.EXPECTED_FEATURE_SCHEMA||
             lineage?.cost_model_id!==process.env.EXPECTED_COST_MODEL_ID||
             Number(lineage?.round_trip_cost_bps)!==30||
             Number(lineage?.horizon_ms)!==14_400_000||
             lineage?.split_id!==process.env.EXPECTED_SPLIT_ID)
            failures.push('LOGISTIC_ARTIFACT_RESEARCH_LINEAGE_MISMATCH');
          if(manifest?.target_definition!==process.env.EXPECTED_TARGET_DEFINITION||
             manifest?.target_semantics!==process.env.EXPECTED_TARGET_SEMANTICS||
             Number(manifest?.horizon_ms)!==14_400_000||
             manifest?.cost_model_id!==process.env.EXPECTED_COST_MODEL_ID||
             Number(manifest?.round_trip_cost_bps)!==30||
             manifest?.split_id!==process.env.EXPECTED_SPLIT_ID)
            failures.push('TOP_LEVEL_EXPERIMENT_CONTRACT_MISMATCH');
          if(holdout?.opened!==false) failures.push('HOLDOUT_WAS_OPENED');
          if(holdout?.opening_protocol?.status!=='LOCKED') failures.push('HOLDOUT_PROTOCOL_NOT_LOCKED');
          if(holdout?.opening_protocol?.passed!==false) failures.push('HOLDOUT_PROTOCOL_UNEXPECTEDLY_APPROVED');
          if(!Array.isArray(holdout?.opened_for_models)||holdout.opened_for_models.length!==0)
             failures.push('HOLDOUT_SCORING_MODEL_LIST_NOT_EMPTY');
          // The fixed benchmark schema has no integrity.holdout_scored_rows field.
          // Verify holdout isolation from the authoritative access state and manifest.
          if(holdout?.opening_protocol?.holdout_metrics_read!==false)
             failures.push('HOLDOUT_METRICS_READ_FLAG_INVALID');
          if(manifest?.holdout?.opened!==false||
             manifest?.holdout?.predictions_generated!==false||
             manifest?.holdout?.metrics_read!==false||
             Number(manifest?.holdout?.rows_included_in_scored_predictions)!==0)
             failures.push('MANIFEST_HOLDOUT_LOCK_MISMATCH');
          if(Number(manifest?.holdout?.rows_included_in_scored_predictions)!==0)
             failures.push('HOLDOUT_PREDICTION_ROWS_NOT_ZERO');
          if(Object.values(models).some(model=>model?.holdout?.evaluated===true||
             model?.holdout?.brier_score!==null&&model?.holdout?.brier_score!==undefined||
             model?.holdout?.net_pnl_pct!==null&&model?.holdout?.net_pnl_pct!==undefined)) {
            failures.push('HOLDOUT_METRICS_PRESENT_WHILE_LOCKED');
          }
          const candidateNames=Object.keys(models).filter(name=>name!=='LOGISTIC_REGRESSION');
          const outerPassed=candidateNames.filter(name=>
            models[name]?.validation?.outer_validation_gate?.passed===true);
          const tcn=benchmark?.models?.TCN_LSTM_HYBRID;
          const tcnDiagnostics=report.training?.model_internal_diagnostics?.TCN_LSTM_HYBRID??{};
          const ablation=tcnDiagnostics.score_conditioned_external_ablation??null;
          const contextualRisk=tcnDiagnostics.external_validation_execution_risk_top_k??null;
          const pooledOnlyRisk=tcnDiagnostics.pooled_only_external_validation_execution_risk_top_k??null;
          const bootstrap=report.training?.outer_validation_uncertainty_bootstrap??null;

          // Top-K=1 is the predeclared primary policy (one ranked opportunity
          // per simultaneous closed 15m bucket). K=2 and K=3 remain diagnostics:
          // they cannot be selected after seeing outer-validation outcomes.
          const primaryTopK=1;
          const contextualTrial=contextualRisk?.trials?.find(item=>item.top_k_per_timestamp===primaryTopK)??null;
          const pooledTrial=pooledOnlyRisk?.trials?.find(item=>item.top_k_per_timestamp===primaryTopK)??null;
          const matchedAblationTrial=ablation?.trials?.find(item=>item.top_k_per_timestamp===primaryTopK)??null;
          const contextualMetrics=contextualTrial?.neural_metrics??null;
          const pooledMetrics=pooledTrial?.neural_metrics??null;
          const logisticMetrics=contextualTrial?.logistic_metrics??null;
          const completeMetrics=metrics=>Boolean(metrics&&metrics.return_data_status==='COMPLETE'&&
            Number.isFinite(metrics.trade_count)&&Number.isFinite(metrics.win_rate_pct)&&
            Number.isFinite(metrics.net_pnl_pct)&&Number.isFinite(metrics.max_drawdown_pct));
          const contextVsPooledLower95=bootstrap?.execution?.paired_strategy_differences?.['1']?.
            LOGIT_CONTEXT_AUGMENTED_MINUS_POOLED_ONLY?.net_pnl_pct?.lower_95??null;
          const contextVsLogisticLower95=bootstrap?.execution?.paired_strategy_differences?.['1']?.
            LOGIT_CONTEXT_AUGMENTED_MINUS_LOGISTIC_MATCHED_CONTEXT?.net_pnl_pct?.lower_95??null;
          const contextualAbstention=contextualRisk?.frozen_abstention_policy??null;
          const pooledAbstention=pooledOnlyRisk?.frozen_abstention_policy??null;
          const contextualExecutionHeadGates={
            tcn_lstm_probability_outer_gate:tcn?.validation?.outer_validation_gate?.passed===true,
            ablation_available:ablation?.status==='AVAILABLE',
            exact_matched_opportunities:ablation?.same_outer_validation_opportunities===true,
            both_policies_frozen_on_inner_selection:ablation?.both_policies_frozen_on_selection===true,
            separate_positive_risk_penalties:Number(contextualRisk?.risk_penalty_weight)>0&&
              Number(pooledOnlyRisk?.risk_penalty_weight)>0,
            context_abstention_threshold_frozen:contextualAbstention?.enabled===true&&
              Number.isFinite(contextualAbstention?.minimum_risk_adjusted_score)&&
              contextualAbstention?.source_partition==='INNER_SELECTION_ONLY'&&
              contextualAbstention?.threshold_refitted_on_outer_validation===false&&
               contextualAbstention?.strictly_positive_score_required===true&&
               contextualAbstention?.score_floor_rule===
                 'INNER_SELECTION_QUANTILE_CLAMPED_AT_ZERO_WITH_STRICT_GREATER_THAN',
            pooled_abstention_threshold_frozen:pooledAbstention?.enabled===true&&
              Number.isFinite(pooledAbstention?.minimum_risk_adjusted_score)&&
              pooledAbstention?.source_partition==='INNER_SELECTION_ONLY'&&
              pooledAbstention?.threshold_refitted_on_outer_validation===false&&
               pooledAbstention?.strictly_positive_score_required===true&&
               pooledAbstention?.score_floor_rule===
                 'INNER_SELECTION_QUANTILE_CLAMPED_AT_ZERO_WITH_STRICT_GREATER_THAN',
            genuine_context_abstention:contextualTrial?.abstention_active===true&&
              Number(contextualTrial?.abstained_decision_group_count)>0,
            genuine_pooled_abstention:pooledTrial?.abstention_active===true&&
              Number(pooledTrial?.abstained_decision_group_count)>0,
            logistic_comparator_matches_context_trade_counts:
              contextualTrial?.logistic_matched_candidate_trade_counts===true&&
              contextualMetrics?.trade_count===logisticMetrics?.trade_count,
            logistic_comparator_matches_pooled_trade_counts:
              pooledTrial?.logistic_matched_candidate_trade_counts===true&&
              pooledMetrics?.trade_count===pooledTrial?.logistic_metrics?.trade_count,
            outer_validation_selection_isolation:
              ablation?.outer_validation_used_for_lambda_or_top_k_or_threshold_selection===false&&
              ablation?.outer_validation_used_for_lambda_or_top_k_selection===false,
            holdout_isolation:ablation?.holdout_rows_or_scores_used===false,
            round_trip_cost_30_bps:contextualRisk?.round_trip_cost_bps===30&&
              pooledOnlyRisk?.round_trip_cost_bps===30&&ablation?.same_round_trip_cost_bps===30,
            complete_contextual_metrics:completeMetrics(contextualMetrics),
            minimum_100_trades:completeMetrics(contextualMetrics)&&contextualMetrics.trade_count>=100,
            minimum_55pct_win_rate:completeMetrics(contextualMetrics)&&contextualMetrics.win_rate_pct>=55,
            positive_net_pnl:completeMetrics(contextualMetrics)&&contextualMetrics.net_pnl_pct>0,
            maximum_8pct_drawdown:completeMetrics(contextualMetrics)&&contextualMetrics.max_drawdown_pct<=8,
            beats_previous_pooled_head:completeMetrics(contextualMetrics)&&completeMetrics(pooledMetrics)&&
              contextualMetrics.net_pnl_pct>pooledMetrics.net_pnl_pct,
            beats_logistic:completeMetrics(contextualMetrics)&&completeMetrics(logisticMetrics)&&
              contextualMetrics.net_pnl_pct>logisticMetrics.net_pnl_pct,
            drawdown_no_worse_than_previous_head:completeMetrics(contextualMetrics)&&
              completeMetrics(pooledMetrics)&&contextualMetrics.max_drawdown_pct<=pooledMetrics.max_drawdown_pct,
            drawdown_no_worse_than_logistic:completeMetrics(contextualMetrics)&&
              completeMetrics(logisticMetrics)&&contextualMetrics.max_drawdown_pct<=logisticMetrics.max_drawdown_pct,
            paired_95pct_net_pnl_superiority_vs_previous_head:Number.isFinite(contextVsPooledLower95)&&
              contextVsPooledLower95>0,
            paired_95pct_net_pnl_superiority_vs_matched_logistic:Number.isFinite(contextVsLogisticLower95)&&
              contextVsLogisticLower95>0
          };
          const executionHeadPassed=Object.values(contextualExecutionHeadGates).every(value=>value===true);
          const executionHeadDecision={
            schema:'RADARX_TCN_LSTM_EXECUTION_HEAD_OUTER_VALIDATION_GATE_V1',
            status:executionHeadPassed
              ?'EXECUTION_HEAD_SUPERIORITY_PROVEN_OUTER_VALIDATION_ONLY_HOLDOUT_STILL_LOCKED'
              :'EXECUTION_HEAD_SUPERIORITY_NOT_PROVEN_HOLDOUT_LOCKED',
            passed:executionHeadPassed,
            primary_policy:{
              top_k_per_timestamp:primaryTopK,decision_bucket:'CLOSED_15M',
              selection:'TOP_K_1_WITH_INNER_SELECTED_ABSTENTION_THRESHOLD',
              abstention_threshold_source:'INNER_SELECTION_ONLY',
              contextual_abstention_threshold:contextualAbstention?.minimum_risk_adjusted_score??null,
              contextual_abstention_percentile:contextualAbstention?.percentile_selected_on_inner_selection??null,
              pooled_only_abstention_threshold:pooledAbstention?.minimum_risk_adjusted_score??null,
              pooled_only_abstention_percentile:pooledAbstention?.percentile_selected_on_inner_selection??null
            },
            acceptance_gates:contextualExecutionHeadGates,
            metrics:{
              round_trip_cost_bps:contextualRisk?.round_trip_cost_bps??null,
              contextual_head:contextualMetrics,
              previous_pooled_only_head:pooledMetrics,
              logistic_regression:logisticMetrics,
              paired_net_pnl_difference_lower_95:{
                contextual_minus_pooled_only:contextVsPooledLower95,
                contextual_minus_matched_logistic:contextVsLogisticLower95
              }
            },
            comparisons:{
              contextual_vs_pooled_only:matchedAblationTrial?.context_minus_pooled_only??null,
              contextual_vs_logistic:contextualTrial?.neural_minus_logistic??null,
              contextual_risk_penalty_weight:contextualRisk?.risk_penalty_weight??null,
              pooled_only_risk_penalty_weight:pooledOnlyRisk?.risk_penalty_weight??null,
              bootstrap_status:bootstrap?.status??'UNAVAILABLE'
            },
            diagnostic_top_k_trials:[],
            note:'Top-K=1 is fixed; abstention is the only inner-selected execution policy variable'
          };
          const scientificDecision={
            schema:'RADARX_BUILD224_OUTER_VALIDATION_SCIENTIFIC_DECISION_V1',
            status:executionHeadPassed
              ?'EXECUTION_HEAD_SUPERIORITY_PROVEN_OUTER_VALIDATION_ONLY_HOLDOUT_STILL_LOCKED'
              :'NEURAL_OR_EXECUTION_HEAD_SUPERIORITY_NOT_PROVEN_HOLDOUT_LOCKED',
            code_commit_sha:report.integrity?.model_source_commit_sha??null,
            dataset_sha256:report.integrity?.dataset_sha256??null,
            row_count:report.integrity?.row_count??null,
            logistic_baseline:{
              raw_brier:logistic?.validation?.raw_brier_score??null,
              calibrated_brier:logistic?.validation?.calibrated_brier_score??null,
              cv_status:logisticCv?.status??null,
              folds:logisticCv?.fold_count??0,
              selected_configuration:logisticCv?.selected_configuration??null,
              calibration_method:logisticCv?.calibration?.selected_method??null
            },
            outer_validation_passed_candidates:outerPassed,
            tcn_lstm:{
              raw_brier:tcn?.validation?.raw_brier_score??null,
              calibrated_brier:tcn?.validation?.calibrated_brier_score??null,
              outer_validation_gate:tcn?.validation?.outer_validation_gate??null
            },
            inner_selection:{
              status:tcnDiagnostics.selection_status??tcnDiagnostics.status??null,
              baseline_selection_brier:tcnDiagnostics.baseline_selection_brier??null,
              gate_results:tcnDiagnostics.selection_scoring?.gate_results??null,
              candidates:(tcnDiagnostics.candidates??[]).map(candidate=>({
                name:candidate.name??null,
                selection_brier:candidate.selection_brier??null,
                brier_improvement:candidate.brier_improvement??null,
                pairwise_ranking_improvement:candidate.pairwise_ranking_improvement??null,
                execution_head_context_ablation:candidate.execution_head_context_ablation??null
              }))
            },
            execution_head_decision:executionHeadDecision,
            score_conditioned_vs_pooled_only_ablation:ablation,
            uncertainty_bootstrap:bootstrap,
            holdout:{
              status:'LOCKED',
              opened:false,
              scored_rows:0,
              metrics_read:false,
              missing_protocol_checks:holdout?.opening_protocol?.missing_checks??[]
            },
            failures
          };
          fs.writeFileSync('artifacts/neural-closure-replay/scientific-decision.json',
            JSON.stringify(scientificDecision,null,2)+'\n');
          console.log(JSON.stringify(scientificDecision,null,2));
          if(failures.length) process.exitCode=1;
          NODE
      - name: Upload fixed-cohort rebenchmark report and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-neural-closure-replay-${{ github.sha }}
          path: artifacts/neural-closure-replay/
          if-no-files-found: ignore
          retention-days: 30
