name: RadarX Triple Radar CI
# Bottom Radar repair validation

on:
  push:
    branches:
      - phase3-triple-radar
      - phase4-symbol-deep-scan
      - phase4-symbol-deep-scan-testfix
      - phase5-fix-bottom-radar-enable-deep-scan
      - phase5-ci-runtime-timeout-hardening
      - phase6-radar4-independent-microstructure
      - phase5-kahir-independent-radar
      - fix-four-radars-runtime
      - fix-radar-runtime-return-market-data
      - radar6-doomsday-20261005
      - build224-multi-analyst-20261007
      - build224-doomsday-muqawim-sniper-v1
      - build224-falcon-eye-ogn-v1
      - build224-persistent-archive-20261009
      - feature/build224-event-breakout-integrated-v4-20261011
  pull_request:
    branches:
      - phase3-triple-radar
      - build224-multi-analyst-20261007
  workflow_dispatch:

permissions:
  contents: read

# Keep an active validation run alive when another update arrives.
concurrency:
  # Only validate the newest commit for each branch/PR; stale emulator runs
  # must not consume runners after a newer commit is pushed.
  group: triple-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Run full test suite
        run: npm test
        timeout-minutes: 25

      - name: Run Android Pre-Move UI regression test
        run: node android/app/src/main/assets/tests/market-radar-integration.test.mjs
        timeout-minutes: 5

      - name: Verify FCM registration and physical device receipt diagnostics
        run: node android/fcm-watch-notification-regression.mjs
        timeout-minutes: 5

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical
        timeout-minutes: 5

      - name: Validate Triple Radar source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node --check phase2/core/falcon-eye-radar.mjs
          node --check phase2/core/rotation-lag-radar.mjs
          node --check phase2/market/universe-scanner.mjs
          node --check phase2/core/strong-move-radar.mjs
          node --check phase2/core/early-move-sentinel.mjs
          node --check phase2/core/symbol-deep-analyzer.mjs
          node --check phase2/core/liquidity-absorption-radar.mjs
          node --check phase2/core/kahir-radar.mjs
          node --check phase2/core/doomsday-radar.mjs
          node --check phase2/core/elite-confluence-gate.mjs
          node --check phase2/core/radar-alert-meta.mjs
          node --check phase2/core/multi-analyst-engine.mjs
          node --check android/app/src/main/assets/radarx-symbol-deep-scan.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-doomsday-radar.mjs
          node --check android/app/src/main/assets/radarx-background-control.mjs
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          bash -n android/run-emulator-smoke.sh
          test -f android/app/src/main/assets/radar1-destroyer.html
          test -f android/app/src/main/assets/radar2-dark-king.html
          test -f android/app/src/main/assets/radar3-joker.html
          test -f android/app/src/main/assets/radar4-sweeper.html
          test -f android/app/src/main/assets/doomsday-radar.html
          test -f android/app/src/main/assets/falcon-eye-radar.html
          node android/backend-client-regression.mjs
          node android/background-monitor-regression.mjs
          node --test android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Build production backend Docker image
        timeout-minutes: 10
        run: docker build --pull=false -t radarx-ai-ci:${{ github.sha }} .

      - name: Set up Android build toolchain
        uses: actions/setup-java@v4
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        timeout-minutes: 5
        with:
          # Skip package installation here. platform-tools is installed together with
          # the pinned platform/build-tools below to avoid a duplicate, unbounded
          # remote-manifest fetch in the setup action.
          packages: ""

      - name: Accept Android SDK licenses
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "RADARX_ANDROID_SDK_LICENSES_START"
          license_answers="$(printf 'y\\n%.0s' {1..100})"
          timeout 120s sdkmanager --licenses <<< "${license_answers}"
          echo "RADARX_ANDROID_SDK_LICENSES_READY"

      - name: Install Android SDK build packages
        timeout-minutes: 8
        run: |
          set -euo pipefail
          echo "RADARX_ANDROID_SDK_INSTALL_START"
          timeout 420s sdkmanager --verbose "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "RADARX_ANDROID_SDK_INSTALL_READY"

      - name: Assemble Android debug APK
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "RADARX_ANDROID_GRADLE_ASSEMBLE_START"
          timeout 540s gradle --console=plain -p android :app:assembleDebug --no-daemon --stacktrace --info
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          echo "RADARX_ANDROID_GRADLE_ASSEMBLE_READY"
          ls -lh "${APK}"
          sha256sum "${APK}"

      - name: Preinstall Android Emulator SDK packages with bounded retries
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sdk_package_valid() {
            local package="$1"
            local path="$2"
            case "$package" in
              "platforms;android-29") [[ -s "$path/android.jar" ]] ;;
              "build-tools;37.0.0") [[ -x "$path/aapt" && -x "$path/apksigner" && -x "$path/zipalign" ]] ;;
              *) return 1 ;;
            esac
          }
          install_sdk_package() {
            local package="$1"
            local path="$2"
            for attempt in 1 2 3; do
              if sdk_package_valid "$package" "$path"; then
                echo "SDK package already verified: $package"
                return 0
              fi
              echo "Installing $package (attempt $attempt/3)."
              if timeout 180s sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "$package"; then
                if sdk_package_valid "$package" "$path"; then
                  echo "SDK package verified: $package"
                  return 0
                fi
              fi
              echo "::warning::SDK package $package was incomplete or corrupt; cleaning only its partial install before retry."
              rm -rf "$path"
              if [[ "$attempt" -lt 3 ]]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not install and verify Android Emulator package $package after three attempts."
            return 1
          }
          install_sdk_package "platforms;android-29" "$ANDROID_SDK_ROOT/platforms/android-29"
          install_sdk_package "build-tools;37.0.0" "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - name: Android emulator online/offline background smoke
        # A bounded local ADB loop repairs transient "device offline" boot states.
        timeout-minutes: 40
        env:
          RADARX_EMULATOR_API_LEVEL: "29"
          RADARX_APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: bash android/run-emulator-smoke.sh
