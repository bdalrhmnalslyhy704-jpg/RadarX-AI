name: RadarX Android APK 6.0
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/radarx-android.yml"
      - "index.html"
      - "RadarX_Ultimate_5.11.js"
      - "radarx-runtime-6.0.js"
      - "RadarX_ProEngine_5.11.js"
      - "radarx-pulse-fusion.js"
      - "radarx-live-chart.js"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned archive)
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null

      - name: Prepare direct-download APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RadarX-6.0.apk
          unzip -t dist/RadarX-6.0.apk >/dev/null

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.0-Android-Installable-APK
          path: dist/RadarX-6.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarX-6.0-Android-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v6.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/RadarX-6.0.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RadarX 6.0 Android" \
            --notes "RadarX 6.0 installable Android APK. Built from commit ${GITHUB_SHA}." \
            --latest
