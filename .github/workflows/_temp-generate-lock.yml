name: TEMP Generate package lock

on:
  push:
    branches: [phase2-render-runtime-compatibility]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install lockfile and capture output
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts > install-output.log 2>&1
          echo "install_exit_code=$?" >> install-output.log
          npm ci --ignore-scripts > ci-output.log 2>&1
          echo "ci_exit_code=$?" >> ci-output.log
          npm audit --omit=dev --audit-level=critical > audit-output.log 2>&1
          echo "audit_exit_code=$?" >> audit-output.log
          npm test > test-output.log 2>&1
          echo "test_exit_code=$?" >> test-output.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-compat-diagnostics
          path: |
            package-lock.json
            install-output.log
            ci-output.log
            audit-output.log
            test-output.log
          if-no-files-found: error
