<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>RadarX — عقل الوكلاء والتعلّم</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26384d,#0a111c 48%,#060a10);color:#eaf7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1050px;margin:auto;padding:16px 14px 40px}.muted{color:#91a8bb;font-size:12px;line-height:1.6}.card{margin:12px 0;padding:15px;border:1px solid #294763;border-radius:18px;background:#0c1723}.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#101f2e;border:1px solid #23415c}.stat small{color:#8ba4b7}.stat b{display:block;font-size:24px;margin-top:4px}.agent{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #1d3346}.agent:last-child{border-bottom:0}.pill{display:inline-block;padding:6px 8px;background:#16283a;border-radius:9px;font-size:10px;font-weight:900}.green{color:#68e7b0}.yellow{color:#ffd37a}@media(max-width:700px){.hero{grid-template-columns:1fr}.agent{grid-template-columns:1.4fr .8fr .8fr}}</style></head>
<body><main>
<h2>📚 عقل الوكلاء — دفتر التعلّم</h2><div class="muted">كل وكيل يتلقى تقييمًا من تحركات السوق اللاحقة. الوزن يزيد تدريجيًا مع الدقة ويُخفض مع الأخطاء، بدل الادعاء بأن الوكلاء «يعرفون المستقبل».</div>
<section class="card"><div class="hero"><div class="stat"><small>إجمالي التنبؤات</small><b id="total">—</b></div><div class="stat"><small>نتائج محسومة</small><b id="resolved">—</b></div><div class="stat"><small>آخر تحديث</small><b id="asof">—</b></div></div></section>
<section class="card"><h3>أداء كل وكيل</h3><div id="agents"></div></section>
<section class="card"><h3>آخر ما تعلّمه الدفتر</h3><div id="recent"></div></section>
<p class="muted"><a href="./ai-market.html">← وكلاء السوق الذاتيون</a>　<a href="./index.html">← RadarX</a></p>
<script type="module">
import {getAgentLearning} from './radarx-backend-client.mjs';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),n=v=>Number.isFinite(Number(v))?Number(v).toFixed(1):'—';
function draw(b){const p=b.profile||{},a=p.agents||[];$('total').textContent=p.total_predictions??0;$('resolved').textContent=p.resolved??0;$('asof').textContent=b.as_of?new Date(b.as_of).toLocaleString('ar-EG'):'';$('agents').innerHTML=a.length?a.map(x=>'<div class="agent"><b>'+esc(x.agent_id)+'</b><span>فوز <strong class="green">'+(x.wins||0)+'</strong></span><span>خسارة <strong>'+(x.losses||0)+'</strong></span><span><span class="pill">دقة '+(x.win_rate_pct==null?'—':n(x.win_rate_pct)+'%')+' • وزن '+n(x.score_weight,2)+'</span></span></div>').join(''):'<div class="muted">لم تتكوّن نتائج تعلّم بعد.</div>';$('recent').innerHTML=(b.recent||[]).slice(0,60).map(x=>'<div class="muted" style="padding:7px 0;border-bottom:1px solid #1d3346"><b>'+esc(x.symbol)+'</b> • '+esc(x.agent_id)+' • '+esc(x.direction)+' • '+esc(x.outcome||'PENDING')+(x.return_pct!=null?' • '+n(x.return_pct)+'%':'')+'</div>').join('')||'<div class="muted">دفتر التعلّم فارغ.</div>'}
async function refresh(){try{const r=await getAgentLearning();if(!r.ok)throw new Error('HTTP_'+r.status);draw(r.body)}catch(e){$('recent').innerHTML='<div class="muted">'+esc(e?.message||e)+'</div>'}}refresh();setInterval(refresh,20000);
</script></main></body></html>
