name: Build 224 Unified 24h Neural and Hybrid OOS Brier Matrix

on:
  push:
    branches:
      - research/daily-early-riser-mlp-budget-20261113
    paths:
      - 'research/TRIGGER_NEURAL_HYBRID_OOS_BENCHMARK.txt'
      - 'phase2/tools/verify-daily-early-riser-census-artifact.mjs'
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/core/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tools/daily-early-riser-neural-benchmark.mjs'
      - '.github/workflows/neural-hybrid-oos-benchmark.yml'
  pull_request:
    branches:
      - research/daily-early-riser-mlp-budget-20261113
      - research/build224-neural-validation-stream-fix-20261113
    paths:
      - 'phase2/core/cognitive-brain.mjs'
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/core/neural-safety-contracts.mjs'
      - 'phase2/core/daily-early-riser-census.mjs'
      - 'phase2/core/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tools/daily-early-riser-historical-census.mjs'
      - 'phase2/tools/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tools/neural-hybrid-oos-matrix.mjs'
      - 'phase2/tools/verify-daily-early-riser-census-artifact.mjs'
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/core/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tools/daily-early-riser-neural-benchmark.mjs'
      - 'phase2/tests/temporal-lstm-hybrid.test.mjs'
      - 'phase2/tests/daily-early-riser-neural-benchmark.test.mjs'
      - 'phase2/tests/daily-early-riser-census-artifact-validation.test.mjs'
      - 'phase2/tests/temporal-neural-brain.test.mjs'
      - 'phase2/tests/cognitive-brain.test.mjs'
      - '.github/workflows/neural-hybrid-oos-benchmark.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: build224-unified-neural-hybrid-brier-matrix
  cancel-in-progress: false

jobs:
  resolve-census:
    name: Resolve exact timestamp-audited Census SHA
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
      run_number: ${{ steps.locate.outputs.run_number }}
      source_commit: ${{ steps.locate.outputs.source_commit }}
    steps:
      - name: Wait for exact source Census run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CENSUS_COMMIT: cde938585d9a44cdf751db1ceb23c3f211fa32a1
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const branch=encodeURIComponent('research/daily-early-riser-mlp-budget-20261113');
          const url='https://api.github.com/repos/'+process.env.REPOSITORY+
            '/actions/runs?branch='+branch+'&event=push&per_page=100';
          const headers={accept:'application/vnd.github+json',
            authorization:'Bearer '+process.env.GH_TOKEN,
            'x-github-api-version':'2022-11-28'};
          let selected=null;
          for(let attempt=1;attempt<=360;attempt++){
            const response=await fetch(url,{headers});
            if(!response.ok)throw new Error('CENSUS_LOOKUP_HTTP_'+response.status);
            const payload=await response.json();
            const matches=(payload.workflow_runs||[]).filter(run=>
              run.name==='Build 224 Daily Early-Riser Binance Spot Historical Census'&&
              run.head_sha===process.env.CENSUS_COMMIT
            ).sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at));
            const completed=matches.find(run=>run.status==='completed');
            if(completed){
              if(completed.conclusion!=='success')
                throw new Error('EXACT_CENSUS_FAILED:'+completed.id+':'+completed.conclusion);
              selected=completed;break;
            }
            console.log(JSON.stringify({attempt,waiting:true,run_id:matches[0]?.id??null,
              status:matches[0]?.status??'NOT_VISIBLE'}));
            await new Promise(resolve=>setTimeout(resolve,60000));
          }
          if(!selected)throw new Error('EXACT_CENSUS_TIMEOUT');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'run_id='+selected.id+'\nrun_number='+selected.run_number+
            '\nsource_commit='+selected.head_sha+'\n');
          console.log(JSON.stringify({run_id:selected.id,run_number:selected.run_number,
            head_sha:selected.head_sha,conclusion:selected.conclusion}));
          NODE

  unified-benchmark:
    name: Fit the 24h neural and hybrid challengers on the same cohort
    needs: resolve-census
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout current research model code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download exact completed Census artifact
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-daily-early-riser-census-${{ needs.resolve-census.outputs.run_number }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-census.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify SHA, label, liquidity, chronology and TCN timestamp provenance
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve-census.outputs.source_commit }}
          CENSUS_RUN_ID: ${{ needs.resolve-census.outputs.run_id }}
        run: |
          set -euo pipefail
          test -s artifacts/daily-early-riser-census.json
          test -s artifacts/daily-early-riser-samples.jsonl
          test -s artifacts/daily-early-riser-temporal-sequences.jsonl
          node phase2/tools/verify-daily-early-riser-census-artifact.mjs \
            artifacts/daily-early-riser-census.json \
            artifacts/daily-early-riser-samples.jsonl \
            artifacts/daily-early-riser-temporal-sequences.jsonl
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and regression checks
        run: |
          node --check phase2/core/neural-safety-contracts.mjs
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/temporal-neural-brain.mjs
          node --check phase2/core/temporal-lstm-hybrid.mjs
          node --check phase2/core/daily-early-riser-neural-benchmark.mjs
          node --check phase2/tools/daily-early-riser-neural-benchmark.mjs
          node --check phase2/tools/neural-hybrid-oos-matrix.mjs
          node --test --test-timeout=180000 phase2/tests/neural-safety-contracts.test.mjs
          node --test --test-timeout=180000 phase2/tests/neural-hybrid-oos-matrix.test.mjs
          node --test --test-timeout=180000 phase2/tests/daily-early-riser-neural-benchmark.test.mjs
          node --test --test-timeout=180000 phase2/tests/temporal-neural-brain.test.mjs
          node --test --test-timeout=180000 phase2/tests/temporal-lstm-hybrid.test.mjs
      - name: Train all tabular and temporal challengers on the same 24h safe +5% cohort
        env:
          RADARX_CENSUS_SOURCE_RUN_ID: ${{ needs.resolve-census.outputs.run_id }}
          RADARX_CENSUS_SOURCE_COMMIT: ${{ needs.resolve-census.outputs.source_commit }}
        run: |
          node phase2/tools/daily-early-riser-neural-benchmark.mjs \
            --input artifacts/daily-early-riser-samples.jsonl \
            --temporal-input artifacts/daily-early-riser-temporal-sequences.jsonl \
            --census-report artifacts/daily-early-riser-census.json \
            --output artifacts/daily-early-riser-unified-24h-5pct-neural.json \
            --target 5 --label-mode safe_opportunity --horizon-hours 24 \
            --liquidity-lane STANDARD_750K_PLUS \
            --neural-training-history-fraction 1.0 --neural-iterations 120 \
            --enable-factorization-machine true --factorization-rank 16 \
            --factorization-iterations 120 --factorization-learning-rate 0.008 \
            --factorization-l2 0.06 --asymmetric-directional-ranking-loss true \
            --enable-tcn-lstm-hybrid true --tcn-lstm-epochs 8 \
            --tcn-lstm-max-training-samples 4096 --tcn-lstm-bootstrap-iterations 400
      - name: Build strict head-to-head Brier matrix
        if: always()
        run: |
          if [ -s artifacts/daily-early-riser-unified-24h-5pct-neural.json ]; then
            node phase2/tools/neural-hybrid-oos-matrix.mjs \
              --daily-report artifacts/daily-early-riser-unified-24h-5pct-neural.json \
              --output artifacts/neural-hybrid-oos-matrix.json \
              --targets 5
          else
            echo 'Unified daily neural report missing; Brier matrix not generated.'
            exit 1
          fi
      - name: Publish final head-to-head Brier table and gate status
        if: always()
        run: |
          if [ -s artifacts/neural-hybrid-oos-matrix.json ]; then
            cat artifacts/neural-hybrid-oos-matrix.json >> "$GITHUB_STEP_SUMMARY"
          elif [ -s artifacts/daily-early-riser-unified-24h-5pct-neural.json ]; then
            cat artifacts/daily-early-riser-unified-24h-5pct-neural.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload all same-cohort neural and hybrid reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-unified-neural-hybrid-oos-brier-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
