name: RadarX TCN V11 attention regression

on:
  push:
    branches:
      - research/build224-hurdle-v2-artifact-export-20261122
      - research/neural-closure-streaming-writer-20261114
      - research/build224-tcn-lstm-inner-logistic-parity-20261121
      - research/build224-execution-head-no-exposure-ablation-20261121
      - research/build224-temporal-tied-ranker-20261125
      - research/build224-pareto-checkpoint-validity-20261127
    paths:
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/core/neural-closure-contracts.mjs'
      - 'phase2/tools/train-neural-closure-models.mjs'
      - 'phase2/tests/temporal-neural-brain.test.mjs'
      - 'phase2/tests/temporal-lstm-hybrid.test.mjs'
      - 'phase2/tests/neural-closure-contracts.test.mjs'
      - 'phase2/tests/neural-closure-training-wiring.test.mjs'
      - 'phase2/core/model-artifact-guardian.mjs'
      - 'phase2/core/hurdle-return-head.mjs'
      - 'phase2/core/hurdle-v2-artifact-contract.mjs'
      - 'phase2/tests/hurdle-v2-artifact-contract.test.mjs'
      - 'phase2/tests/model-artifact-feature-parity.test.mjs'
      - 'phase2/tests/logistic-temporal-cv.test.mjs'
      - 'phase2/core/temporal-logistic-baseline.mjs'
      - 'phase2/core/ordered-temporal-ranker-artifact.mjs'
      - 'phase2/tests/ordered-temporal-ranker-artifact.test.mjs'
      - 'phase2/core/neural-closure-data-builder.mjs'
      - 'phase2/core/neural-closure-universe.mjs'
      - 'phase2/tools/build-neural-closure-dataset.mjs'
      - 'phase2/tests/neural-closure-data-builder.test.mjs'
      - 'phase2/core/neural-closure-secure-bundle.mjs'
      - 'phase2/tools/secure-prospective-cohort-bundle.mjs'
      - 'phase2/tests/neural-closure-secure-bundle.test.mjs'
      - '.github/workflows/neural-closure-prospective-cohort.yml'
      - '.github/workflows/neural-attention-regression.yml'
  pull_request:
    paths:
      - 'phase2/core/temporal-neural-brain.mjs'
      - 'phase2/core/temporal-lstm-hybrid.mjs'
      - 'phase2/core/neural-closure-contracts.mjs'
      - 'phase2/tools/train-neural-closure-models.mjs'
      - 'phase2/tests/temporal-neural-brain.test.mjs'
      - 'phase2/tests/temporal-lstm-hybrid.test.mjs'
      - 'phase2/tests/neural-closure-contracts.test.mjs'
      - 'phase2/tests/neural-closure-training-wiring.test.mjs'
      - 'phase2/core/model-artifact-guardian.mjs'
      - 'phase2/core/hurdle-return-head.mjs'
      - 'phase2/core/hurdle-v2-artifact-contract.mjs'
      - 'phase2/tests/hurdle-v2-artifact-contract.test.mjs'
      - 'phase2/tests/model-artifact-feature-parity.test.mjs'
      - 'phase2/tests/logistic-temporal-cv.test.mjs'
      - 'phase2/core/temporal-logistic-baseline.mjs'
      - 'phase2/core/ordered-temporal-ranker-artifact.mjs'
      - 'phase2/tests/ordered-temporal-ranker-artifact.test.mjs'
      - 'phase2/core/neural-closure-data-builder.mjs'
      - 'phase2/core/neural-closure-universe.mjs'
      - 'phase2/tools/build-neural-closure-dataset.mjs'
      - 'phase2/tests/neural-closure-data-builder.test.mjs'
      - 'phase2/core/neural-closure-secure-bundle.mjs'
      - 'phase2/tools/secure-prospective-cohort-bundle.mjs'
      - 'phase2/tests/neural-closure-secure-bundle.test.mjs'
      - '.github/workflows/neural-closure-prospective-cohort.yml'
      - '.github/workflows/neural-attention-regression.yml'

permissions:
  contents: read

concurrency:
  # A candidate branch updated by both push and pull_request gets one regression.
  group: build224-neural-attention-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tcn-v11-regression:
    name: Verify V11 training, artifact reload and two-regime gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check the V11 implementation
        run: |
          node --check phase2/core/temporal-neural-brain.mjs
          node --check phase2/core/temporal-lstm-hybrid.mjs
          node --check phase2/core/neural-closure-data-builder.mjs
          node --check phase2/tools/build-neural-closure-dataset.mjs
          node --check phase2/tools/train-neural-closure-models.mjs
      - name: Verify real Binance cohort collection and prospective scheduling
        run: node --test phase2/tests/neural-closure-data-builder.test.mjs
      - name: Verify prospective cohort encryption boundary
        run: |
          node --check phase2/core/neural-closure-secure-bundle.mjs
          node --check phase2/tools/secure-prospective-cohort-bundle.mjs
          node --test phase2/tests/neural-closure-secure-bundle.test.mjs
      - name: Verify V8-V11 and TCN-LSTM fixed-SHA wiring
        run: node --test phase2/tests/neural-closure-training-wiring.test.mjs
      - name: Verify recurrent TCN-LSTM gradients, calibration and chronology contracts
        run: node --test phase2/tests/temporal-lstm-hybrid.test.mjs
      - name: Verify fixed-SHA benchmark and holdout lock protocol
        run: node --test phase2/tests/neural-closure-contracts.test.mjs
      - name: Verify tuned Logistic CV and matched temporal-feature baseline
        run: node --test --test-timeout=180000 phase2/tests/logistic-temporal-cv.test.mjs
      - name: Verify Hurdle V2 dual-head artifact export, hashes and fresh-process reload
        run: node --test --test-timeout=180000 phase2/tests/hurdle-v2-artifact-contract.test.mjs
      - name: Verify ordered temporal ranker artifact integrity and inference
        run: node --test --test-timeout=180000 phase2/tests/ordered-temporal-ranker-artifact.test.mjs
      - name: Verify checksummed model artifacts and experiment lineage
        run: node --test --test-timeout=180000 phase2/tests/model-artifact-feature-parity.test.mjs
      - name: Verify temporal training and exact artifact inference round-trip
        run: node --test phase2/tests/temporal-neural-brain.test.mjs


  hurdle-v2-inner-training:
    name: Train Hurdle V2 and qualify on inner data only
    # PR qualification remains protected by the repository opt-in variable.
    # This exact research branch also permits an explicit marker-gated push run;
    # that path still trains and qualifies on the inner partition only.
    if: (github.event_name == 'pull_request' && (vars.RADARX_ENABLE_HURDLE_INNER_QUALIFICATION == 'true' || github.head_ref == 'research/build224-temporal-tied-ranker-20261125' || github.head_ref == 'research/build224-hurdle-v2-runtime-closure-20261127' || github.head_ref == 'research/build224-ranker-strong-regularization-20261127' || github.head_ref == 'research/build224-ranker-low-l2-refinement-20261127') || github.event_name == 'push' && github.ref_name == 'research/build224-temporal-tied-ranker-20261125' && contains(github.event.head_commit.message, '[RUN-HURDLE-INNER-ONLY]')) && (github.head_ref == 'research/build224-hurdle-v2-artifact-export-20261122' || github.head_ref == 'research/build224-purged-execution-block-ranker-20261124' || github.head_ref == 'research/build224-ordered-ranker-persistence-20261124' || github.head_ref == 'research/build224-ranker-full-training-partition-20261124' || github.head_ref == 'research/build224-temporal-tied-ranker-20261125' || github.head_ref == 'research/build224-hurdle-v2-runtime-closure-20261127' || github.head_ref == 'research/build224-ranker-strong-regularization-20261127' || github.head_ref == 'research/build224-ranker-low-l2-refinement-20261127' || github.ref_name == 'research/build224-temporal-tied-ranker-20261125')
    needs: tcn-v11-regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      EXPECTED_DATASET_SHA256: f9923205db04e0356b0df078c138b8862987b42bbf81b7e329d29179392f8a77
      EXPECTED_INPUT_FILE_SHA256: f16adcbb88fb64e4d79626c1cf0e4c8d461bd33a3c0f598223ac809c28b0ff3d
      EXPECTED_DATASET_SOURCE_COMMIT: 039c9074fc21fa0ea303e360a6ea56d3a401a559
      EXPECTED_TARGET_DEFINITION: FIRST_TOUCH_PLUS_3_PCT_BEFORE_MINUS_2_PCT_WITHIN_4H_1M_V1
      EXPECTED_TARGET_SEMANTICS: UP_IF_PLUS_3_PCT_FIRST_BEFORE_MINUS_2_PCT_ELSE_NON_SUCCESS_WITHIN_4H_1M_V1
      EXPECTED_SPLIT_ID: RADARX_NEURAL_CLOSURE_PURGED_60_20_20_UTC_DAY_SPLIT_V1
    steps:
      - name: Checkout exact training SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the previously validated immutable cohort
        uses: actions/download-artifact@v4
        with:
          name: radarx-build224-neural-closure-dataset-039c9074fc21fa0ea303e360a6ea56d3a401a559
          path: artifacts/neural-closure
          repository: ${{ github.repository }}
          run-id: '44196188685'
          github-token: ${{ github.token }}

      - name: Verify frozen input identity before training
        run: |
          set -euo pipefail
          test -s artifacts/neural-closure/dataset.json
          actual="$(sha256sum artifacts/neural-closure/dataset.json | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_INPUT_FILE_SHA256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input=JSON.parse(fs.readFileSync('artifacts/neural-closure/dataset.json','utf8'));
          if(input.source_commit_sha!==process.env.EXPECTED_DATASET_SOURCE_COMMIT)
            throw new Error('DATASET_SOURCE_COMMIT_MISMATCH');
          if(input.rows?.length!==32300) throw new Error('DATASET_ROW_COUNT_MISMATCH');
          console.log(JSON.stringify({
            input_file_sha256:process.env.EXPECTED_INPUT_FILE_SHA256,
            dataset_source_commit_sha:input.source_commit_sha,
            row_count:input.rows.length,
            expected_canonical_dataset_sha256:process.env.EXPECTED_DATASET_SHA256,
            target_definition:process.env.EXPECTED_TARGET_DEFINITION,
            split_id:process.env.EXPECTED_SPLIT_ID,
            holdout_metrics_read:false
          }));
          NODE

      - name: Train Hurdle V2 and run inner qualification only
        run: |
          set -euo pipefail
          mkdir -p artifacts/neural-closure-hurdle-v2-inner
          node --expose-gc phase2/tools/train-neural-closure-models.mjs \
            --input artifacts/neural-closure/dataset.json \
            --output artifacts/neural-closure-hurdle-v2-inner/inner-report.json \
            --epochs 8 \
            --denseEpochs 36 \
            --minimumHoldoutTrades 100 \
            --minimumWinRatePct 55 \
            --maximumDrawdownPct 8 \
            --roundTripCostBps 30 \
            --hurdleInnerOnly \
            2>&1 | tee artifacts/neural-closure-hurdle-v2-inner/training.log

      - name: Verify actual artifact, manifest and locked-holdout provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            verifyHurdleV2Artifact,
            HURDLE_V2_CONTEXT_SCHEMA,
            HURDLE_V2_OBJECTIVE,
            HURDLE_V2_CALIBRATION_ID
          } from './phase2/core/hurdle-v2-artifact-contract.mjs';
          import {verifyOrderedTemporalRankerArtifact} from
            './phase2/core/ordered-temporal-ranker-artifact.mjs';
          import {verifyHurdleV2RuntimeBundle} from
            './phase2/core/hurdle-v2-runtime-bundle.mjs';

          const reportPath='artifacts/neural-closure-hurdle-v2-inner/inner-report.json';
          const report=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const exportStatus=report.hurdle_v2;
          if(!exportStatus?.artifact_path) throw new Error('HURDLE_V2_ARTIFACT_NOT_EXPORTED');
          const reportedRuntimeBundle=exportStatus.runtime_dependency_bundle;
          if(reportedRuntimeBundle?.status!=='EXPORTED_AND_FRESH_PROCESS_COMPOSITION_VERIFIED')
            throw new Error('HURDLE_V2_COMPLETE_RUNTIME_BUNDLE_NOT_FRESH_PROCESS_VERIFIED');
          if(reportedRuntimeBundle?.dependency_count!==5)
            throw new Error('HURDLE_V2_RUNTIME_DEPENDENCY_COUNT_MISMATCH');
          const compositionProbe=reportedRuntimeBundle.fresh_process_probe;
          if(compositionProbe?.status!=='FRESH_PROCESS_COMPOSITION_PROBE_PASSED'||
             compositionProbe?.outer_validation_opened!==false||
             compositionProbe?.holdout_opened!==false||
             compositionProbe?.labels_read!==0||
             compositionProbe?.real_order_execution!==false||
             compositionProbe?.paper_trading!==true)
            throw new Error('HURDLE_V2_RUNTIME_COMPOSITION_PROBE_OR_RESEARCH_BOUNDARY_FAILED');
          const artifactPath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/HURDLE_V2.json';
          const manifestPath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/HURDLE_V2.manifest.json';
          if(!fs.existsSync(artifactPath)||!fs.existsSync(manifestPath))
            throw new Error('HURDLE_V2_ARTIFACT_OR_MANIFEST_MISSING');
          const artifact=JSON.parse(fs.readFileSync(artifactPath,'utf8'));
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const result=verifyHurdleV2Artifact(artifact);
          if(!result.valid) throw new Error('HURDLE_V2_ARTIFACT_INVALID:'+result.reason);
          const rankerPath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/TCN_LSTM_ORDERED_RANKER.json';
          const rankerManifestPath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/TCN_LSTM_ORDERED_RANKER.manifest.json';
          if(!fs.existsSync(rankerPath)||!fs.existsSync(rankerManifestPath))
            throw new Error('HURDLE_V2_ORDERED_RANKER_ARTIFACT_OR_MANIFEST_MISSING');
          const rankerArtifact=JSON.parse(fs.readFileSync(rankerPath,'utf8'));
          const rankerManifest=JSON.parse(fs.readFileSync(rankerManifestPath,'utf8'));
          const rankerVerification=verifyOrderedTemporalRankerArtifact(rankerArtifact);
          if(!rankerVerification.valid)
            throw new Error('ORDERED_RANKER_ARTIFACT_INVALID:'+rankerVerification.reason);
          const runtimeBundlePath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/HURDLE_V2_RUNTIME_BUNDLE.json';
          const runtimeManifestPath='artifacts/neural-closure-hurdle-v2-inner/model-artifacts/HURDLE_V2_RUNTIME_BUNDLE.manifest.json';
          const runtimeBundleExists=fs.existsSync(runtimeBundlePath);
          const runtimeManifestExists=fs.existsSync(runtimeManifestPath);
          const runtimeBundle=runtimeBundleExists
            ?JSON.parse(fs.readFileSync(runtimeBundlePath,'utf8')):null;
          const runtimeManifest=runtimeManifestExists
            ?JSON.parse(fs.readFileSync(runtimeManifestPath,'utf8')):null;
          const runtimeExport=exportStatus.runtime_dependency_bundle??null;
          const runtimeProbe=runtimeExport?.fresh_process_probe??null;
          const runtimeVerification=runtimeBundle
            ?verifyHurdleV2RuntimeBundle(runtimeBundle,{
                rankerArtifact,hurdleArtifact:artifact
              })
            :{valid:false,reason:'RUNTIME_BUNDLE_FILE_MISSING'};
          const runtimeParity=runtimeProbe?.parity_max_abs_error??{};
          const runtimeParityPassed=Object.keys(runtimeParity).length===5&&
            Object.values(runtimeParity).every(value=>
              Number.isFinite(Number(value))&&Number(value)<=1e-8);
          const failures=[];
          if(!runtimeBundleExists||!runtimeManifestExists)
            failures.push('RUNTIME_DEPENDENCY_BUNDLE_OR_MANIFEST_MISSING');
          if(!runtimeVerification.valid)
            failures.push('RUNTIME_DEPENDENCY_BUNDLE_INVALID:'+runtimeVerification.reason);
          if(runtimeExport?.status!=='EXPORTED_AND_FRESH_PROCESS_COMPOSITION_VERIFIED')
            failures.push('FRESH_PROCESS_COMPOSITION_NOT_VERIFIED');
          if(runtimeManifest&&runtimeBundle&&
            JSON.stringify(runtimeManifest)!==JSON.stringify(runtimeBundle.artifact_manifest))
            failures.push('RUNTIME_MANIFEST_DISK_MISMATCH');
          if(runtimeExport?.artifact_content_hash!==runtimeBundle?.artifact_content_hash||
            runtimeExport?.artifact_manifest_hash!==runtimeBundle?.artifact_manifest_hash)
            failures.push('RUNTIME_EXPORT_HASH_MISMATCH');
          if(runtimeExport?.dependency_count!==5||runtimeVerification.dependency_count!==5)
            failures.push('RUNTIME_DEPENDENCY_COUNT_MISMATCH');
          if(runtimeProbe?.status!=='FRESH_PROCESS_COMPOSITION_PROBE_PASSED'||
            runtimeProbe?.labels_read!==0||runtimeProbe?.outer_validation_rows_read!==0||
            runtimeProbe?.holdout_rows_read!==0||runtimeProbe?.outer_validation_opened!==false||
            runtimeProbe?.holdout_opened!==false||runtimeProbe?.real_order_execution!==false||
            runtimeProbe?.paper_trading!==true||!runtimeParityPassed)
            failures.push('RUNTIME_FRESH_PROCESS_PROBE_BOUNDARY_OR_PARITY_FAILED');
          if(artifact.code_commit_sha!==process.env.GITHUB_SHA) failures.push('CODE_SHA_MISMATCH');
          if(artifact.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256) failures.push('DATASET_SHA_MISMATCH');
          if(artifact.input_file_sha256!==process.env.EXPECTED_INPUT_FILE_SHA256) failures.push('INPUT_FILE_SHA_MISMATCH');
          if(artifact.dataset_source_commit_sha!==process.env.EXPECTED_DATASET_SOURCE_COMMIT) failures.push('DATASET_SOURCE_COMMIT_MISMATCH');
          if(artifact.dataset_row_count!==32300) failures.push('ROW_COUNT_MISMATCH');
          if(artifact.target_definition!==process.env.EXPECTED_TARGET_DEFINITION) failures.push('TARGET_DEFINITION_MISMATCH');
          if(artifact.target_semantics!==process.env.EXPECTED_TARGET_SEMANTICS) failures.push('TARGET_SEMANTICS_MISMATCH');
          if(artifact.split_id!==process.env.EXPECTED_SPLIT_ID) failures.push('SPLIT_ID_MISMATCH');
          if(artifact.objective_id!==HURDLE_V2_OBJECTIVE) failures.push('OBJECTIVE_MISMATCH');
          if(artifact.calibration_id!==HURDLE_V2_CALIBRATION_ID) failures.push('CALIBRATION_MISMATCH');
          if(artifact.input_contract?.contextual?.feature_schema_id!==HURDLE_V2_CONTEXT_SCHEMA) failures.push('CONTEXTUAL_SCHEMA_MISMATCH');
          if(artifact.contextual_head_present!==true||artifact.pooled_head_present!==true) failures.push('DUAL_HEAD_MISSING');
          if(artifact.upstream_ordered_ranker_dependency?.artifact_content_hash!==rankerVerification.content_hash||
             artifact.upstream_ordered_ranker_dependency?.artifact_manifest_hash!==rankerVerification.manifest_hash)
            failures.push('ORDERED_RANKER_DEPENDENCY_HASH_MISMATCH');
          if(artifact.upstream_ordered_ranker_dependency?.code_commit_sha!==artifact.code_commit_sha||
             artifact.upstream_ordered_ranker_dependency?.dataset_sha256!==artifact.dataset_sha256||
             artifact.upstream_ordered_ranker_dependency?.feature_count!==696)
            failures.push('ORDERED_RANKER_DEPENDENCY_PROVENANCE_MISMATCH');
          if(rankerArtifact.code_commit_sha!==process.env.GITHUB_SHA||
             rankerArtifact.dataset_sha256!==process.env.EXPECTED_DATASET_SHA256||
             rankerArtifact.input_file_sha256!==process.env.EXPECTED_INPUT_FILE_SHA256||
             rankerArtifact.feature_count!==696||rankerArtifact.representation!=='RAW_ORDERED_696_V1')
            failures.push('ORDERED_RANKER_IDENTITY_MISMATCH');
          if(rankerManifest.artifact_content_hash!==rankerVerification.content_hash||
             rankerManifest.artifact_content_hash!==rankerArtifact.artifact_content_hash)
            failures.push('ORDERED_RANKER_MANIFEST_MISMATCH');
          if(report.ordered_temporal_ranker?.status!=='EXPORTED_AND_DISK_RELOAD_VERIFIED')
            failures.push('ORDERED_RANKER_EXPORT_OR_RELOAD_NOT_VERIFIED');
          if(artifact.contextual_head_parameters?.weights?.length!==44) failures.push('CONTEXTUAL_HEAD_WIDTH_MISMATCH');
          if(artifact.pooled_head_parameters?.weights?.length!==8) failures.push('POOLED_HEAD_WIDTH_MISMATCH');
          if(artifact.cost_model_id!=='FIXED_LINEAR_ROUND_TRIP_BPS_V1'||artifact.round_trip_cost_bps!==30) failures.push('COST_MISMATCH');
          if(artifact.holdout_status!=='LOCKED'||artifact.split_definition?.holdout_scored_rows!==0) failures.push('HOLDOUT_LOCK_BROKEN');
          if(report.holdout?.opened!==false||report.holdout?.metrics_read!==false||
             report.holdout?.predictions_generated!==false||
             report.holdout?.rows_included_in_scored_predictions!==0) failures.push('REPORT_HOLDOUT_LOCK_BROKEN');
          if(report.outer_validation_replay_started!==false||report.holdout_values_used!==false) failures.push('INNER_ONLY_BOUNDARY_BROKEN');
          if(artifact.paper_trading!==true||artifact.real_order_execution!==false) failures.push('EXECUTION_POLICY_MISMATCH');
          if(manifest.artifact_content_hash!==artifact.artifact_content_hash) failures.push('MANIFEST_CONTENT_HASH_MISMATCH');
          if(manifest.artifact_content_hash!==result.content_hash||
             artifact.artifact_manifest_hash!==result.manifest_hash) failures.push('HASH_VERIFICATION_MISMATCH');
          if(failures.length) throw new Error('HURDLE_V2_POST_TRAIN_VERIFICATION_FAILED:'+failures.join(','));
          console.log(JSON.stringify({
            status:report.status,
            qualification_status:artifact.scientific_qualification_status,
            execution_qualification_status:artifact.execution_qualification_status,
            promotion_status:artifact.promotion_status,
            artifact_path:artifactPath,
            manifest_path:manifestPath,
            artifact_content_hash:result.content_hash,
            manifest_hash:result.manifest_hash,
            ordered_ranker_content_hash:rankerVerification.content_hash,
            ordered_ranker_manifest_hash:rankerVerification.manifest_hash,
            ordered_ranker_feature_count:rankerArtifact.feature_count,
            contextual_head_features:artifact.contextual_head_parameters.weights.length,
            pooled_head_features:artifact.pooled_head_parameters.weights.length,
            fresh_process_reload_verified:exportStatus.fresh_process_reload_verified,
            runtime_bundle_content_hash:runtimeBundle.artifact_content_hash,
            runtime_bundle_manifest_hash:runtimeBundle.artifact_manifest_hash,
            runtime_dependency_count:runtimeVerification.dependency_count,
            runtime_fresh_process_probe:runtimeProbe.status,
            runtime_probe_parity_max_abs_error:runtimeParity,
            dataset_sha256:artifact.dataset_sha256,
            code_commit_sha:artifact.code_commit_sha,
            holdout_status:artifact.holdout_status,
            holdout_metrics_read:false,
            paper_trading:artifact.paper_trading,
            real_order_execution:artifact.real_order_execution,
            inner_qualification:artifact.inner_qualification
          },null,2));
          NODE

      - name: Upload Hurdle V2 artifact and inner-only research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-build224-hurdle-v2-inner-${{ github.sha }}
          path: artifacts/neural-closure-hurdle-v2-inner/
          if-no-files-found: warn
          retention-days: 30
