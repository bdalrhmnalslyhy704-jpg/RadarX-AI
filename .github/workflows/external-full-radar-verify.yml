name: External Full Radar Verify
on:
  push:
    branches:
      - external-full-radar-verify-20261006
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify legacy radar routes and Radar8 on Triple
        run: |
          set -euo pipefail
          BASE='https://radarx-ai-triple-production.up.railway.app'
          for p in             '/healthz'             '/api/radar-status'             '/api/move-radar?limit=1'             '/api/strong-move-radar?limit=1'             '/api/rotation-lag-radar?limit=1'             '/api/liquidity-absorption-radar?limit=1'             '/api/kahir-radar?limit=1&scan=0'             '/api/doomsday-radar?limit=1&scan=0'             '/api/professor-radar?limit=1&scan=0'             '/api/almuqawim-radar?limit=1&scan=0'             '/api/early-expansion-radar?quote=USDT&limit=1'; do
            code="$(curl -sS -L --max-time 45 -o /tmp/r.json -w '%{http_code}' "$BASE$p")"
            echo "$code $p"
            case "$code" in 200|503) ;; *) echo "::error::Unexpected HTTP $code for $p"; cat /tmp/r.json; exit 1 ;; esac
          done
      - name: Verify critical contracts
        run: |
          set -euo pipefail
          BASE='https://radarx-ai-triple-production.up.railway.app'
          curl --fail --silent --show-error --max-time 45 "$BASE/api/almuqawim-radar?limit=1&scan=0" -o /tmp/muq.json
          curl --fail --silent --show-error --max-time 45 "$BASE/api/early-expansion-radar?quote=USDT&limit=1" -o /tmp/r8.json
          node <<'NODE'
          const fs=require('fs');
          const mu=JSON.parse(fs.readFileSync('/tmp/muq.json','utf8'));
          const r8=JSON.parse(fs.readFileSync('/tmp/r8.json','utf8'));
          if (!['ALMUQAWIM_RADAR'].includes(mu.meta?.radar)) throw new Error('ALMUQAWIM_ROUTE_CONTRACT_FAILED');
          if (r8.schema_version!=='RADAR8_V2') throw new Error('RADAR8_SCHEMA_FAILED');
          if (r8.meta?.paper_trading!==true || r8.meta?.real_order_execution!==false || r8.meta?.confidence_score!=='UNKNOWN') throw new Error('RADAR8_POLICY_FAILED');
          console.log(JSON.stringify({almuqawim:mu.meta?.radar,radar8:r8.schema_version,radar8Live:r8.meta?.live,coverage:r8.universe},null,2));
          NODE
