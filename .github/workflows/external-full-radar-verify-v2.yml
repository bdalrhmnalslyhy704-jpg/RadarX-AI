name: External Full Radar Verify V2
on:
  push:
    branches:
      - external-full-radar-verify-20261006-v2
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify routes on Triple
        run: |
          set -euo pipefail
          BASE='https://radarx-ai-triple-production.up.railway.app'
          for p in             '/healthz'             '/api/radar-status'             '/api/move-radar?limit=1'             '/api/strong-move-radar?limit=1'             '/api/rotation-lag-radar?limit=1'             '/api/rotation-radar?limit=1'             '/api/liquidity-absorption-radar?limit=1'             '/api/kahir-radar?limit=1&scan=0'             '/api/doomsday-radar?limit=1&scan=0'             '/api/professor-radar?limit=1&scan=0'             '/api/almuqawim-radar?limit=1&scan=0'             '/api/early-expansion-radar?quote=USDT&limit=1'; do
            code="$(curl -sS -L --max-time 60 -o /tmp/r.json -w '%{http_code}' "$BASE$p")"
            echo "$code $p"
            case "$code" in 200|503) ;; *) echo "::error::Unexpected HTTP $code for $p"; cat /tmp/r.json; exit 1 ;; esac
          done
      - name: Verify critical contracts
        run: |
          set -euo pipefail
          BASE='https://radarx-ai-triple-production.up.railway.app'
          curl --fail --silent --show-error --max-time 60 "$BASE/api/radar-status" -o /tmp/status.json
          curl --fail --silent --show-error --max-time 60 "$BASE/api/almuqawim-radar?limit=1&scan=0" -o /tmp/muq.json
          curl --fail --silent --show-error --max-time 60 "$BASE/api/early-expansion-radar?quote=USDT&limit=1" -o /tmp/r8.json
          node <<'NODE'
          const fs=require('fs');
          const st=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          const mu=JSON.parse(fs.readFileSync('/tmp/muq.json','utf8'));
          const r8=JSON.parse(fs.readFileSync('/tmp/r8.json','utf8'));
          const required=['EARLY_MOVE_RADAR','STRONG_MOVE_RADAR','ROTATION_LAG_RADAR','LIQUIDITY_ABSORPTION_RADAR','KAHIR_RADAR','DOOMSDAY_RADAR','ALMUQAWIM_RADAR','EARLY_EXPANSION_RADAR'];
          const ids=(st.radars||[]).map(x=>x.radar);
          for(const id of required) if(!ids.includes(id)) throw new Error('MISSING_RADAR:'+id);
          if(mu.meta?.radar!=='ALMUQAWIM_RADAR') throw new Error('ALMUQAWIM_CONTRACT_FAILED');
          if(r8.schema_version!=='RADAR8_V2') throw new Error('RADAR8_SCHEMA_FAILED');
          if(r8.meta?.paper_trading!==true || r8.meta?.real_order_execution!==false || r8.meta?.confidence_score!=='UNKNOWN') throw new Error('RADAR8_POLICY_FAILED');
          console.log(JSON.stringify({radar_count:st.radars?.length,radar_ids:ids,almuqawim:mu.meta?.radar,radar8:r8.schema_version,radar8Live:r8.meta?.live,coverage:r8.universe},null,2));
          NODE
