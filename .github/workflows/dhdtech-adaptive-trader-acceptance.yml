name: Build 224 DHDTech Adaptive Trader Live Acceptance

on:
  push:
    branches:
      - build224-multi-analyst-20261007
    paths:
      - "Dockerfile"
      - "phase2/**"
      - "android/**"
      - ".github/workflows/dhdtech-adaptive-trader-acceptance.yml"
      - ".github/workflows/android-release-apk.yml"
      - ".github/workflows/build224-container-runtime-smoke.yml"
      - ".github/workflows/pre-move-radar-acceptance.yml"

permissions:
  contents: read
  statuses: write

jobs:
  verify-dhdtech:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the deployed DHDTech worker to complete a verified live scan
        uses: actions/github-script@v7
        env:
          RADARX_BACKEND_BASE_URL: ${{ vars.RADARX_BACKEND_BASE_URL || 'https://radarx-backend.dhdtech.site' }}
        with:
          script: |
            const base=String(process.env.RADARX_BACKEND_BASE_URL||'').trim();
            let url;
            try { url=new URL(base); } catch { core.setFailed('RADARX_BACKEND_BASE_URL is not a valid URL.'); return; }
            if(url.protocol!=='https:'||url.pathname!=='/'||url.username||url.password||url.search||url.hash||/\.up\.railway\.app$/i.test(url.hostname)){
              core.setFailed('RADARX_BACKEND_BASE_URL must be the bare HTTPS DHDTech origin.');
              return;
            }

            const started=Date.now();
            const deadline=started+12*60*1000;
            const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            let lastError='No status response yet';
            let lastObserved=null;
            while(Date.now()<deadline){
              try{
                const [response,deploymentResponse]=await Promise.all([
                  fetch(url.origin+'/api/adaptive-trader/status',{
                    headers:{Accept:'application/json', 'Cache-Control':'no-cache'},
                    signal:AbortSignal.timeout(8000)
                  }),
                  fetch(url.origin+'/api/deployment-info',{
                    headers:{Accept:'application/json', 'Cache-Control':'no-cache'},
                    signal:AbortSignal.timeout(8000)
                  })
                ]);
                const [value,deployment]=await Promise.all([response.json(),deploymentResponse.json()]);
                const summary=value.last_summary;
                const meta=summary&&summary.meta;
                const scannedAt=Date.parse(String(value.last_scan_at||''));
                const summaryAt=Date.parse(String(summary&&summary.as_of||''));
                const historyRows=Number(value.memory&&value.memory.history_rows)||0;
                const learning=value.learning_profile||null;
                const capture=value.learning_capture||null;
                const cognitive=(summary&&summary.cognitive_brain)||
                  (value&&value.cognitive_brain)||null;
                const cognitiveProfile=cognitive&&cognitive.profile?cognitive.profile:cognitive||{};
                const cognitiveCapture=cognitive&&cognitive.capture||{};
                const universe=summary&&summary.universe||{};
                const workerContract=value.scanner_contract==='SERVER_DRIVEN_SCAN_V2';
                const systemHealthy=deploymentResponse.ok&&deployment.build_version==='Build 224'&&
                  deployment.expected_radars===12&&deployment.registered_radars===12&&
                  deployment.pre_move_scanner_ready===true&&
                  deployment.analyst_system&&deployment.analyst_system.expected_analysts===20&&
                  deployment.analyst_system.engine_configured===true&&
                  deployment.analyst_system.review_bridge_installed===true&&
                  deployment.paper_trading===true&&deployment.real_order_execution===false;
                const candidates=summary&&summary.candidates;
                const prices=summary&&summary.latest_prices;
                const push=deployment.push&&typeof deployment.push==='object'?deployment.push:{};
                lastObserved={
                  http:response.status,status:value.status,scan_count:value.scan_count,
                  successful_scans:value.successful_scans,last_error:value.last_error,
                  radars:deployment.registered_radars,analysts:deployment.analyst_system&&deployment.analyst_system.expected_analysts,
                  system_healthy:systemHealthy,worker_contract:value.scanner_contract||null,
                  last_scan_at:value.last_scan_at,history_rows:historyRows,
                  candidates:Array.isArray(candidates)?candidates.length:null,
                  latest_prices:Array.isArray(prices)?prices.length:null,
                  push:{provider:String(push.provider||'unknown'),enabled:push.enabled===true,
                    active_subscriptions:Number(push.active_subscriptions)||0,
                    provider_subscriptions:Number(push.provider_subscriptions)||0,
                    fcm_devices:Number(push.fcm_devices)||0,
                    webpush_subscriptions:Number(push.webpush_subscriptions)||0,
                    physical_device_delivery_verified:push.physical_device_delivery_verified===true},
                  historical_samples_available:Number(universe.historical_training_samples_available)||0,
                  learning_profile:learning?{
                    resolved_samples:Number(learning.resolved_samples)||0,
                    required_samples:Number(learning.required_samples)||60,
                    ready:learning.ready===true,
                    historical_samples:Number(learning.historical_samples)||0
                  }:null,
                  learning_capture:capture?{
                    historical_input_samples:Number(capture.historical_input_samples)||0,
                    new_historical_samples:Number(capture.new_historical_samples)||0,
                    historical_rejected:capture.historical_rejected||{},
                    snapshot_historical_samples_available:Number(capture.snapshot_historical_samples_available)||0,
                    snapshot_closed_candle_outcomes_input:Number(capture.snapshot_closed_candle_outcomes_input)||0,
                    new_deep_candidate_samples:Number(capture.new_deep_candidate_samples)||0,
                    resolved_samples:Number(capture.resolved_samples)||0,
                    unresolved_training_samples:Number(capture.unresolved_training_samples)||0
                  }:null,
                  cognitive_brain:cognitive?{
                    method:String(cognitiveProfile.method||cognitive.method||'unknown'),
                    ranking_ready:cognitiveProfile.ranking_ready===true,
                    probability_ready:cognitiveProfile.probability_ready===true,
                    resolved_samples:Number(cognitiveProfile.resolved_samples)||0,
                    training_samples:Number(cognitiveProfile.training_samples)||0,
                    holdout_samples:Number(cognitiveProfile.holdout_samples)||0,
                    journal_records:Number(cognitive.journal_records??cognitive.journal_rows)||0,
                    journal_resolved:Number(cognitiveCapture.journal_resolved??cognitive.resolved_journal_rows)||0,
                    early_setup_reviews:Number(cognitiveCapture.early_setup_reviews)||0
                  }:null
                };
                const valid=response.ok&&systemHealthy&&workerContract&&value.paper_trading===true&&value.real_order_execution===false&&
                  Number(value.successful_scans)>0&&value.last_error===null&&
                  Number.isFinite(scannedAt)&&scannedAt>=started&&
                  summary&&summary.status==='LIVE_DATA'&&Number.isFinite(summaryAt)&&
                  summaryAt>=started&&meta&&meta.live===true&&
                  meta.paper_trading===true&&meta.real_order_execution===false&&
                  meta.closed_candles_only===true&&meta.engine==='ADAPTIVE_TRADER_SIDECAR_V1'&&
                  Array.isArray(candidates)&&candidates.length>0&&
                  Array.isArray(prices)&&prices.length>0&&historyRows>0&&
                  cognitive&&
                  cognitiveProfile.method==='BAYESIAN_FACTOR_EVIDENCE_WITH_CHRONOLOGICAL_HOLDOUT_V1'&&
                  Number(cognitiveProfile.resolved_samples)>=0&&
                  Number(cognitiveProfile.training_samples)>=0&&
                  Number(cognitiveProfile.holdout_samples)>=0;
                if(valid){
                  const description='Live DHDTech scan verified; '+candidates.length+' analyzed, '+historyRows+' history rows.';
                  await github.rest.repos.createCommitStatus({
                    owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
                    state:'success',context:'dhdtech-adaptive-trader-live',
                    description:description.slice(0,140),target_url:url.origin+'/api/adaptive-trader/status'
                  });
                  core.info('DHDTECH_ADAPTIVE_TRADER_LIVE_OK '+JSON.stringify(lastObserved));
                  return;
                }
                lastError='Live worker schema or scan evidence is not ready';
              }catch(error){
                lastError=String(error&&error.message||error).slice(0,180);
              }
              core.info('Waiting for the deployed DHDTech worker: '+lastError+
                (lastObserved?' | '+JSON.stringify(lastObserved):''));
              await delay(15000);
            }

            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:'failure',context:'dhdtech-adaptive-trader-live',
              description:('DHDTech live scan not verified: '+lastError).slice(0,140),
              target_url:url.origin+'/api/adaptive-trader/status'
            });
            core.setFailed('DHDTech Adaptive Trader live acceptance failed: '+lastError+
              (lastObserved?' | '+JSON.stringify(lastObserved):''));
