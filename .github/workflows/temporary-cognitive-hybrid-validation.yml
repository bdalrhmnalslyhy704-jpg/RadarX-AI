name: Temporary Cognitive Hybrid Nested Validation

on:
  push:
    branches:
      - verify/cognitive-hybrid-nested-calibration-20261109

permissions:
  contents: read

jobs:
  test-cognitive-and-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check changed research engines
        run: |
          node --check phase2/core/cognitive-brain.mjs
          node --check phase2/core/temporal-neural-brain.mjs
      - name: Test cognitive neural, GBDT and hybrid challengers
        run: node --test --test-timeout=120000 phase2/tests/cognitive-brain.test.mjs
      - name: Test temporal TCN and first-passage tree challengers
        run: node --test --test-timeout=120000 phase2/tests/temporal-neural-brain.test.mjs
      - name: Run complete phase-two regression suite
        run: node phase2/tests/run-tests.mjs phase2
