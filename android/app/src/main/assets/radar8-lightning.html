<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Radar 8 — البرق</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#142d47 0,#071018 48%,#05090e 100%);color:#e8f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(980px,100%);margin:auto;padding:18px 14px 30px}
header{position:sticky;top:0;z-index:5;margin:-18px -14px 14px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:rgba(5,12,19,.92);backdrop-filter:blur(14px);border-bottom:1px solid #244866}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#35c9ff,#8a68ff);color:#06111a;font-weight:1000}.brand b{display:block;font-size:18px}.brand small{display:block;color:#8fa8bc;font-size:11px;margin-top:2px}
.state{border:1px solid #27526c;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,#0c1a28,#09121b);border:1px solid #23445d;border-radius:17px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}.wide{grid-column:1/-1}
.metric b{font-size:20px}.metric small{display:block;color:#8fa8bc;font-size:10px;margin-top:3px}.muted{color:#8fa8bc}.ok{color:#66e6b0}.warn{color:#ffd27a}.bad{color:#ff8794}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;border:1px solid #2a536b;border-radius:12px;background:#0a1822;color:#e7f8ff;font-weight:900;padding:0 14px}.btn.primary{background:linear-gradient(135deg,#35c9ff,#756dff);color:#06111a;border:0}.btn.stop{background:#32151b;border-color:#6f313d}.btn:disabled{opacity:.55}
.rows{display:grid;gap:9px}.coin{border:1px solid #24445d;border-radius:15px;padding:12px;background:#09141e}.coin-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.coin-top b{font-size:15px}.score{font-weight:1000}.pill{font-size:9px;border:1px solid #33566b;border-radius:999px;padding:4px 7px;color:#bfe6f6}.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}.mini div{padding:8px;border-radius:11px;background:#0b1a25}.mini b{display:block;font-size:11px}.mini small{display:block;color:#819caf;font-size:9px;margin-top:2px}.reason{margin-top:9px;color:#b5d3df;font-size:10px;line-height:1.7}.shock{margin-top:8px;padding:9px;border:1px solid #88652b;background:#23190a;color:#ffe0a0;border-radius:11px;font-size:10px;line-height:1.8}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.empty{padding:25px;text-align:center;color:#8ea6b7;border:1px dashed #29475a;border-radius:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<header><div class="top"><div class="brand"><div class="logo">⚡</div><div><b>Radar 8 — البرق</b><small>Early Expansion • Spot USDT • Paper Only</small></div></div><div id="state" class="state">جارٍ الاتصال…</div></div></header>

<section class="grid">
<div class="card metric"><small>سوق Spot USDT</small><b id="universe">—</b><span class="muted">زوجًا مراقبًا</span></div>
<div class="card metric"><small>المؤهل الآن</small><b id="eligible">—</b><span class="muted">مرشحًا</span></div>
<div class="card metric"><small>Micro Scan</small><b id="micro">—</b><span class="muted">من الدورة الأخيرة</span></div>
<div class="card metric"><small>Deep Scan</small><b id="deep">—</b><span class="muted">تأكيدًا عميقًا</span></div>
<div class="card wide">
  <div class="actions">
    <button id="start" class="btn primary">تشغيل البرق</button>
    <button id="stop" class="btn stop">إيقاف البرق</button>
    <button id="scan" class="btn">فحص الآن</button>
  </div>
  <div id="updated" class="muted" style="font-size:10px;margin-top:9px">آخر تحديث: —</div>
  <div id="error" class="bad" style="font-size:10px;margin-top:5px"></div>
</div>

<div class="card wide">
  <div class="coin-top"><b>أقوى بصمات ما قبل الحركة</b><span class="pill">V2</span></div>
  <div id="candidates" class="rows" style="margin-top:10px"><div class="empty">لم تصل بيانات بعد.</div></div>
</div>
</section>
</main>

<script type="module">
const BASE='https://radarx-ai-triple-production.up.railway.app';
const $=id=>document.getElementById(id);
let timer=null;
let busy=false;
let pageDead=false;
const activeControllers=new Set();
function disposePage(){pageDead=true;if(timer)clearInterval(timer);for(const ctl of activeControllers){try{ctl.abort();}catch(e){}}activeControllers.clear();}

function esc(v){return String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function fmt(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—';}
function fmtKnown(v,d=2){return v===null||v===undefined||v===''?'—':fmt(v,d);}
function fmtPct(v){const n=Number(v);return Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(2)+'%':'—';}
function timeText(iso){try{return new Intl.DateTimeFormat('ar-YE',{timeZone:'Asia/Aden',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date(iso));}catch{return iso||'—';}}

async function req(path,timeout=70000,attempts=3){
  if(pageDead)throw new Error('PAGE_DESTROYED');
  const retryable=new Set([408,425,429,500,502,503,504]);
  let lastError='',lastResponse=null;
  const count=Math.max(1,Math.min(3,Math.trunc(Number(attempts)||1)));
  const perAttempt=Math.max(1000,Math.floor(Number(timeout||70000)/count));
  for(let attempt=0;attempt<count;attempt++){
    if(pageDead)throw new Error('PAGE_DESTROYED');
    const ctl=new AbortController();
    activeControllers.add(ctl);
    const t=setTimeout(()=>ctl.abort(),perAttempt);
    try{
      const r=await fetch(BASE+path,{cache:'no-store',headers:{Accept:'application/json'},signal:ctl.signal});
      const body=await r.json().catch(()=>null);
      lastResponse={ok:r.ok,status:r.status,body,base:BASE};
      if(r.ok||!retryable.has(r.status))return lastResponse;
      lastError='HTTP_'+r.status+(body&&body.error?':'+String(body.error):'');
    }catch(e){
      if(pageDead)throw new Error('PAGE_DESTROYED');
      lastError=String(e&&e.name==='AbortError'?'REQUEST_TIMEOUT':e&&e.message||e||'BACKEND_CONNECTION_FAILED');
      lastResponse=null;
    }finally{
      clearTimeout(t);
      activeControllers.delete(ctl);
    }
    if(attempt<count-1)await new Promise(resolve=>setTimeout(resolve,attempt===0?650:1300));
  }
  if(lastResponse)return lastResponse;
  throw new Error(lastError||'BACKEND_CONNECTION_FAILED');
}

function fmtCount(v){if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)?String(n):'—';}
function firstError(data){
  const m=data&&data.monitoring||{},s=data&&data.scan||{};
  return [data&&data.error,s.error,m.last_error].find(x=>x!==null&&x!==undefined&&String(x).trim()!=='')||'';
}
function render(data){
  const u=data&&data.universe||{},m=data&&data.monitoring||{};
  $('universe').textContent=fmtCount(u.expected_total??m.universe_total);
  $('eligible').textContent=fmtCount(u.eligible_total);
  $('micro').textContent=fmtCount(m.micro_scanned_total??u.micro_scanned_total);
  $('deep').textContent=fmtCount(u.deep_scanned_total);
  const live=m.running===true;
  const completed=Number(m.scans||0)>0&&m.last_error==null&&data.status!=='not_ready';
  $('state').textContent=live?(completed?'LIVE • البرق يعمل':'متصل • يجهز دورة الفحص'):'البرق غير مؤكد التشغيل';
  $('state').className='state '+(live&&completed?'ok':live?'warn':'bad');
  const coverage=Number.isFinite(Number(u.coverage_ratio))?Math.round(Number(u.coverage_ratio)*100)+'%':'—';
  $('updated').textContent='آخر تحديث: '+timeText(data&&data.as_of)+' • تغطية السوق: '+coverage+
    ' • وصل '+fmtCount(u.received_total)+'/'+fmtCount(u.expected_total);
  const error=firstError(data);
  $('error').textContent=error?'تنبيه الخدمة: '+esc(error):'';
  const arr=Array.isArray(data&&data.candidates)?data.candidates:[];
  if(!arr.length){
    const message=!live
      ?'لم يؤكد الخادم أن رادار البرق يعمل. افحص رسالة الحالة أعلاه وأعد المحاولة.'
      :!completed
        ?'البرق متصل لكنه لم يكمل دورة فحص ناجحة بعد؛ انتظر تحديث الحالة أو اضغط «فحص الآن».'
        :'اكتملت دورة الفحص، لكن لم تظهر بصمة عميقة تجتاز شروط العرض الحالية. لن نعرض عملات وهمية.';
    $('candidates').innerHTML='<div class="empty">'+esc(message)+'</div>';
    return;
  }
  $('candidates').innerHTML=arr.slice(0,20).map(c=>{
    const fp=c.micro_fingerprint||{};
    const met=fp.metrics||{};
    const reasons=[...(fp.reasons||[]),...(c.reason_codes||[])].slice(0,8);
    const risk=[...(fp.risk_flags||[]),...(c.risk_flags||[])].slice(0,5);
    const shock=c.activity_shock||fp.activity_shock||{};
    const sm=shock.metrics||{};
    const shockCard=shock.detected===true?'<div class="shock"><b>⚡ رصد صدمة — مراقبة فقط</b> • '+esc(shock.stage||'ACTIVITY_SHOCK')+'<br>الحجم '+fmtKnown(sm.volume_shock_ratio,1)+'x • عدد الصفقات '+fmtKnown(sm.trade_shock_ratio,1)+'x • Taker Buy '+fmtKnown(sm.taker_buy_ratio===null||sm.taker_buy_ratio===undefined?null:Number(sm.taker_buy_ratio)*100,1)+'%<br>'+(shock.extended?'الحركة ممتدة — لا تطارد السعر.':'تأكدت من شمعة مغلقة؛ هذه ليست إشارة دخول.')+'</div>':'';
    return '<article class="coin">'+
      '<div class="coin-top"><b>'+esc(c.symbol)+'</b><span class="score">'+fmt(c.early_expansion_score,1)+'</span></div>'+
      '<div class="meta"><span class="pill">'+esc(c.decision_band||'—')+'</span><span class="pill">'+esc(fp.mode||'—')+'</span><span class="pill">Micro '+fmt(fp.score,1)+'</span><span class="pill">'+esc(String(fp.confirmation_count||0))+'/'+esc(String(fp.confirmation_total||10))+' تأكيدات</span></div>'+
      '<div class="mini">'+
      '<div><b>'+fmt(met.rvol_1m,2)+'x</b><small>RVOL 1m</small></div>'+
      '<div><b>'+fmt(met.trade_rvol_1m,2)+'x</b><small>Trades 1m</small></div>'+
      '<div><b>'+fmt(met.bb_ratio,2)+'</b><small>BB ratio</small></div>'+
      '<div><b>'+fmt(met.atr_ratio,2)+'</b><small>ATR ratio</small></div>'+
      '<div><b>'+fmtPct(met.relative_strength_5m_pct)+'</b><small>RS vs BTC</small></div>'+
      '<div><b>'+fmt(met.higher_low_count,0)+'</b><small>HL score</small></div>'+
      '</div>'+
      shockCard+
      '<div class="reason"><b>الإشارات:</b> '+esc(reasons.join(' • ')||'—')+'</div>'+
      (risk.length?'<div class="reason bad"><b>تحذير:</b> '+esc(risk.join(' • '))+'</div>':'')+
      '</article>';
  }).join('');
}

let queuedScan=false;
async function refresh({scan=false}={}){
  if(pageDead)return;
  if(busy){if(scan)queuedScan=true;return;}
  busy=true;
  try{
    const q='/api/early-expansion-radar?quote=USDT&limit=100'+(scan?'&scan=1':'');
    const r=await req(q,scan?120000:70000,scan?1:3);
    if(!r.ok){
      $('state').textContent='تعذر جلب بيانات البرق';
      $('state').className='state bad';
      const detail=r.body&&(r.body.error||r.body.message);
      $('error').textContent=(detail?String(detail)+' • ':'')+'HTTP_'+r.status;
      return;
    }
    if(!r.body||r.body.schema_version!=='RADAR8_V2'||r.body.radar!=='EARLY_EXPANSION_RADAR'||!r.body.monitoring){
      throw new Error('RADAR8_API_CONTRACT_MISMATCH');
    }
    render(r.body);
  }catch(e){
    $('state').textContent='تعذر الاتصال بالبرق';
    $('state').className='state bad';
    $('error').textContent=String(e&&e.message||e||'BACKEND_CONNECTION_FAILED');
  }finally{
    busy=false;
    if(queuedScan&&!pageDead){
      queuedScan=false;
      setTimeout(()=>refresh({scan:true}),100);
    }
  }
}
async function control(action){
  if(pageDead)return;
  try{
    const r=await req('/api/radar-control?radar=EARLY_EXPANSION_RADAR&action='+encodeURIComponent(action),30000,3);
    const body=r.body||{};
    if(!r.ok||body.ok!==true||(action==='start'&&body.running!==true)){
      throw new Error(String(body.message||body.error||('RADAR8_CONTROL_REJECTED_HTTP_'+r.status)));
    }
    await refresh({scan:true});
  }catch(e){
    $('state').textContent='تعذر تغيير حالة البرق';
    $('state').className='state bad';
    $('error').textContent=String(e&&e.message||e||'RADAR8_CONTROL_FAILED');
  }
}

$('start').onclick=()=>control('start');
$('stop').onclick=()=>control('stop');
$('scan').onclick=()=>refresh({scan:true});
refresh();
timer=setInterval(()=>refresh(),20000);
window.addEventListener('pagehide',disposePage,{once:true,capture:true});
</script>
</body>
</html>
