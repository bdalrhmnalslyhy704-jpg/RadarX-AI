name: Full Radar Backend Verification
on:
  push:
    branches:
      - backend-full-radars-radar8v2-20261006
      - radar-quality-v2-build224-20261007
      - radar-quality-v2-1-build224-20261007
      - radarx-build224-whale-accumulation-v3-20261007
      - verify-live-whale-radar-20261007
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Syntax guards
        run: |
          set -euo pipefail
          for f in phase2/server.mjs phase2/http/api.mjs phase2/config.mjs phase2/core/store.mjs phase2/core/whale-accumulation-radar.mjs phase2/core/radar-quality-v3.mjs phase2/core/early-expansion-radar.mjs phase2/core/radar-prebreakout-engine.mjs phase2/core/radar-notification-gate.mjs phase2/core/al-muqawim-radar.mjs phase2/core/doomsday-radar.mjs phase2/core/professor-radar.mjs phase2/core/kahir-radar.mjs phase2/core/strong-move-radar.mjs phase2/core/liquidity-absorption-radar.mjs phase2/core/rotation-lag-radar.mjs phase2/core/early-move-sentinel.mjs; do node --check "$f"; done
      - name: Regression tests
        run: npm test
      - name: Route presence guard
        run: |
          set -euo pipefail
          grep -Fq "/api/radar-control" phase2/http/api.mjs
          grep -Fq "/api/radar-alerts" phase2/http/api.mjs
          grep -Fq "/api/almuqawim-radar" phase2/http/api.mjs
          grep -Fq "/api/doomsday-radar" phase2/http/api.mjs
          grep -Fq "/api/professor-radar" phase2/http/api.mjs
          grep -Fq "/api/kahir-radar" phase2/http/api.mjs
          grep -Fq "/api/early-expansion-radar" phase2/http/api.mjs
          grep -Fq "/api/whale-accumulation-radar" phase2/http/api.mjs
          grep -Fq "radar:'EARLY_EXPANSION_RADAR'" phase2/http/api.mjs
      - name: Verify Whale Accumulation public contract
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:8080"
          echo "Contract source check only; route must exist in source."
          grep -Fq "/api/whale-accumulation-radar" phase2/http/api.mjs
          grep -Fq "WHALE_ACCUMULATION_RADAR" phase2/core/whale-accumulation-radar.mjs
      - name: Live Whale Accumulation scan proof
        timeout-minutes: 6
        run: |
          set -euo pipefail
          BASE="https://radarx-ai-triple-production.up.railway.app"
          CODE="$(curl --location --silent --show-error --max-time 300 -o "$RUNNER_TEMP/live-whale.json" -w "%{http_code}" "$BASE/api/whale-accumulation-radar?limit=10&scan=1")"
          case "$CODE" in 200) ;; *) echo "::error::Live Whale Radar returned HTTP $CODE"; cat "$RUNNER_TEMP/live-whale.json"; exit 1 ;; esac
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/live-whale.json','utf8'));
          const cov=b.coverage||{};
          if (b.radar!=='WHALE_ACCUMULATION_RADAR') throw new Error('LIVE_WHALE_RADAR_INVALID');
          if (!Array.isArray(b.candidates)) throw new Error('LIVE_WHALE_CANDIDATES_MISSING');
          if (Number(cov.scanned_successfully||0)<1) throw new Error('LIVE_WHALE_NO_SUCCESSFUL_SCANS');
          if (!Number(b.scan?.completed?1:0)) throw new Error('LIVE_WHALE_SCAN_NOT_COMPLETED');
          console.log(JSON.stringify({
            candidates:b.candidates.length,
            confirmed:b.confirmed_count||0,
            universe:cov.universe_total||0,
            scanned:cov.scanned_successfully||0,
            failed:cov.failed||0,
            top:(b.candidates||[]).slice(0,5).map(x=>({symbol:x.symbol,score:x.opportunity_score,eligible:x.eligible,stage:x.potential_label}))
          },null,2));
          NODE
      - name: Paper-only guard
        run: |
          set -euo pipefail
          ! grep -RniE 'real_order_execution[=:][[:space:]]*true|paper_trading[=:][[:space:]]*false|/api/(order|withdraw)' phase2/core
