name: RadarX Android Release APK

on:
  push:
    branches:
      - android-early-wake-6.8.9
      - phase3-triple-radar
      - fix/android-no-autostart-background-latest-features-20261006
      - fix-single-page-latest-broken-20261006
      - fix/android-no-autostart-background-20261005
      - phase4-symbol-deep-scan
      - android-icon-6.8.8-release
      - tradli-feature-integration
      - premium-ui-manual-execution-safe
      - background-prebreakout-engine
      - tradli-separate-page-ui
      - tradli-connectivity-native-screen
      - bottom-reversal-radar-page
      - phase6-radar4-independent-microstructure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radarx-android-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact release-signing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name == 'phase4-symbol-deep-scan' && 'phase4-symbol-deep-scan' || github.ref_name == 'phase6-radar4-independent-microstructure' && 'phase6-radar4-independent-microstructure' || github.ref_name == 'fix/android-no-autostart-background-latest-features-20261006' && 'fix/android-no-autostart-background-latest-features-20261006' || github.ref_name == 'fix/android-no-autostart-background-20261005' && 'fix/android-no-autostart-background-20261005' || github.ref_name == 'fix-single-page-latest-broken-20261006' && 'fix-single-page-latest-broken-20261006' || 'phase3-triple-radar' }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android command-line tools 16.0
        timeout-minutes: 8
        env:
          ANDROID_CMDLINE_TOOLS_ZIP: commandlinetools-linux-12266719_latest.zip
          ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/radarx-android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            "$ANDROID_CMDLINE_TOOLS_URL" \
            --output "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

          unzip -q "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/16.0"

          if [[ ! -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            echo "::error::Pinned Android command-line tools 16.0 sdkmanager was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

          rm -f "$RUNNER_TEMP/$ANDROID_CMDLINE_TOOLS_ZIP"

      - name: Verify pinned sdkmanager
        timeout-minutes: 2
        run: |
          set -euo pipefail
          command -v sdkmanager
          SDKMANAGER_VERSION="$(sdkmanager --version | head -n 1)"
          echo "sdkmanager version: $SDKMANAGER_VERSION"
          [[ "$SDKMANAGER_VERSION" == 16.0* ]]

      - name: Install required Android SDK packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses < <(yes) >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Release signing secrets are present
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Materialize signing keystore in runner temp only
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/radarx-release.keystore"
          test -s "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Run Android dashboard release smoke checks
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node android/backend-client-regression.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-background-control.mjs
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          test -f android/app/src/main/assets/radar1-destroyer.html
          test -f android/app/src/main/assets/radar2-dark-king.html
          test -f android/app/src/main/assets/radar3-joker.html
          test -f android/app/src/main/assets/radar4-sweeper.html
          test -f android/app/src/main/assets/professor-radar.html
          test -f android/app/src/main/assets/radarx-professor-radar.mjs
          test -f android/app/src/main/assets/doomsday-radar.html
          node --check android/app/src/main/assets/radarx-doomsday-radar.mjs
          grep -q 'Radar 1 — المدمر' android/app/src/main/assets/radarx-background-control.mjs
          grep -q 'Radar 2 — ملك الظلام' android/app/src/main/assets/radarx-background-control.mjs
          grep -q 'Radar 3 — الجوكر' android/app/src/main/assets/radarx-background-control.mjs
          grep -q 'Radar 4 — الكاسح' android/app/src/main/assets/radarx-background-control.mjs
          grep -q 'radar1-destroyer.html' android/app/src/main/assets/index.html
          grep -q 'radar2-dark-king.html' android/app/src/main/assets/index.html
          grep -q 'radar3-joker.html' android/app/src/main/assets/index.html
          grep -q 'radar4-sweeper.html' android/app/src/main/assets/index.html
          grep -q 'doomsday-radar.html' android/app/src/main/assets/index.html
          grep -q 'doomsday-radar.html' android/app/src/main/assets/index.html

      - name: Validate embedded RadarX JavaScript syntax
        run: |
          set -euo pipefail
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-symbol-deep-scan.mjs
          node --check android/app/src/main/assets/radarx-king.mjs
          test -f android/app/src/main/assets/ai-agent-hub.html
          test -f android/app/src/main/assets/surge-radar.html
          test -f android/app/src/main/assets/ai-market.html
          test -f android/app/src/main/assets/ai-learning.html
          node --check android/app/src/main/assets/radarx-market-radar-ui.mjs
          node --check android/app/src/main/assets/radarx-market-radar-screen.mjs
          node --check android/app/src/main/assets/radarx-tradli-feature-suite.mjs
          test -f android/app/src/main/assets/radarx-background-control.mjs
          node --check android/app/src/main/assets/radarx-background-control.mjs
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          test -f android/app/src/main/assets/radar1-destroyer.html
          test -f android/app/src/main/assets/radar2-dark-king.html
          test -f android/app/src/main/assets/radar3-joker.html
          test -f android/app/src/main/assets/radar4-sweeper.html
          test -f android/app/src/main/assets/professor-radar.html
          node --check android/app/src/main/assets/radarx-professor-radar.mjs
          node --check android/app/src/main/assets/radarx-bottom-reversal.mjs
          node --check phase2/core/doomsday-radar.mjs
          node --check phase2/core/market-surge-gate.mjs
          node --check phase2/core/kahir-radar.mjs
          node --check android/app/src/main/assets/radarx-pre-move.mjs
          node --check android/app/src/main/assets/radarx-move-radar.mjs
          test -f android/app/src/main/assets/pre-move-radar.html
          test -f android/app/src/main/assets/move-radar.html
          test -f android/app/src/main/java/com/radarx/app/RadarXBackgroundMonitorService.java
          test -f android/app/src/main/java/com/radarx/app/TradliActivity.java
          test -f android/app/src/main/java/com/radarx/app/MainActivity.java
          test -f android/app/src/main/assets/radar4-liquidity-absorption.html
          test -f android/app/src/main/assets/tradli.html
          test -f android/app/src/main/assets/bottom-radar.html
          test -f android/app/src/main/assets/kahir-radar.html
          test -f android/app/src/main/assets/king.html
          test -f android/app/src/main/assets/ai-agent-hub.html
          test -f android/app/src/main/java/com/radarx/app/BottomRadarActivity.java

      - name: Build signed universal Release APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/radarx-release.keystore
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Verify APK signature, package, and universal output
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          if (( ${#APKS[@]} != 1 )); then
            echo "::error::Expected exactly one Release APK; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}" || true
            exit 1
          fi

          if [[ "${APKS[0]}" != "$APK_DIR/app-release.apk" ]]; then
            echo "::error::Expected the universal Release APK at $APK_DIR/app-release.apk."
            exit 1
          fi

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "${APKS[0]}"

          PACKAGE="$("$AAPT" dump badging "${APKS[0]}" | sed -n "s/^package: name='\\([^']*\\)'.*$/\\1/p" | head -n 1)"
          if [[ "$PACKAGE" != "com.radarx.app" ]]; then
            echo "::error::Unexpected package: $PACKAGE"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/radarx-release"
          cp "${APKS[0]}" "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

          sha256sum "${RUNNER_TEMP}/radarx-release/radarx-release.apk"

      # Native background-service smoke was already validated successfully in APK 162.
      # Keep this release workflow deterministic; native Java service code is unchanged in this release.
      - name: Android 11 launch and background-service smoke
        if: false
        run: echo "Native smoke previously validated in APK 162; skipped for asset/backend-only release."

      - name: Publish signed APK GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v6.8.11-triple-radars-${GITHUB_RUN_NUMBER}"
          APK="${RUNNER_TEMP}/radarx-release/radarx-release.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RadarX Native — Six Independent Radars ${GITHUB_RUN_NUMBER}" \
            --notes "Signed universal APK built from ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}. Includes six numbered radars: المدمر, ملك الظلام, الجوكر, الكاسح, القاهر, and يوم القيامة. البروفيسور is an additional public-intelligence radar. Professor fuses public live-trade claims, realtime public news, and Binance public technical confirmation. Symbol Deep Scan is also included. Alerts identify the producing radar and detection time in 12-hour Asia/Aden format. Paper Trading only; real_order_execution=false."

      - name: Remove signing keystore before artifact upload
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/radarx-release.keystore"
          test ! -e "${RUNNER_TEMP}/radarx-release.keystore"

      - name: Upload verified APK only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radarx-release-apk
          path: ${{ runner.temp }}/radarx-release/radarx-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0