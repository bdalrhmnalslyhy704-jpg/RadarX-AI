name: RadarX Triple Radar CI
# Bottom Radar repair validation

on:
  push:
    branches:
      - phase3-triple-radar
      - phase4-symbol-deep-scan
      - phase4-symbol-deep-scan-testfix
      - phase5-fix-bottom-radar-enable-deep-scan
      - phase5-ci-runtime-timeout-hardening
      - phase6-radar4-independent-microstructure
      - phase5-kahir-independent-radar
      - fix-four-radars-runtime
      - fix-radar-runtime-return-market-data
      - radar6-doomsday-20261005
      - build224-multi-analyst-20261007
      - build224-doomsday-muqawim-sniper-v1
      - build224-falcon-eye-ogn-v1
      - build224-persistent-archive-20261009
      - feature/build224-event-breakout-integrated-v4-20261011
  pull_request:
    branches:
      - phase3-triple-radar
      - build224-multi-analyst-20261007
  workflow_dispatch:

permissions:
  contents: read

# Keep an active validation run alive when another update arrives.
concurrency:
  # Keep each commit's validation independent: a wedged emulator run must not
  # hold all newer PR heads behind a single concurrency slot.
  group: triple-radar-ci-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Run full test suite
        run: npm test
        timeout-minutes: 25

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical
        timeout-minutes: 5

      - name: Validate Triple Radar source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node --check phase2/core/falcon-eye-radar.mjs
          node --check phase2/core/rotation-lag-radar.mjs
          node --check phase2/market/universe-scanner.mjs
          node --check phase2/core/strong-move-radar.mjs
          node --check phase2/core/early-move-sentinel.mjs
          node --check phase2/core/symbol-deep-analyzer.mjs
          node --check phase2/core/liquidity-absorption-radar.mjs
          node --check phase2/core/kahir-radar.mjs
          node --check phase2/core/doomsday-radar.mjs
          node --check phase2/core/elite-confluence-gate.mjs
          node --check phase2/core/radar-alert-meta.mjs
          node --check phase2/core/multi-analyst-engine.mjs
          node --check android/app/src/main/assets/radarx-symbol-deep-scan.mjs
          node --check android/app/src/main/assets/radarx-backend-client.mjs
          node --check android/app/src/main/assets/radarx-doomsday-radar.mjs
          node --check android/app/src/main/assets/radarx-background-control.mjs
          node --check android/app/src/main/assets/radarx-radar-screen.mjs
          test -f android/app/src/main/assets/radar1-destroyer.html
          test -f android/app/src/main/assets/radar2-dark-king.html
          test -f android/app/src/main/assets/radar3-joker.html
          test -f android/app/src/main/assets/radar4-sweeper.html
          test -f android/app/src/main/assets/doomsday-radar.html
          test -f android/app/src/main/assets/falcon-eye-radar.html
          node android/backend-client-regression.mjs
          node android/background-monitor-regression.mjs
          node --test android/app/src/main/assets/tests/market-radar-integration.test.mjs

      - name: Set up Android build toolchain
        uses: actions/setup-java@v4
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        timeout-minutes: 5
        with:
          # Recent Google SDK repositories no longer publish the legacy "tools" package.
          packages: "platform-tools"

      - name: Assemble Android debug APK
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sdkmanager --licenses < <(yes) >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          gradle -p android :app:assembleDebug --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Android emulator online/offline background smoke
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: RADARX_APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk bash android/smoke-test.sh
